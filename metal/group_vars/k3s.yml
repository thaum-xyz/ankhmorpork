---
kube_vip_image: ghcr.io/kube-vip/kube-vip:v0.8.9
kube_vip_ip: "192.168.50.30"  # VIP IP managed by kube-vip

k3s_version: v1.37.2+k3s1
#k3s_master_ip: "{{ hostvars[groups['k3s_control_plane'][0]]['ansible_default_ipv4']['address'] }}"
k3s_master_ip: "{{ kube_vip_ip }}"

k3s_token: "{{ hostvars[groups['k3s_control_plane'][0]]['token'] }}"

# kubectl OIDC against pocket-id. The client is public -- PKCE, no secret -- so
# the ID is not sensitive; it ends up in every kubeconfig regardless. Emptying
# k3s_oidc_client_id makes the whole feature inert again: no config file, no
# apiserver arg, no restart. That is the way to back it out.
#
# The `oidc:k8s:cluster:admin` ClusterRoleBinding in
# k8s/platform/security/oidc-rbac/ must be live before this reaches an
# apiserver, or logins authenticate into a group holding no permissions.
k3s_oidc_issuer_url: "https://login.krupa.net.pl"
k3s_oidc_client_id: "f26be0a0-edc4-4e7e-b3ca-3e3852b3d011"

k3s_etcd_s3_access_key: "{{ lookup('env', 'S3_ACCESS_KEY') }}"
k3s_etcd_s3_secret_key: "{{ lookup('env', 'S3_SECRET_KEY') }}"

# Every registry is served from peers first (k3s embedded registry, Spegel),
# then upstream. Written on every node, agents included: a node without this
# file neither pulls from peers nor shares its own images.
k3s_registries:
  mirrors:
    "*":

k3s_server_config:
  disable:
  - servicelb
  - traefik
  - local-storage
  disable-cloud-controller: "true"
  kubelet-arg:
  - "system-reserved=cpu=100m,memory=230Mi"
  - "kube-reserved=cpu=200m,memory=100Mi"
  - "allowed-unsafe-sysctls=net.ipv4.tcp_adv_win_scale"
  kube-controller-manager-arg:
  - "bind-address=0.0.0.0"
  kube-scheduler-arg:
  - "bind-address=0.0.0.0"
  etcd-expose-metrics: "true"
  # Servers only; it switches the mirror on for agents too. Needs TCP 5001 and
  # 6443 between all nodes. Cilium reaches the apiserver on 127.0.0.1:6444.
  embedded-registry: "true"
  tls-san:
  - "{{ k3s_master_ip }}"

  etcd-s3: "true"
  etcd-s3-access-key: "{{ k3s_etcd_s3_access_key }}"
  etcd-s3-secret-key: "{{ k3s_etcd_s3_secret_key }}"
  etcd-s3-endpoint: fra1.digitaloceanspaces.com
  etcd-s3-bucket: etcd-thaum-xyz
  etcd-s3-folder: ankhmorpork

  # Structured AuthenticationConfiguration rather than the six oidc-* flags:
  # it is apiserver.config.k8s.io/v1 (GA) and hot-reloads, so claim and group
  # changes after this point cost no control-plane restart.
  kube-apiserver-arg: "{{ ['authentication-config=/etc/rancher/k3s/authentication-config.yaml'] if k3s_oidc_client_id | default('') | length > 0 else [] }}"
  resolv-conf: "/run/systemd/resolve/resolv.conf"
  flannel-backend: none
  disable-network-policy: "true"
  disable-kube-proxy: true
  # egress-selector-mode: disabled

k3s_agent_config:
  kubelet-arg:
  - "system-reserved=cpu=250m,memory=300Mi"
  - "kube-reserved=cpu=200m,memory=150Mi"
  - "allowed-unsafe-sysctls=net.ipv4.tcp_adv_win_scale"
  node-label:
  - "network.infra/bgp=65020"
  - "network.infra/type={{ network | default('fast') }}"
  - "storage.infra/local={{ 'false' if k3s_no_local_storage is defined else 'true' }}"
  kube-proxy-arg:
  - "metrics-bind-address=0.0.0.0"
  resolv-conf: "/run/systemd/resolve/resolv.conf"
