---
locales_present:
  - en_US.UTF-8
  - en_GB.UTF-8
unattended_automatic_reboot: false

# Mitigate ubuntu 20.04 -> 22.04 upgrade issue by specifying common KEX algorithms across both ubuntu versions.
# Without this change, ubuntu 22.04 will fail to start sshd daemon due to unsupported sntrup4591761x25519-sha512@tinyssh.org
# KEX algorithm which was replaced by sntrup761x25519-sha512@openssh.com in ubuntu 22.
ssh_kex:
- curve25519-sha256@libssh.org
- diffie-hellman-group-exchange-sha256

system_earlyoom_params: "-r 60 -m 4"

node_exporter_scripts:
  - name: apt
    exec: /usr/local/bin/apt_info.py
    url: "https://raw.githubusercontent.com/prometheus-community/node-exporter-textfile-collector-scripts/53d484331170e6f00237f0fbd6f4acae33064b87/apt_info.py"
  - name: smartmon
    exec: /usr/local/bin/smartmon.sh
    url: "https://raw.githubusercontent.com/prometheus-community/node-exporter-textfile-collector-scripts/53d484331170e6f00237f0fbd6f4acae33064b87/smartmon.sh"
  - name: lvm
    exec: /usr/local/bin/lvm.sh
    url: "https://raw.githubusercontent.com/prometheus-community/node-exporter-textfile-collector-scripts/53d484331170e6f00237f0fbd6f4acae33064b87/lvm-prom-collector"
    params: "-a"
