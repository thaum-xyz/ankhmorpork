---
- hosts: all
  become: true
  #collections:
  #- devsec.hardening
  roles:
  - { role: oefenweb.locales, when: (ansible_os_family == "Debian") }
  - { role: hifis.unattended_upgrades, when: (ansible_os_family == "Debian") }
  #- devsec.hardening.ssh_hardening
  #- prometheus.prometheus.systemd_exporter

- hosts: all
  become: true
  serial: 1
  roles:
  - paulfantom.system
  handlers:
  - name: restart systemd-logind
    systemd:
      name: systemd-logind
      state: restarted
  tasks:
  - name: Ensure snapd is removed
    apt:
      name: snapd
      state: absent
      purge: true
    when: ansible_os_family == "Debian"
  - name: Disable handling of lid switch by systemd-logind
    lineinfile:
      path: /etc/systemd/logind.conf
      regexp: '^#?HandleLidSwitch='
      line: 'HandleLidSwitch=ignore'
      state: present
      backup: yes
    notify: restart systemd-logind

- name: Kubernetes host-level requirements
  hosts: all
  become: true
  tasks:
  - name: Install nfs mount client software
    package:
      name: "{{ item }}"
      state: present
    with_items:
    - "{{ 'nfs-common' if (ansible_os_family | lower == 'debian') else 'nfs-utils' }}"
  - name: Install headers for the running kernel
    apt:
      name: "linux-headers-{{ ansible_kernel }}"
      state: present
    when: ansible_os_family == "Debian"
  - name: Install ubuntu addons when necessary
    package:
      name: ubuntu-restricted-addons
      state: present
    when: '"GenuineIntel" in ansible_processor'
  - name: Increase max_user_instances to prevent running out of inotify watches
    sysctl:
      name: fs.inotify.max_user_instances
      value: 512
      state: present
      reload: yes

# Multipathd needs to be configured to prevent colisions with longhorn
# More in https://longhorn.io/kb/troubleshooting-volume-with-multipath/
- name: Configure multipathd
  hosts: all
  become: true
  handlers:
  - name: restart multipathd
    systemd:
      name: multipathd
      state: restarted
  tasks:
  - name: Configure multipathd
    copy:
      content: |
        defaults {
            user_friendly_names yes
        }
        blacklist {
            devnode "^sd[a-z0-9]+"
        }
      dest: /etc/multipath.conf
      owner: root
      group: root
      mode: 0644
    notify: restart multipathd

- name: Block k3s start if LVM VG secondary-vg is not present
  hosts: all
  become: true
  tasks:
  - name: Create directory for systemd pre-check
    file:
      path: /etc/systemd/system/k3s.service.d
      state: directory
      owner: root
      group: root
      mode: 0755
  - name: Create systemd pre-check for k3s service
    copy:
      content: |
        [Service]
        ExecStartPre=vgs secondary-vg &>/dev/null
      dest: /etc/systemd/system/k3s.service.d/pre-check.service
      owner: root
      group: root
      mode: 0644

# Replaces the play that installed apt_info.py, smartmon.sh and lvm.sh. SMART is
# now collected by smartctl-exporter in-cluster; the apt and lvm collectors fed
# nothing (no rule or dashboard read node_volume_group_* or apt_upgrades_pending,
# and unattended-upgrades plus kured already handle patching). Ansible does not
# retract files, so this play removes them -- otherwise node-exporter keeps
# serving the last .prom written, forever, with no indication it is frozen.
# Once every host has run this, the play can go too.
- name: Remove Ansible textfile collectors
  hosts: all
  become: true
  tasks:
  - name: Drop the collector cronjobs
    file:
      path: /etc/cron.d/metrics
      state: absent
  - name: Drop the collector scripts
    file:
      path: "{{ item }}"
      state: absent
    loop:
    - /usr/local/bin/apt_info.py
    - /usr/local/bin/smartmon.sh
    - /usr/local/bin/lvm.sh
  # The directory itself stays: it is the hostPath node-exporter reads, and
  # lvm-diskprep writes there once it is enabled.
  - name: Drop the stale metric files
    file:
      path: "/var/lib/node_exporter/{{ item }}.prom"
      state: absent
    loop:
    - apt
    - smartmon
    - lvm
