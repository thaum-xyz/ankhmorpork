apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
spec:
  # Pinned: resource names derive from the release name, and postgres-rw is
  # hardcoded by this app's consumers.
  releaseName: postgres
  chart:
    spec:
      chart: cnpg-database
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: thaum-charts
      interval: 5m
  interval: 30m
  timeout: 10m
  install:
    # Helm's waiter cannot judge a CNPG Cluster, and install remediation would
    # uninstall the release -- deleting the adopted Cluster and its PVCs.
    disableWait: true
  upgrade:
    disableWait: true
    remediation:
      retries: 0
  uninstall:
    deletionPropagation: orphan
  # warn, not enabled: enabled would fight CNPG's own defaulted fields forever.
  driftDetection:
    mode: warn
  values:
    database: drum
    owner: drum
    cluster:
      instances: 2
      storage:
        size: 1Gi
      resources:
        limits:
          cpu: 400m
          memory: 420Mi
        requests:
          cpu: 100m
          memory: 256Mi
      annotations:
        # Carried through Helm so a later values change removes it via three-way
        # merge. Dropped once adoption is confirmed.
        kustomize.toolkit.fluxcd.io/prune: disabled
    backup:
      schedule: "0 30 23 * * *"
      objectStore:
        retentionPolicy: 30d
        pathSuffix: mended-drum
    externalSecrets:
      admin:
        remoteKey: MENDED_DRUM_DB_ADMIN_PASS
      user:
        remoteKey: MENDED_DRUM_DB_PASS
