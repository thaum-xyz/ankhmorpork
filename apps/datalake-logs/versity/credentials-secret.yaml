apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: versitygw-credentials
spec:
  # Minted once. The gateway reads its root credentials at startup, so a
  # refresh would desync it from Loki.
  refreshInterval: "0"
  target:
    name: versitygw-credentials
    template:
      data:
        # What the versitygw chart looks for.
        rootAccessKeyId: "{{ .accessKey }}"
        rootSecretAccessKey: "{{ .secretKey }}"
        # What Loki expands via -config.expand-env=true.
        S3_ACCESS_KEY: "{{ .accessKey }}"
        S3_SECRET_KEY: "{{ .secretKey }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: versitygw-root
