# Chart reference: https://github.com/grafana-community/helm-charts/tree/main/charts/loki

# Chart 18.x defaults to Monolithic; keep the existing write/read/backend split.
deploymentMode: SimpleScalable

# No ingress. Alloy ships logs in-cluster and Grafana reads over the internal
# Service, so nothing needs to reach Loki from outside.
ingress:
  enabled: false
gateway:
  enabled: false

minio:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
tableManager:
  enabled: false
networkPolicy:
  enabled: false

write:
  replicas: 3
  autoscaling:
    enabled: false
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: versitygw-credentials
  persistence:
    size: 20Gi
    storageClass: lvm-thin

read:
  replicas: 2
  autoscaling:
    enabled: false
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: versitygw-credentials

backend:
  replicas: 2
  autoscaling:
    enabled: false
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: versitygw-credentials
  persistence:
    size: 2Gi
    storageClass: longhorn

# Chart defaults are 8Gi and 1Gi of memcached, which is not sensible on four
# nodes. These only trade memory for query speed.
chunksCache:
  allocatedMemory: 512
resultsCache:
  allocatedMemory: 128

monitoring:
  serviceMonitor:
    enabled: true
  rules:
    enabled: true
  dashboards:
    enabled: true

loki:
  auth_enabled: false
  analytics:
    reporting_enabled: false

  # Required from chart 6.x: no schema is assumed. Single entry from the
  # cutover, since the old data is not being carried over.
  schemaConfig:
    configs:
      - from: "2026-08-18"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 4320h  # 6 months
  compactor:
    retention_enabled: true
    # Loki 3.x requires this once retention is on.
    delete_request_store: s3

  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
    s3:
      endpoint: http://versitygw.datalake-logs.svc.cluster.local:7070
      s3ForcePathStyle: true
      insecure: true
      accessKeyId: "${S3_ACCESS_KEY}"
      secretAccessKey: "${S3_SECRET_KEY}"
