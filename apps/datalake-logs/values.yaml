# Chart reference: https://github.com/grafana-community/helm-charts/tree/main/charts/loki

# Monolithic: every component in one process. Memberlist is still configured,
# but with a single replica the ring is single-member and self-consistent, which
# is what removes the failure that broke the previous simple-scalable install
# (index gateway reporting unhealthy instances, backend asking for 2 replicas
# with 1 running). Upstream rates this for a few tens of GB/day; this cluster
# holds roughly 400MB of on-disk pod logs per node. Simple-scalable is also
# deprecated and removed in Loki 4.
#
# Deliberately one replica: more than one reintroduces the memberlist ring and
# gives back the simplicity. Alloy buffers and retries while this restarts.
deploymentMode: Monolithic

singleBinary:
  replicas: 1
  # The chart already passes -config.expand-env=true.
  extraEnvFrom:
    - secretRef:
        name: versitygw-credentials
  persistence:
    enabled: true
    size: 10Gi
    # Replicated rather than node-local, so the single replica can reschedule
    # when a node reboots.
    storageClass: longhorn

# Not used in monolithic mode.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# No ingress. Alloy ships logs in-cluster and Grafana reads over the internal
# Service, so nothing needs to reach Loki from outside.
ingress:
  enabled: false
gateway:
  enabled: false

# Chunks live in S3; at this query volume memcached earns nothing.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

minio:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
tableManager:
  enabled: false
networkPolicy:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
  rules:
    enabled: true
  dashboards:
    enabled: true

loki:
  auth_enabled: false
  analytics:
    reporting_enabled: false

  # Required from chart 6.x: no schema is assumed. Single entry from the
  # cutover, since the old data is not being carried over.
  schemaConfig:
    configs:
      - from: "2026-08-18"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 4320h  # 6 months
  compactor:
    retention_enabled: true
    # Loki 3.x requires this once retention is on.
    delete_request_store: s3

  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
    s3:
      endpoint: http://versitygw.datalake-logs.svc.cluster.local:7070
      s3ForcePathStyle: true
      insecure: true
      accessKeyId: "${S3_ACCESS_KEY}"
      secretAccessKey: "${S3_SECRET_KEY}"
