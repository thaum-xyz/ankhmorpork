apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-bucket
spec:
  # The Secret is generated, so the credentials are no longer the plaintext pair
  # that used to sit in config.yaml in git. Read them by key instead of envFrom.
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          env:
            - name: BUCKET_NAME
              value: thanos
            # 7070, not 80: the chart's Service uses the gateway's own default
            # port rather than the 80 the hand-written manifests exposed.
            - name: VGW_ENDPOINT
              value: http://versitygw:7070
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: versitygw-credentials
                  key: rootAccessKeyId
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: versitygw-credentials
                  key: rootSecretAccessKey
          command: ["/bin/sh", "-lc"]
          args:
            - |
              mc alias set vgw "$VGW_ENDPOINT" "$ACCESS_KEY" "$SECRET_KEY" --api S3v4
              mc mb --ignore-existing vgw/$BUCKET_NAME
