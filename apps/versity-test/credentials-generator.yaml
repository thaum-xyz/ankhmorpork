# Root S3 credentials for this gateway instance.
#
# Generated in-cluster rather than kept in Doppler: versity is deployed next to
# whatever consumes it, so both sides read this Secret from the same namespace
# and no human or out-of-cluster system ever needs the value. Doppler is for the
# exception -- an instance that has to be reachable from outside the cluster.
#
# Losing these is not a data-loss event. versitygw is a gateway over a POSIX
# filesystem, so the objects stay readable as plain files on the NFS share; the
# recovery is to regenerate and reconfigure the consumer, not to restore data.
#
# symbols: 0 is deliberate. SigV4 itself is fine with them, but plenty of S3
# clients mishandle "/" and "+" inside a secret key.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: versitygw-root
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
  # One generator, two independently generated values.
  secretKeys:
    - accessKey
    - secretKey
