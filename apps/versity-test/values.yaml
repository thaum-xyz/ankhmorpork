# Config reference: https://github.com/versity/versitygw/blob/main/chart/values.yaml

# Pinned. The chart defaults to :latest, which would silently move the gateway
# under its own data.
image:
  tag: "v1.7.0"

auth:
  # Generated by credentials-generator.yaml; keys rootAccessKeyId and
  # rootSecretAccessKey are what the chart looks for.
  existingSecret: versitygw-credentials

gateway:
  backend:
    type: posix
    args: "/mnt/data"
    # The posix backend normally keeps S3 metadata in extended attributes, which
    # NFSv3 cannot do -- that is where "versitygw needs NFSv4" comes from. The
    # sidecar keeps it as ordinary files under a separate path instead, so the
    # whole thing runs on UniFi Drive. Verified: 20MB multipart, object tagging
    # and a byte-identical 5MB round-trip with both paths on nfsvers=3.
    sidecarDir: "/mnt/metadata"

# One PVC, with the chart mounting data/ and metadata/ from it as subPaths.
# ReadWriteMany because the underlying share is NFS and a single RWO claim would
# pin the gateway to one node for no reason.
persistence:
  enabled: true
  create: true
  size: 10Gi
  storageClassName: unifi-nas
  accessMode: ReadWriteMany

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi
