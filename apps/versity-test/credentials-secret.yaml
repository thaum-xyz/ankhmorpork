apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: versitygw-credentials
spec:
  # Minted once, never rotated: versitygw reads the root credentials at startup
  # and consumers cache them, so a refresh would silently desync the two.
  refreshInterval: "0"
  target:
    name: versitygw-credentials
    template:
      data:
        # Key names the chart expects for auth.existingSecret.
        rootAccessKeyId: "{{ .accessKey }}"
        rootSecretAccessKey: "{{ .secretKey }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: versitygw-root
