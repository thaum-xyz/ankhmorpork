# Config reference: https://github.com/jellyfin/jellyfin-helm/blob/master/charts/jellyfin/values.yaml

jellyfin:
  enableDLNA: false

# Ingress is carried outside the chart, see ingress.yaml
ingress:
  enabled: false

nodeSelector:
  intel.feature.node.kubernetes.io/gpu: "true"

# Prefer nodes with gpu.intel.com/family: A_Series label
# Prefer non-control-plane nodes
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        preference:
          matchExpressions:
            - key: gpu.intel.com/family
              operator: In
              values:
                - A_Series
      - weight: 1
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

resources:
  requests:
    memory: "1Gi"
  limits:
    gpu.intel.com/i915: "1"

persistence:
  config:
    enabled: true
    storageClass: "longhorn"
    accessMode: ReadWriteOnce
    size: 5Gi
  # Chart 3.x offers a single media claim; the three NFS shares are mounted
  # below instead. Both render an emptyDir at /media and /cache.
  media:
    enabled: false
  cache:
    enabled: false

volumes:
  - name: media-tv
    persistentVolumeClaim:
      claimName: media-tv
  - name: media-movies
    persistentVolumeClaim:
      claimName: media-movies
  - name: media-books
    persistentVolumeClaim:
      claimName: media-books
  - name: transcodes
    emptyDir:
      medium: Memory
      sizeLimit: 2Gi

volumeMounts:
  - name: media-tv
    mountPath: /media/tv
  - name: media-movies
    mountPath: /media/movies
  - name: media-books
    mountPath: /media/books
  - name: transcodes
    mountPath: /cache/transcodes

# postStart hook flips EnableMetrics in system.xml, so it survives a config reset.
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
