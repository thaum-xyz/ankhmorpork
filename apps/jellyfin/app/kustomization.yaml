apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - repository.yaml
  - release.yaml
  - ingress.yaml
  - middlewares.yaml
  - homerservice.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: values
    files:
      - values.yaml=values.yaml
