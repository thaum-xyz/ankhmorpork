# Reference documentation: https://artifacthub.io/packages/helm/kured/kured

configuration:
  annotateNodes: true
  concurrency: 1
  # Abort drain after this time
  drainTimeout: "2h"
  period: "2h"
  rebootDays:
  - mo
  - we
  - th
  startTime: "07:00:00"
  endTime: "12:00:00"
  lockReleaseDelay: "1h"
  # Without a TTL an interrupted holder strands the lock forever -- restarting
  # the daemonset mid-reboot does exactly that, since the release delay is
  # only held in memory. Longer than a real cycle (drain + reboot + delay).
  lockTtl: "3h"

resources:
  limits:
    cpu: 10m
    memory: 128Mi
  requests:
    cpu: 3m
    memory: 64Mi

# Per-node kill switch: relabel a node kured=disabled to stop it rebooting.
# Turning one back on: relabel first, then clear the DaemonSet's
# weave.works/kured-node-lock annotation -- that order, or it reboots at once.
nodeSelector:
  kured: enabled

metrics:
  create: true

service:
  create: true
