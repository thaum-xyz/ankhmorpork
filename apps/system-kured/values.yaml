# Reference documentation: https://artifacthub.io/packages/helm/kured/kured

configuration:
  annotateNodes: true
  concurrency: 1
  # Abort drain after this time
  drainTimeout: "2h"
  period: "2h"
  rebootDays:
  - mo
  - we
  - th
  startTime: "07:00:00"
  endTime: "12:00:00"
  lockReleaseDelay: "1h"

resources:
  limits:
    cpu: 10m
    memory: 128Mi
  requests:
    cpu: 3m
    memory: 64Mi

# Nodes are labelled kured=disabled, so this matches nothing and kured runs 0 pods.
# To re-enable: relabel kured=enabled, THEN clear the DaemonSet's
# weave.works/kured-node-lock annotation -- that order, or it reboots immediately.
nodeSelector:
  kured: enabled

metrics:
  create: true

service:
  create: true
