# Reference documentation: https://artifacthub.io/packages/helm/kured/kured

configuration:
  annotateNodes: true
  concurrency: 1
  # Abort drain after this time
  drainTimeout: "2h"
  # TEMPORARY: 2h/1h cannot clear a 4-node backlog inside the 5h window.
  # Revert to period 2h / lockReleaseDelay 1h once every node is rebooted.
  period: "1m"
  rebootDays:
  - mo
  - we
  - th
  startTime: "07:00:00"
  endTime: "12:00:00"
  lockReleaseDelay: "5m"

resources:
  limits:
    cpu: 10m
    memory: 128Mi
  requests:
    cpu: 3m
    memory: 64Mi

# Per-node kill switch: relabel a node kured=disabled to stop it rebooting.
# Turning one back on: relabel first, then clear the DaemonSet's
# weave.works/kured-node-lock annotation -- that order, or it reboots at once.
nodeSelector:
  kured: enabled

metrics:
  create: true

service:
  create: true
