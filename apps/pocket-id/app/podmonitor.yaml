apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pocket-id
  labels:
    app.kubernetes.io/name: pocket-id
spec:
  podMetricsEndpoints:
    # The metrics port is added to the container by a postRenderer in
    # release.yaml -- the chart declares only the app port. This was previously
    # a ServiceMonitor scraping /metrics off that app port, which never returned
    # anything: the OTel Prometheus reader listens on a socket of its own.
    - interval: 30s
      port: metrics
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
      app.kubernetes.io/instance: pocket-id
