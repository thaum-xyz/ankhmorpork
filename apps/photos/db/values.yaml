database: immich
owner: immich

cluster:
  instances: 3
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.5-0.4.3
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
  # Requests only, no limits, matching the live spec.
  resources:
    requests:
      cpu: 50m
      memory: 500Mi
  postgresql:
    shared_preload_libraries:
      - vchord.so
  bootstrap:
    postInitApplicationSQL:
      - 'CREATE EXTENSION IF NOT EXISTS vchord CASCADE;'
      - 'CREATE EXTENSION IF NOT EXISTS cube WITH SCHEMA pg_catalog;'
      - 'CREATE EXTENSION IF NOT EXISTS earthdistance WITH SCHEMA pg_catalog;'

backup:
  schedule: "0 13 2 * * *"
  objectStore:
    retentionPolicy: 14d
    pathSuffix: photos

externalSecrets:
  admin:
    remoteKey: IMMICH_POSTGRES_ADMIN_PASS
  user:
    remoteKey: IMMICH_POSTGRES_PASS
