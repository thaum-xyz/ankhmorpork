apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  # data-pvc is ReadWriteOnce, so a rolling update deadlocks: the replacement
  # is scheduled before the old pod releases the volume, and if it lands on a
  # different node it sits in ContainerCreating forever while the old pod waits
  # for it to become ready. That is exactly how the meilisearch bump stalled for
  # four days. Recreate takes the old pod down first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karakeep-web
  template:
    metadata:
      labels:
        app: karakeep-web
    spec:
      containers:
        - name: web
          image: ghcr.io/karakeep-app/karakeep:0.32.0
          ports:
            - containerPort: 3000
          env:
            # Only cosmetic -- shown in the UI footer -- but it is read from the
            # environment rather than the binary, so it has to track the tag.
            - name: KARAKEEP_VERSION
              value: "0.32.0"
            - name: MEILI_ADDR
              value: http://meilisearch:7700
            - name: BROWSER_WEB_URL
              value: http://chrome:9222
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - mountPath: /data
              name: data
          envFrom:
            - secretRef:
                name: karakeep-secrets
            - configMapRef:
                name: karakeep-configuration
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
