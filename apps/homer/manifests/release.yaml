apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homer-k8s
  namespace: homer
spec:
  chart:
    spec:
      chart: homer-k8s
      version: "0.5.1"
      sourceRef:
        kind: HelmRepository
        name: homer-k8s
        namespace: homer
      interval: 15m
  interval: 30m
  timeout: 10m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: homer-values
