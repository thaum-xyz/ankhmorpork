# Config reference: https://github.com/BananaOps/homer-k8s/blob/main/helm/homer-k8s/values.yaml
#
# The chart runs homer plus a controller that renders the services section from
# HomerServices resources. Everything outside that section lives here.

# Keeps the Service named "homer", which both Ingresses already point at.
fullnameOverride: homer

homer:
  image:
    repository: b4bz/homer
    tag: v26.4.2
  config: |
    title: "Ankhmorpork portal"
    subtitle: "thaum"
    icon: "fas fa-sitemap"

    header: true
    footer: false

    theme: default
    colors:
      light:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#f5f5f5"
        card-background: "#ffffff"
        text: "#363636"
        text-header: "#ffffff"
        text-title: "#303030"
        text-subtitle: "#424242"
        card-shadow: rgba(0, 0, 0, 0.1)
        link-hover: "#363636"
      dark:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#131313"
        card-background: "#2b2b2b"
        text: "#eaeaea"
        text-header: "#ffffff"
        text-title: "#fafafa"
        text-subtitle: "#f5f5f5"
        card-shadow: rgba(0, 0, 0, 0.4)
        link-hover: "#ffdd57"

    links:
      - name: Status Page
        icon: "fa fa-question"
        url: "https://thaum.statuspage.io/"
      - name: Passwords
        icon: "fa fa-key"
        url: "https://vault.bitwarden.com/"

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi
