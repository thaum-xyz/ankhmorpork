# Config reference: https://github.com/Stirling-Tools/Stirling-PDF-chart/tree/main/charts/stirling-pdf

kind: Deployment

# The chart's newest release (3.1.0, Feb 2026) still pins appVersion 2.5.1, so the
# app is pinned here instead of waiting for the chart to catch up.
image:
  tag: "2.14.2"

resources:

ingress:
  enabled: true
  # External again, but every request terminates at the oauth2-proxy sidecar first
  # (see service.targetPort), so Stirling is never reached unauthenticated.
  ingressClassName: public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    reloader.homer/group: Ankh Cloud
    reloader.homer/logo: https://cdn.jsdelivr.net/npm/@loganmarchione/homelab-svg-assets@latest/assets/stirlingpdf.svg
    reloader.homer/name: Stirling PDF
    reloader.homer/subtitle: PDF manipulation tool
  labels:
    probe: enabled
    reloader.homer/enabled: "true"
  hosts:
    - name: pdf.krupa.net.pl
      path: /
      tls: true
      tlsSecret: pdf.krupa.net.pl

service:
  # Named port on the oauth2-proxy sidecar rather than Stirling's own http port.
  # Without this the Service would bypass the proxy entirely.
  targetPort: oauth2

deployment:
  sidecarContainers:
    oauth2:
      image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
      ports:
        - name: oauth2
          containerPort: 4180
      args:
        - --provider=oidc
        - --oidc-issuer-url=https://login.krupa.net.pl
        - --redirect-url=https://pdf.krupa.net.pl/oauth2/callback
        - --http-address=0.0.0.0:4180
        # Stirling listens on localhost in this pod; it is never published.
        - --upstream=http://127.0.0.1:8080
        # Authorisation lives in pocket-id: the client is group-restricted, so
        # IsUserGroupAllowedToAuthorize refuses to issue a token for anyone
        # outside the allowed groups and this proxy never sees them. Keeping a
        # second allow-list here would only be one more thing to drift.
        # email_domain must still be set to something -- unset it defaults to
        # allowing nothing and would reject every address.
        - --email-domain=*
        - --scope=openid email profile
        # Behind an ingress, so trust X-Forwarded-* for redirect construction.
        - --reverse-proxy=true
        - --cookie-secure=true
        # Straight to pocket-id rather than showing an interstitial sign-in page.
        - --skip-provider-button=true
      env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: stirling-pdf-oidc
              key: clientID
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: stirling-pdf-oidc
              key: clientSecret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: stirling-pdf-oauth2-cookie
              key: password
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi

# The chart defaults to initialDelaySeconds 5 with failureThreshold 3 on a
# 10s period, giving the app 25s to answer before liveness restarts it. Stirling
# takes ~12s to boot on an idle node, so the margin is thin enough that a busy
# node turns a slow start into a restart loop. The chart exposes no startupProbe,
# so the budget is widened here instead.
#
# Note these are on the stirling container and kubelet dials it directly, so the
# oauth2-proxy sidecar is not in the path -- probe failures are never an auth
# problem.
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
    successThreshold: 1
    failureThreshold: 6
  readiness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
    successThreshold: 1
    failureThreshold: 12

serviceMonitor:
  # Stays disabled on v2, but for a different reason than before. The metrics do
  # exist now -- Spring MeterRegistry, plus ClusterMetrics -- but the scrape
  # endpoint is gated behind the paid tier. EnterpriseEndpointFilter returns 404
  # for any /actuator/ path except health checks unless the instance is running
  # Pro or higher, so enabling this would scrape a 404.
  # METRICS_ENABLED below drives internal usage recording only, not the endpoint.
  # https://github.com/Stirling-Tools/Stirling-PDF/issues/1887
  enabled: false

envs:
# Login is off, which makes every endpoint public: SecurityConfiguration falls
# through to `anyRequest().permitAll()` and installs no authentication filter. It
# also disables X-Frame-Options automatically.
#
# That is safe only because the oauth2-proxy sidecar terminates every request
# first and the Service points at it, not at Stirling. Do NOT re-enable login
# expecting SSO from it: OAuth2 is licence-gated in v2 -- isOAuthEligible blocks
# both non-grandfathered users and auto-creation -- which is exactly why
# authentication lives in the proxy instead.
- name: SECURITY_ENABLELOGIN
  value: "false"
# Hides the settings button while login is disabled, so anonymous users are not
# offered an admin surface.
- name: SYSTEM_SHOWSETTINGSWHENNOLOGIN
  value: "false"
# Suppresses the first-launch analytics prompt and the desktop-app slide, which
# together are the onboarding flow. Left null, the analytics toggle re-prompts on
# every start, because the config lives on an emptyDir.
- name: SYSTEM_ENABLEANALYTICS
  value: "false"
- name: SYSTEM_ENABLEDESKTOPINSTALLSLIDE
  value: "false"
- name: UI_APP_NAME
  value: "Stirling PDF"
- name: UI_HOME_DESCRIPTION
  value: "PDF manipulation tool"
- name: UI_APP_NAVBAR_NAME
  value: "PDF manipulation"
- name: ALLOW_GOOGLE_VISIBILITY
  value: "false"
- name: SYSTEM_SHOWUPDATE
  value: "false"
- name: METRICS_ENABLED
  value: "true"
- name: LANGS
  value: "en-US,pl-PL,de-DE"
