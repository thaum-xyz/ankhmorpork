# Config reference: https://github.com/Stirling-Tools/Stirling-PDF-chart/tree/main/charts/stirling-pdf

kind: Deployment

resources:

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    reloader.homer/group: Ankh Cloud
    reloader.homer/logo: https://cdn.jsdelivr.net/npm/@loganmarchione/homelab-svg-assets@latest/assets/stirlingpdf.svg
    reloader.homer/name: Stirling PDF
    reloader.homer/subtitle: PDF manipulation tool
  labels:
    probe: enabled
    reloader.homer/enabled: "true"
  hosts:
    - name: pdf.krupa.net.pl
      path: /
      tls: true
      tlsSecret: pdf.krupa.net.pl

serviceMonitor:
  # Stays disabled on v2, but for a different reason than before. The metrics do
  # exist now -- Spring MeterRegistry, plus ClusterMetrics -- but the scrape
  # endpoint is gated behind the paid tier. EnterpriseEndpointFilter returns 404
  # for any /actuator/ path except health checks unless the instance is running
  # Pro or higher, so enabling this would scrape a 404.
  # METRICS_ENABLED below drives internal usage recording only, not the endpoint.
  # https://github.com/Stirling-Tools/Stirling-PDF/issues/1887
  enabled: false

envs:
# --- SSO through pocket-id -------------------------------------------------
# loginMethod stays "all" for now. Tightening it to "oauth2" disables password
# login entirely, which is the goal -- but only once an SSO login has been shown
# to come back with ROLE_ADMIN. Setting it before that verification risks locking
# admin out with no local fallback.
- name: SECURITY_ENABLELOGIN
  value: "true"
- name: SECURITY_LOGINMETHOD
  value: "all"
- name: SECURITY_OAUTH2_ENABLED
  value: "true"
- name: SECURITY_OAUTH2_ISSUER
  value: "https://login.krupa.net.pl"
# Becomes the Spring registrationId, so the redirect URI is
# https://pdf.krupa.net.pl/login/oauth2/code/pocket-id and must match pocket-id.
- name: SECURITY_OAUTH2_PROVIDER
  value: "pocket-id"
- name: SECURITY_OAUTH2_SCOPES
  value: "openid,profile,email"
# Must match the seeded admin username, or SSO creates a second, non-admin user.
- name: SECURITY_OAUTH2_USEASUSERNAME
  value: "email"
- name: SECURITY_OAUTH2_AUTOCREATEUSER
  value: "true"
- name: SECURITY_OAUTH2_CLIENTID
  valueFrom:
    secretKeyRef:
      name: stirling-pdf-oidc
      key: clientID
- name: SECURITY_OAUTH2_CLIENTSECRET
  valueFrom:
    secretKeyRef:
      name: stirling-pdf-oidc
      key: clientSecret
- name: SECURITY_INITIALLOGIN_USERNAME
  valueFrom:
    secretKeyRef:
      name: stirling-pdf-admin
      key: username
- name: SECURITY_INITIALLOGIN_PASSWORD
  valueFrom:
    secretKeyRef:
      name: stirling-pdf-admin
      key: password
# ---------------------------------------------------------------------------
- name: UI_APP_NAME
  value: "Stirling PDF"
- name: UI_HOME_DESCRIPTION
  value: "PDF manipulation tool"
- name: UI_APP_NAVBAR_NAME
  value: "PDF manipulation"
- name: ALLOW_GOOGLE_VISIBILITY
  value: "false"
- name: SYSTEM_SHOWUPDATE
  value: "false"
- name: METRICS_ENABLED
  value: "true"
- name: LANGS
  value: "en-US,pl-PL,de-DE"
