apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stirling-pdf
resources:
  - repository.yaml
  - namespace.yaml
  - release.yaml
  - ingress-cloudflare.yaml
  - oidc-secret.yaml
  - admin-secret.yaml
configMapGenerator:
  - name: values
    files:
      - values.yaml=values.yaml
# Stable ConfigMap name: helm-controller tracks values through
# status.lastAttemptedConfigDigest, so the hash suffix is not needed, and
# without it there is no generated name for nameReference to rewrite -- which is
# all kustomizeconfig.yaml did.
generatorOptions:
  disableNameSuffixHash: true
