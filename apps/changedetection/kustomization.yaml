apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: changedetection
resources:
  - repository.yaml
  - namespace.yaml
  - release.yaml
  - playwright-deploy.yaml
  - playwright-svc.yaml
  - oauth2-proxy.yaml
  - oidc-secret.yaml
  - ingress.yaml
  - ingress-cloudflare.yaml
configMapGenerator:
  - name: values
    files:
      - values.yaml=values.yaml
# Stable ConfigMap name: helm-controller tracks values through
# status.lastAttemptedConfigDigest, so the hash suffix is not needed to detect
# changes, and without it there is no name for nameReference to rewrite -- which
# is what kustomizeconfig.yaml exists for elsewhere in this repo.
generatorOptions:
  disableNameSuffixHash: true
