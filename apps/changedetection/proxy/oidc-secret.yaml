# Credentials for the oauth2-proxy in front of changedetection. Nothing here
# reaches the app itself, which has no login of its own -- the proxy is the
# authentication boundary.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: changedetection-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    name: changedetection-oidc
  data:
    - remoteRef:
        key: CHANGEDETECTION_OIDC_CLIENT_ID
      secretKey: clientID
    - remoteRef:
        key: CHANGEDETECTION_OIDC_CLIENT_SECRET
      secretKey: clientSecret
