apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright
  labels:
    app: playwright
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playwright
  template:
    metadata:
      labels:
        app: playwright
    spec:
      containers:
      - name: playwright
        # Upstream publishes no moving semver tag -- :latest is ahead of the
        # newest release tag -- so pin the digest to keep restarts reproducible
        # and give Renovate something to bump.
        image: dgtlmoon/sockpuppetbrowser:latest@sha256:7116c61ef9cfce3d48a7efd9355d2fbe19f593ea3cfb52a5ded40ecbcb0a3f9d
        ports:
          - containerPort: 3000
        env:
          - name: DEFAULT_LAUNCH_ARGS
            value: '["--window-size=1920,1080"]'
        resources:
          limits:
            memory: "1000Mi"
            cpu: "1"
