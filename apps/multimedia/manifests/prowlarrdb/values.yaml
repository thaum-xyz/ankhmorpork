database: prowlarr
owner: prowlarr

cluster:
  instances: 2
  storage:
    size: 10Gi
  # Requests only, no limits, matching the live spec.
  resources:
    requests:
      cpu: 130m
      memory: 300Mi
  bootstrap:
    postInitSQL:
      - CREATE DATABASE logs;
      - ALTER DATABASE logs OWNER TO prowlarr;
  annotations:
    # Keeps the Cluster out of the Kustomization's prune inventory while the old
    # manifests are removed. Dropped once adoption is confirmed.
    kustomize.toolkit.fluxcd.io/prune: disabled

backup:
  schedule: "0 7 3 * * *"
  objectStore:
    # Three clusters share this namespace, so each needs its own store.
    name: backblaze-prowlarr
    retentionPolicy: 7d
    pathSuffix: prowlarr

externalSecrets:
  admin:
    remoteKey: PROWLARR_DB_ADMIN_PASS
  user:
    remoteKey: PROWLARR_DB_PASS
