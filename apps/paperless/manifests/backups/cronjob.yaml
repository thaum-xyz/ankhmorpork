apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/name: paperless
  name: paperless-backup
  namespace: paperless
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 2
  schedule: 36 22 * * *
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
            app.kubernetes.io/name: paperless
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/component: webservice
                      app.kubernetes.io/name: paperless
                  topologyKey: kubernetes.io/hostname
          initContainers:
            - command:
                - sh
                - -c
                # best effort: the NAS refuses mode changes over NFS
                - chmod 0777 /export || true
              image: busybox
              name: permissions
              volumeMounts:
                - mountPath: /export
                  name: backups
            - command:
                - sh
                - -c
                - find /export -mtime +20 -type f -delete
              image: busybox
              name: cleanup
              volumeMounts:
                - mountPath: /export
                  name: backups
          containers:
            # Calling manage.py directly bypasses s6, so none of the paperless
            # services start. The document_exporter wrapper is not usable here:
            # it is with-contenv and needs an environment only s6 assembles.
            # --skip-checks because init-tesseract-langs, which installs the pol
            # pack that paperless-config asks for, is part of that same init.
            - command:
                - python3
                - manage.py
                - document_exporter
                - /export
                - --skip-checks
              workingDir: /usr/src/paperless/src
              args: []
              env: []
              envFrom:
                - configMapRef:
                    name: paperless-config
                - secretRef:
                    name: paperless-secrets
                - secretRef:
                    name: paperless-db
              image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5
              name: backup
              ports: []
              resources: {}
              securityContext:
                privileged: false
                runAsUser: 1000
                runAsGroup: 1000
              volumeMounts:
                - mountPath: /usr/src/paperless/data
                  name: data
                - mountPath: /usr/src/paperless/media
                  name: media
                - mountPath: /usr/src/paperless/consume
                  name: consume
                - mountPath: /export
                  name: backups
          restartPolicy: Never
          serviceAccountName: paperless
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: paperless-data
            - name: media
              persistentVolumeClaim:
                claimName: paperless-media
            - name: consume
              persistentVolumeClaim:
                claimName: consume
            - name: backups
              persistentVolumeClaim:
                claimName: backups
