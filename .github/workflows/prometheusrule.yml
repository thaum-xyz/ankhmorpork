---
name: prom-rules

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  golang-version: 1.27.1
  yq-version: v4.53.6

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.golang-version }}'
      - run: go install github.com/mikefarah/yq/v4@${{ env.yq-version }}
      - run: ./hack/unpack-prometheus-rules.sh
      - name: Run pint
        uses: prymitive/pint-action@v1
        with:
          token: ${{ github.token }}
          # directory containing Prometheus rules
          workdir: 'tmp/rules'
