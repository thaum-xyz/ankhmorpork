---
name: kubescape

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  kubescape-version: v4.0.11

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download kubescape
        env:
          VERSION: ${{ env.kubescape-version }}
        run: |
          curl -sSL --fail \
            "https://github.com/kubescape/kubescape/releases/download/${VERSION}/kubescape_${VERSION#v}_linux_amd64" \
            -o /usr/local/bin/kubescape
          chmod +x /usr/local/bin/kubescape
          kubescape version
      - run: make kubescape
