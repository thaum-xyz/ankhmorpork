# Config reference: https://github.com/deliveryhero/helm-charts/blob/master/stable/node-problem-detector/values.yaml

metrics:
  enabled: true
  serviceMonitor:
    enabled: true

  prometheusRule:
    enabled: true
    defaultRules:
      disabled:
        # Docker reasons: k3s runs containerd and only kernel/readonly monitors
        # are loaded, so these never fire.
        - NodeProblemDockerHung
        - NodeProblemDockerContainerStartupFailure
        - NodeProblemCorruptDockerOverlay2
        - NodeProblemCorruptDockerImage
        - NodeProblemGaugeCorruptDockerOverlay2
        - NodeProblemGaugeDockerHung
        # Replaced below; defaults are increase[2m] with for=1s, which resolves
        # before it can be routed.
        - NodeProblemIOError
        - NodeProblemTaskHung
    additionalRules:
      - alert: NodeProblemIOError
        expr: increase(problem_counter{reason="IOError"}[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Kernel I/O errors
          description: '{{ $value | printf "%.0f" }} kernel I/O errors in the last hour on node {{ $labels.node }}'
      - alert: NodeProblemTaskHung
        expr: increase(problem_counter{reason="TaskHung"}[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Task hung
          description: '{{ $value | printf "%.0f" }} hung tasks in the last hour on node {{ $labels.node }}'

resources:
  limits:
    cpu: 20m
    memory: 60Mi
  requests:
    cpu: 3m
    memory: 18Mi

# hostNetwork so network_problem.sh sees the host conntrack table; in the pod
# netns nf_conntrack_count reads 0. ClusterFirstWithHostNet keeps cluster DNS,
# which dns_problem.sh needs to resolve kubernetes.default.
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

settings:
  #log_monitors:
  #  - /config/kernel-monitor.json
  #  - /config/readonly-monitor.json
  #  - /config/health-checker-containerd.json
  log_monitors:
    - /config/kernel-monitor.json
    - /config/readonly-monitor.json

  custom_plugin_monitors:
    # FrequentUnregisterNetDevice node condition, counted from journald.
    - /config/kernel-monitor-counter.json
    # ConntrackFull and DNSUnreachable events.
    - /config/network-problem-monitor.json
    # - /config/health-checker-containerd.json
    # - /config/custom-plugin-monitor.json ## This is NTP monitor. Disabled as it requires systemctl to be present in the container.

