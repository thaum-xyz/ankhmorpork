apiVersion: batch/v1
kind: Job
metadata:
  name: seerr-sqlite-to-postgres
spec:
  # One attempt. The load truncates before it copies, so a retry is safe, but
  # it should be a person retrying after reading the log, not the controller.
  backoffLimit: 0
  template:
    spec:
      containers:
        - args:
            - --on-error-stop
            - --verbose
            - /load/seerr.load
          command:
            - pgloader
          env:
            - name: DB_HOST
              value: postgres-seerr-rw
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: seerr
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-seerr-user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-seerr-user
            # uid 1000 has no passwd entry in this image; pgloader wants a
            # writable HOME for its .pgpass lookup and log directory.
            - name: HOME
              value: /tmp
          # The image seerr's own docs point at: a build of dimitri/pgloader
          # PR 1531, which quotes identifiers the way the 3.6.7 release does not.
          # Pinned by digest because the tag is a PR build with no release
          # behind it.
          image: ghcr.io/ralgar/pgloader:pr-1531@sha256:e5ae0b8149058828938d0f14ccc1f793171db8c4c8b69b7b6b45dfd998f0149f
          name: pgloader
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Read-write, not readOnly: the file is a WAL-mode database, and a
            # -wal left behind by the stopped seerr needs write access to its
            # -shm to be read at all. pgloader only reads it.
            - mountPath: /app/config
              name: config
            - mountPath: /load
              name: load
              readOnly: true
      # Same constraint as the seerr Deployment, and for the same reason: this
      # Pod mounts seerr-config, a piraeus-r2-roaming volume, and master01 runs
      # no linstor CSI node plugin.
      nodeSelector:
        linstor: "true"
      restartPolicy: Never
      # Same identity as the seerr pod: the SQLite files are 0644 node:node.
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config
        - name: load
          configMap:
            name: seerr-sqlite-to-postgres
