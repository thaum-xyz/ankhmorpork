apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-storage
  namespace: platform-storage
  annotations:
    kubernetes.io/description: >-
      Volume provisioning and backup: everything listed in k8s/platform/storage/kustomization.yaml.

      Reconciles in its own namespace, as that namespace's flux-reconciler;
      ordering between domains is in docs/explanation/flux-layering.md.
spec:
  interval: 15m0s
  path: ./k8s/platform/storage
  # Objects that must survive a prune carry kustomize.toolkit.fluxcd.io/prune: disabled.
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
