apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 15m0s
  path: ./k8s/flux/apps
  prune: false
  dependsOn:
  - name: platform
  # App Namespaces are no longer created by the apps themselves, so they have
  # to exist before any app Kustomization applies into them.
  - name: namespaces
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
