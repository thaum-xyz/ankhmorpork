apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-cluster
  namespace: platform-cluster
  annotations:
    kubernetes.io/description: >-
      Node and cluster lifecycle: everything listed in k8s/platform/cluster/kustomization.yaml.

      Lives in the namespace it reconciles, reading the GitRepository there and
      applying as its flux-reconciler; both resolve in the object's own
      namespace and nowhere else, and no dependsOn across namespaces is
      possible. Ordering comes from `platform dependsOn crds` above and from
      HelmRelease.spec.dependsOn within the namespace; see
      docs/explanation/flux-layering.md.
spec:
  interval: 15m0s
  path: ./k8s/platform/cluster
  # Objects that must survive a prune say so themselves, with
  # kustomize.toolkit.fluxcd.io/prune: disabled.
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
