apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-network
  namespace: platform-network
  annotations:
    kubernetes.io/description: >-
      Ingress and egress: everything listed in k8s/platform/network/kustomization.yaml.

      Reconciles in its own namespace, as that namespace's flux-reconciler;
      ordering between domains is in docs/explanation/flux-layering.md.
spec:
  dependsOn:
    - name: crds
  interval: 15m0s
  path: ./k8s/platform/network
  # Objects that must survive a prune carry kustomize.toolkit.fluxcd.io/prune: disabled.
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
