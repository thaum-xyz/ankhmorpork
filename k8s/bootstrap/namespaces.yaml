apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: platform-cluster
  annotations:
    kubernetes.io/description: >-
      Every Namespace this repo creates, plus what each
      `platform-<domain>` needs before it can reconcile itself.

      An app's directory holds its Namespace, the Kustomization that reconciles
      it and, where the app applies something cluster-scoped, a
      ClusterRoleBinding; its GitRepository and flux-reconciler are generated
      from the Namespace's label. A `platform-<domain>` directory holds those
      two as files, because they are on the bootstrap path. Why the directory
      sits outside k8s/apps/<app>/, and why it is laid out the way it is:
      docs/explanation/flux-layering.md.
spec:
  interval: 15m0s
  # No kustomization.yaml in the target directory: Flux then applies every
  # manifest it finds, so a Namespace cannot be silently skipped for want of a
  # `resources:` entry, and every namespaced object states its own namespace.
  path: ./k8s/namespaces
  # Deleting a Namespace cascades to everything inside it, so removal is two
  # acts: take it out of git, then delete the object.
  prune: false
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
