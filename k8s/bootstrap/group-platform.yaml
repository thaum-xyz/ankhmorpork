apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 15m0s
  path: ./k8s/flux/platform
  prune: false
  dependsOn:
  - name: prometheus-operator-crds
  # Shared platform-<domain> Namespaces live in ./k8s/namespaces, so they are no
  # longer created by the first component that happens to reconcile into them.
  - name: namespaces
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
