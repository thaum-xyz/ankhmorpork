apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crds
  namespace: platform-cluster
  annotations:
    kubernetes.io/description: >-
      Custom resource definitions every layer above depends on, from
      ./k8s/crds. Only platform-cluster declares a dependsOn on it, because it
      is the one domain sharing this namespace; --no-cross-namespace-refs
      forbids the other four from naming it, so a domain applied before a kind
      is established fails that object and retries on its interval. `wait: true`
      is what makes Ready here mean the kinds are usable, and therefore what
      makes that one edge worth having.

      It is a layer rather than a platform component because more than one
      domain uses what it ships and no domain can be ordered after another. The
      manifests live outside k8s/platform/ for the same reason: everything under
      k8s/platform/<domain>/ belongs to that domain's Kustomization, and a
      directory there owned by something else is a rule with an exception the
      next reader has to know about.

      The objects still render into platform-observability. Moving them would be
      a Helm uninstall and reinstall, and this release's entire content is the
      monitoring.coreos.com CRDs -- deleting a CRD deletes every custom resource
      of that kind.

      Ordering is also why there is no kustomization.yaml in ./k8s/crds: Flux
      applies every manifest it finds there, recursively, so a CRD chart cannot
      be silently skipped for want of a `resources:` entry.
spec:
  interval: 15m0s
  # The releases here render into platform-<domain> namespaces, which this
  # layer does not create and cannot: a Kustomization cannot create the
  # namespace it reconciles into before it reconciles. Without this edge the
  # layer still converges -- the namespaces land, the next retry succeeds -- but
  # a bootstrap that has to fail twice to work is one nobody can read.
  dependsOn:
    - name: namespaces
  path: ./k8s/crds
  # NOTE: Prevent cascading deletion of every ServiceMonitor, PodMonitor and
  # PrometheusRule in the cluster.
  prune: false
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
