apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` transformer: two objects here are cluster-scoped and the rest
# state their own namespace. Layers and umbrellas: docs/explanation/flux-layering.md.
resources:
  # What platform-cluster needs before a Kustomization can run in it. Applied by
  # hand here AND reconciled by `namespaces` afterwards, because `namespaces` is
  # one of the umbrellas in this namespace and cannot create the namespace it
  # runs in.
  - ../namespaces/platform-cluster
  - crds.yaml
  - namespaces.yaml
  - platform-cluster.yaml
  - platform-network.yaml
  - platform-observability.yaml
  - platform-security.yaml
  - platform-storage.yaml
