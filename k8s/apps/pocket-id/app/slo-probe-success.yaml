apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: pocket-id-probe-success
spec:
  # SSO, so a failure here is a failure of every OIDC service, and since the
  # ratio objectives on its own metrics are gone it is the only signal it has.
  #
  # target from the 7d window 2026-09-09..09-16 (#1379): 99.88096% achieved,
  # 24 failed samples in 5 bursts, worst 7m00s, 11.9% of a 99% budget.
  # 7m00s burst is the cluster-wide event of 2026-09-12; see
  # k8s/apps/homer/app/slo-probe-success.yaml.
  description: >-
    Fraction of successful blackbox probes against login.krupa.net.pl.
  alerting:
    name: PocketIDProbeBudgetBurn
    absentName: PocketIDProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://login\\.krupa\\.net\\.pl(/.*)?"}
  target: "99"
  window: 7d