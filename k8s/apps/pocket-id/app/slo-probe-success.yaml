apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: pocket-id-probe-success
spec:
  # Availability as a person experiences it: the blackbox probe, end to end
  # through DNS, TLS and the ingress. Split out of the shared
  # blackbox-probe-success so this service owns the objective that describes it,
  # the same reason its Ingress is not kept in traefik's namespace.
  #
  # Matches on the host rather than the full probe URL, so changing
  # ingress.thaum.xyz/probe-uri retunes the check without silently emptying the
  # SLO behind it.
  # SSO, so a failure here is a failure of every OIDC service. Pairs with
  # pocket-id-availability.
  #
  # target is still a PLACEHOLDER. This probe was re-pointed at a new
  # endpoint on 2026-09-06 06:51 UTC, so a 7d window does not contain one
  # endpoint throughout until 2026-09-13 06:51 UTC -- reading it before then
  # sets a target from a URL that is no longer probed. Everything else in
  # #1379 was set on 2026-09-10; this one waits.
  #
  # Provisionally 99.912% over the 3 days since the change, which is only
  # here to show it is not an outlier that would change the shape.
  description: >-
    Fraction of successful blackbox probes against login.krupa.net.pl.
  alerting:
    name: PocketIDProbeBudgetBurn
    absentName: PocketIDProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://login\\.krupa\\.net\\.pl(/.*)?"}
  target: "95.0"
  window: 7d