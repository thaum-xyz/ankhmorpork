apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: pocket-id-probe-success
spec:
  # SSO, so a failure here is a failure of every OIDC service. Pairs with
  # pocket-id-availability.
  #
  # target is a PLACEHOLDER (#1379): the probe endpoint changed on 2026-09-06
  # 06:51 UTC, so the first 7d window measuring one endpoint throughout closes
  # 2026-09-13 06:51 UTC. Provisionally 99.912% over the first 3 days.
  description: >-
    Fraction of successful blackbox probes against login.krupa.net.pl.
  alerting:
    name: PocketIDProbeBudgetBurn
    absentName: PocketIDProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://login\\.krupa\\.net\\.pl(/.*)?"}
  target: "95.0"
  window: 7d