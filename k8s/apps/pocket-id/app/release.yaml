---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
spec:
  chart:
    spec:
      chart: pocket-id
      sourceRef:
        kind: HelmRepository
        name: anza-labs
        namespace: pocket-id
      version: "2.2.1"
      interval: 5m
  interval: 5m
  timeout: 20m
  install:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: values-pocket-id
    - kind: Secret
      name: pg-connection
      valuesKey: connectionString
      targetPath: database.connectionString
    - kind: Secret
      name: encryption-key
      valuesKey: encryptionKey
      targetPath: encryptionKey
  postRenderers:
    - kustomize:
        patches:
          # The chart declares only the app port and offers no knob for extra
          # ones, so the OTel Prometheus listener has nothing the PodMonitor can
          # select by name -- and PodMonitor's targetPort escape hatch is
          # deprecated and wants a declared container port anyway.
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: pocket-id
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/ports/-
                value:
                  name: metrics
                  containerPort: 9464
                  protocol: TCP
          # blackbox discovers targets from Ingresses labelled probe=enabled and
          # the chart exposes annotations but no labels, so the label has to be
          # patched on. It goes on this Ingress, not pocket-id-cloudflare:
          # blackbox derives the scheme from whether the Ingress declares TLS,
          # and the cloudflare twin declares none, so probing that one would
          # build an http:// target the tunnel never answers.
          - target:
              group: networking.k8s.io
              version: v1
              kind: Ingress
              name: pocket-id
            patch: |-
              - op: add
                # ~1 is JSON Pointer's escape for / in a key name.
                path: /metadata/labels/ingress.thaum.xyz~1probe
                value: enabled
