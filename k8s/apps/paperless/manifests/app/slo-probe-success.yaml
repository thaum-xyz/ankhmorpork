apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: paperless-probe-success
  # This kustomization sets no global namespace -- every manifest under it
  # declares its own, as ingress.yaml does.
  namespace: paperless
spec:
  # target from the 7d window 2026-09-09..09-16 (#1379): 99.89088% achieved,
  # 22 failed samples in 4 bursts, worst 7m00s, 10.9% of a 99% budget.
  # 7m00s burst is the cluster-wide event of 2026-09-12; see
  # k8s/apps/homer/app/slo-probe-success.yaml.
  description: >-
    Fraction of successful blackbox probes against papers.krupa.net.pl.
  alerting:
    name: PaperlessProbeBudgetBurn
    absentName: PaperlessProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://papers\\.krupa\\.net\\.pl(/.*)?"}
  target: "99"
  window: 7d