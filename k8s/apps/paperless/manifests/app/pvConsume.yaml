apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    # Never garbage-collect this PersistentVolume. Pruning is inventory-based,
    # so anything that drops it from this Kustomization's inventory -- a rename,
    # a restructure, a file moved between directories -- would delete it. The
    # reclaim policy is Retain, so the data would survive; the PVC bound to it
    # would not, and recovering means hand-clearing claimRef on a recreated PV
    # while the app is down.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/component: webservice
    app.kubernetes.io/name: paperless
  name: consume
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 15Gi
  nfs:
    path: /var/nfs/shared/scans/paperless
    server: 192.168.40.10
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  volumeMode: Filesystem
