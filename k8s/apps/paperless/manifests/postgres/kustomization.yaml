apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Declared here because pocket-id, paperless and multimedia have no namespace on
# their parent kustomization -- their manifests each carried their own.
namespace: paperless
resources:
  - repository.yaml
  - release.yaml
configMapGenerator:
  - name: postgres-values
    files:
      - values.yaml=values.yaml
# Stable ConfigMap name: helm-controller tracks values through
# status.lastAttemptedConfigDigest, so the hash suffix is not needed to detect
# changes, and without it there is no name for nameReference to rewrite -- which
# is what kustomizeconfig.yaml exists for elsewhere in this repo.
generatorOptions:
  disableNameSuffixHash: true
