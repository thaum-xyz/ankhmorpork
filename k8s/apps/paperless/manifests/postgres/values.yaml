database: paperless
owner: paperless

cluster:
  imageName: ghcr.io/cloudnative-pg/postgresql:15.2
  instances: 3
  primaryUpdateMethod: switchover
  storage:
    size: 30Gi
  # A cpu limit and no memory limit, matching the live spec.
  resources:
    limits:
      cpu: 200m
    requests:
      cpu: 100m
      memory: 400Mi

backup:
  schedule: "0 36 22 * * *"
  objectStore:
    retentionPolicy: 14d
    pathSuffix: paperless

# The only database in the fleet fronted by pgbouncer.
pooler:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

externalSecrets:
  admin:
    remoteKey: PAPERLESS_DB_ADMIN_PASS
  user:
    remoteKey: PAPERLESS_DB_PASS
