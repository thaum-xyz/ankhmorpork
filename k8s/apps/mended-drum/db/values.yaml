database: drum
owner: drum

cluster:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  storage:
    size: 1Gi
  resources:
    limits:
      cpu: 400m
      memory: 420Mi
    requests:
      cpu: 100m
      memory: 256Mi

backup:
  schedule: "0 30 23 * * *"
  objectStore:
    retentionPolicy: 30d
    pathSuffix: mended-drum

externalSecrets:
  admin:
    remoteKey: MENDED_DRUM_DB_ADMIN_PASS
  user:
    remoteKey: MENDED_DRUM_DB_PASS
