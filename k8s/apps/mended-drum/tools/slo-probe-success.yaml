apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: mended-drum-tools-probe-success
spec:
  # target from the 7d window 2026-09-03..09-10 (#1379): 99.99504% achieved,
  # one failed sample in the week, 1.0% of a 99.5% budget. Paired with homer as
  # the two probes clean enough to carry the tighter target.
  description: >-
    Fraction of successful blackbox probes against drum-tools.krupa.net.pl.
  alerting:
    name: MendedDrumToolsProbeBudgetBurn
    absentName: MendedDrumToolsProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://drum\\-tools\\.krupa\\.net\\.pl(/.*)?"}
  target: "99.5"
  window: 7d