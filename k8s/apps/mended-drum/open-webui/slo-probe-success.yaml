apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: mended-drum-probe-success
spec:
  # Availability as a person experiences it: the blackbox probe, end to end
  # through DNS, TLS and the ingress. Split out of the shared
  # blackbox-probe-success so this service owns the objective that describes it,
  # the same reason its Ingress is not kept in traefik's namespace.
  #
  # Matches on the host rather than the full probe URL, so changing
  # ingress.thaum.xyz/probe-uri retunes the check without silently emptying the
  # SLO behind it.
  #
  # target from the 7d window 2026-09-03..09-10 (#1379): 99.86110% achieved, 28
  # failed samples in 5 bursts, worst 6m30s, 13.9% of a 99% budget -- the worst
  # of the probes that could be read, and still comfortable. A 99.9 target
  # would have been breached outright: 14 minutes spent against a 10m04s
  # budget.
  description: >-
    Fraction of successful blackbox probes against drum.krupa.net.pl.
  alerting:
    name: MendedDrumProbeBudgetBurn
    absentName: MendedDrumProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://drum\\.krupa\\.net\\.pl(/.*)?"}
  target: "99"
  window: 7d