---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
spec:
  chart:
    spec:
      chart: stirling-pdf-chart
      version: "3.1.0"
      sourceRef:
        kind: HelmRepository
        name: stirling-pdf
        namespace: stirling-pdf
      interval: 5m
  interval: 5m
  timeout: 20m
  install:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: values-stirling-pdf
  postRenderers:
    - kustomize:
        patches:
          # Chart 3.1.0 emits top-level resources on the final sidecar when
          # sidecarContainers is non-empty. Patch the main container directly.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: stirling-pdf-stirling-pdf-chart
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: 20m
                    memory: 1520Mi
