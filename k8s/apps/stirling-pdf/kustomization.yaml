apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stirling-pdf
resources:
  - repository.yaml
  - release.yaml
  - ingress-cloudflare.yaml
  - oidc-secret.yaml
  - slo-probe-success.yaml
configMapGenerator:
  - name: values-stirling-pdf
    files:
      - values.yaml=values.yaml
# Stable name; see docs/explanation/helm-values.md.
generatorOptions:
  disableNameSuffixHash: true
