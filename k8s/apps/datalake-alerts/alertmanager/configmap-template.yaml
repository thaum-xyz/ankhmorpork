apiVersion: v1
data:
  alertmanager.yaml: |
    {{/*
    # NOTE: This file is first processed by the Go template engine in external-secrets-operator
    # as such all the {{ SOME_TEMPLTE }} references that need to be passed to alertmanager need to be first escaped
    # with {{ `{{ SOME_TEMPLTE }}` }}
    */}}

    global:
      resolve_timeout: 5m
      opsgenie_api_url: 'https://api.eu.opsgenie.com'
      opsgenie_api_key: {{ .opsgenie_api_key }}  {{/* This is a reference to a secret stored in doppler */}}
    receivers:
    - name: 'opsgenie'
      opsgenie_configs:
        - message: "{{ `{{ .GroupLabels.alertname }}` }} - {{ `{{ .CommonAnnotations.summary }}` }}"
          description: |
            {{ `{{ if gt (len .Alerts.Firing) 0 -}}` }}
            {{ `{{ template "__text_alert_list" .Alerts.Firing }}` }}
            {{ `{{- end }}` }}
            {{ `{{ if gt (len .Alerts.Resolved) 0 -}}` }}
            {{ `{{ template "__text_alert_list" .Alerts.Resolved }}` }}
            {{ `{{- end }}` }}
          details:
            runbookUrl: "{{ `{{ .CommonAnnotations.runbook_url }}` }}"
            dashboardUrl: "{{ `{{ .CommonAnnotations.dashboard_url }}` }}"
            silenceUrl: >-
              {{ `{{ .ExternalURL }}` }}/#/silences/new?filter=%7B
              {{ `{{- range .CommonLabels.SortedPairs -}}` }}
                  {{ `{{- if ne .Name "alertname" -}}` }}
                      {{ `{{- .Name }}` }}%3D%22{{ `{{- reReplaceAll " +" "%20" .Value -}}` }}%22%2C%20
                  {{ `{{- end -}}` }}
              {{ `{{- end -}}` }}
              alertname%3D%22{{ `{{ reReplaceAll " +" "%20" .CommonLabels.alertname }}` }}%22%7D
          priority: >-
            {{ `{{- if ne .CommonLabels.priority "" -}}` }}
              {{ `{{- .CommonLabels.priority }}` }}
            {{ `{{- else -}}` }}
              {{ `{{- if eq .CommonLabels.severity "critical" -}}` }}
              P2
              {{ `{{- else -}}` }}
              P4
              {{ `{{- end -}}` }}
            {{ `{{- end -}}` }}
          responders:
          - name: 'Main'
            type: team
    # timeout bounds a single POST. Without it the only deadline is the
    # notification pipeline's, which is max(group_interval, 10s) + 15s per peer
    # position -- 2m to 2m30s on the Watchdog route below. One socket that hangs
    # therefore eats the entire budget and RetryStage never gets a second
    # attempt, which is how #1445 lost Watchdog pings: on the night of
    # 2026-09-11 about one POST in five to hc-ping.com hung for the full ~110s
    # while the ones between them completed in under a second.
    #
    # 10s leaves room for roughly six further attempts inside the same budget.
    # Failure counters are not the cost of that: notifications_total and
    # notifications_failed_total count *pipelines*, once each, and only
    # notification_requests_total counts attempts -- so a retry that succeeds
    # leaves AlertmanagerFailedToSendAlerts untouched.
    - name: 'healthchecks.io'
      webhook_configs:
        - send_resolved: false
          timeout: 10s
          url: {{ .healthchecks_url }}  {{/* This is a reference to a secret stored in doppler */}}
    # Same reasoning, with a larger value: this one waits on the GitHub API
    # through github-receiver, which takes 1.5-4s in normal operation. Its route
    # has the default 5m group_interval, so 30s still leaves ~10 attempts.
    - name: 'github'
      webhook_configs:
        - send_resolved: true
          timeout: 30s
          url: "http://github-receiver:8080/v1/webhook?owner=thaum-xyz&repo=ankhmorpork"
    - name: "null"
    # Waking hours, local. Referenced by the opsgenie route below.
    #
    # Expressed as the hours that DO page rather than the hours that do not:
    # an Alertmanager time range cannot cross midnight, so muting 20:00-09:00
    # would need two ranges and a reader would have to intersect them in their
    # head. active_time_intervals inverts it into one range that says what it
    # means.
    #
    # location is not optional. Without it Alertmanager reads the times as UTC,
    # which is right for two-thirds of the year and an hour out for the rest.
    # The binary has embedded tzdata, so the name resolves without tzdata in
    # the image.
    time_intervals:
    - name: waking-hours
      time_intervals:
      - times:
        - start_time: "09:00"
          end_time: "20:00"
        location: Europe/Warsaw
    route:
      group_by: ['alertname', 'namespace', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      # Nothing should reach here: every alert carries a severity, and .pint.hcl
      # fails CI on any value outside warning|critical|info|none.
      receiver: "null"
      routes:
        - matchers:
          - "alertname = Watchdog"
          receiver: 'healthchecks.io'
          repeat_interval: 2m
          group_interval: 2m
        - matchers:
          - "alertname = InfoInhibitor"
          receiver: "null"
        # continue: critical pages *and* falls through to the github routes
        # below, so every alert that is worth waking someone for also leaves a
        # written record. Without it a critical is paged and never written down —
        # the reason the 2026-09-09 kured reboots left no issue to read back.
        #
        # active_time_intervals sits on this route alone, so outside 09:00-20:00
        # the page is withheld while the fall-through still files the issue.
        # Nothing is lost overnight, it is only read in the morning -- and an
        # alert still firing when the window opens pages then.
        #
        # This applies to every critical, with no carve-out for the ones whose
        # damage compounds overnight -- UPS runtime, a filesystem gone read-only,
        # a pool filling up. That is a deliberate trade by the one person who
        # receives these: sleep is worth more than the hours between the alert
        # and the morning. Revisit it if anyone else ever goes on the rota.
        - matchers:
          - "severity = critical"
          receiver: 'opsgenie'
          continue: true
          active_time_intervals:
          - waking-hours
        # Every NFS-backed PVC reports the whole export's fill level, so a single
        # NAS filling up fires this once per PVC across unrelated namespaces.
        # Grouping on alertname alone turns that into one issue listing them all.
        # Reached by criticals too: this alert has both a warning and a critical
        # variant, and they should land in the same grouped issue.
        - matchers:
          - "alertname = KubePersistentVolumeFillingUp"
          group_by: ['alertname']
          receiver: 'github'
        - matchers:
          - "severity =~ warning|critical"
          receiver: 'github'
        - matchers:
          - "severity = info"
          receiver: "null"
    inhibit_rules:
      - source_matchers:
        - "severity = critical"
        target_matchers:
        - "severity =~ warning|info"
        equal: ['namespace', 'alertname']
      - source_matchers:
        - "severity = warning"
        target_matchers:
        - "severity = info"
        equal: ['namespace', 'alertname']
      - source_matchers:
        - "alertname = KubeNodeUnreachable"
        target_matchers:
        - "alertname = TargetDown"
        - "job =~ kubelet|node-exporter"
      - source_matchers:
        - "alertname = KubeNodeUnreachable"
        target_matchers:
        - "alertname = KubeNodeNotReady"
      # A node going away shows up as every workload on it looking unhealthy.
      - source_matchers:
        - "alertname =~ KubeNodeNotReady|KubeNodeUnreachable"
        target_matchers:
        - "alertname =~ KubePodNotReady|KubeContainerWaiting|KubePodCrashLooping|KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeDaemonSetRolloutStuck|KubeDeploymentRolloutStuck"
        equal: ['cluster']
      # And a pod that cannot start is the reason its workload is short replicas,
      # so report the cause rather than both.
      - source_matchers:
        - "alertname =~ KubePodCrashLooping|KubePodNotReady|KubeContainerWaiting"
        target_matchers:
        - "alertname =~ KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeDeploymentRolloutStuck|KubeDaemonSetRolloutStuck"
        equal: ['namespace']
      - source_matchers:
        - "alertname = InfoInhibitor"
        target_matchers:
        - "severity = info"
        equal: ['namespace']
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: alert-router
    app.kubernetes.io/instance: main
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: kube-prometheus
  name: alertmanager-config-template
