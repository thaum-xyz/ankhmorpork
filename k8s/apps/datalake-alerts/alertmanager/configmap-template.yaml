apiVersion: v1
data:
  alertmanager.yaml: |
    {{/*
    # NOTE: This file is first processed by the Go template engine in external-secrets-operator
    # as such all the {{ SOME_TEMPLTE }} references that need to be passed to alertmanager need to be first escaped
    # with {{ `{{ SOME_TEMPLTE }}` }}
    */}}

    global:
      resolve_timeout: 5m
      opsgenie_api_url: 'https://api.eu.opsgenie.com'
      opsgenie_api_key: {{ .opsgenie_api_key }}  {{/* This is a reference to a secret stored in doppler */}}
    receivers:
    - name: 'opsgenie'
      opsgenie_configs:
        - message: "{{ `{{ .GroupLabels.alertname }}` }} - {{ `{{ .CommonAnnotations.summary }}` }}"
          description: |
            {{ `{{ if gt (len .Alerts.Firing) 0 -}}` }}
            {{ `{{ template "__text_alert_list" .Alerts.Firing }}` }}
            {{ `{{- end }}` }}
            {{ `{{ if gt (len .Alerts.Resolved) 0 -}}` }}
            {{ `{{ template "__text_alert_list" .Alerts.Resolved }}` }}
            {{ `{{- end }}` }}
          details:
            runbookUrl: "{{ `{{ .CommonAnnotations.runbook_url }}` }}"
            dashboardUrl: "{{ `{{ .CommonAnnotations.dashboard_url }}` }}"
            silenceUrl: >-
              {{ `{{ .ExternalURL }}` }}/#/silences/new?filter=%7B
              {{ `{{- range .CommonLabels.SortedPairs -}}` }}
                  {{ `{{- if ne .Name "alertname" -}}` }}
                      {{ `{{- .Name }}` }}%3D%22{{ `{{- reReplaceAll " +" "%20" .Value -}}` }}%22%2C%20
                  {{ `{{- end -}}` }}
              {{ `{{- end -}}` }}
              alertname%3D%22{{ `{{ reReplaceAll " +" "%20" .CommonLabels.alertname }}` }}%22%7D
          priority: >-
            {{ `{{- if ne .CommonLabels.priority "" -}}` }}
              {{ `{{- .CommonLabels.priority }}` }}
            {{ `{{- else -}}` }}
              {{ `{{- if eq .CommonLabels.severity "critical" -}}` }}
              P2
              {{ `{{- else -}}` }}
              P4
              {{ `{{- end -}}` }}
            {{ `{{- end -}}` }}
          responders:
          - name: 'Main'
            type: team
    - name: 'healthchecks.io'
      webhook_configs:
        - send_resolved: false
          url: {{ .healthchecks_url }}  {{/* This is a reference to a secret stored in doppler */}}
    - name: 'github'
      webhook_configs:
        - send_resolved: true
          url: "http://github-receiver:8080/v1/webhook?owner=thaum-xyz&repo=ankhmorpork"
    - name: "null"
    route:
      group_by: ['alertname', 'namespace', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      # Nothing should reach here: every alert carries a severity, and .pint.hcl
      # fails CI on any value outside warning|critical|info|none.
      receiver: "null"
      routes:
        - matchers:
          - "alertname = Watchdog"
          receiver: 'healthchecks.io'
          repeat_interval: 2m
          group_interval: 2m
        - matchers:
          - "alertname = InfoInhibitor"
          receiver: "null"
        - matchers:
          - "severity = critical"
          receiver: 'opsgenie'
        # Every NFS-backed PVC reports the whole export's fill level, so a single
        # NAS filling up fires this once per PVC across unrelated namespaces.
        # Grouping on alertname alone turns that into one issue listing them all.
        - matchers:
          - "alertname = KubePersistentVolumeFillingUp"
          group_by: ['alertname']
          receiver: 'github'
        - matchers:
          - "severity = warning"
          receiver: 'github'
        - matchers:
          - "severity = info"
          receiver: "null"
    inhibit_rules:
      - source_matchers:
        - "severity = critical"
        target_matchers:
        - "severity =~ warning|info"
        equal: ['namespace', 'alertname']
      - source_matchers:
        - "severity = warning"
        target_matchers:
        - "severity = info"
        equal: ['namespace', 'alertname']
      - source_matchers:
        - "alertname = KubeNodeUnreachable"
        target_matchers:
        - "alertname = TargetDown"
        - "job =~ kubelet|node-exporter"
      - source_matchers:
        - "alertname = KubeNodeUnreachable"
        target_matchers:
        - "alertname = KubeNodeNotReady"
      # A node going away shows up as every workload on it looking unhealthy.
      - source_matchers:
        - "alertname =~ KubeNodeNotReady|KubeNodeUnreachable"
        target_matchers:
        - "alertname =~ KubePodNotReady|KubeContainerWaiting|KubePodCrashLooping|KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeDaemonSetRolloutStuck|KubeDeploymentRolloutStuck"
        equal: ['cluster']
      # And a pod that cannot start is the reason its workload is short replicas,
      # so report the cause rather than both.
      - source_matchers:
        - "alertname =~ KubePodCrashLooping|KubePodNotReady|KubeContainerWaiting"
        target_matchers:
        - "alertname =~ KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeDeploymentRolloutStuck|KubeDaemonSetRolloutStuck"
        equal: ['namespace']
      - source_matchers:
        - "alertname = InfoInhibitor"
        target_matchers:
        - "severity = info"
        equal: ['namespace']
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: alert-router
    app.kubernetes.io/instance: main
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: kube-prometheus
  name: alertmanager-config-template
