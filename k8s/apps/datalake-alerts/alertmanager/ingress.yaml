apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    ignore-check.kube-linter.io/dangling-service: Check is incompatible with prometheus-operator CRDs
    probe-uri: /-/healthy
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
  labels:
    app.kubernetes.io/component: alert-router
    app.kubernetes.io/instance: main
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 0.34.0
  name: alertmanager
spec:
  ingressClassName: private
  rules:
    - host: alertmanager.ankhmorpork.thaum.xyz
      http:
        paths:
          - backend:
              service:
                name: alertmanager-main
                port:
                  name: web
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - alertmanager.ankhmorpork.thaum.xyz
      secretName: alertmanager-tls
