apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/component: alertmanager-webhook-receiver
    app.kubernetes.io/name: github-receiver
  name: github-receiver-credentials
spec:
  # GitHub App credentials, so issues are authored by the app's bot account.
  # The receiver reads env only at startup: restart it after these change.
  data:
    - remoteRef:
        key: DATALAKE_ALERTS_RECEIVER_GITHUB_APP_ID
      secretKey: ATG_GITHUB_APP_ID
    - remoteRef:
        key: DATALAKE_ALERTS_RECEIVER_GITHUB_APP_INSTALLATION_ID
      secretKey: ATG_GITHUB_APP_INSTALLATION_ID
    - remoteRef:
        key: DATALAKE_ALERTS_RECEIVER_GITHUB_APP_PRIVATE_KEY
      secretKey: ATG_GITHUB_APP_PRIVATE_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    name: github-receiver-credentials
