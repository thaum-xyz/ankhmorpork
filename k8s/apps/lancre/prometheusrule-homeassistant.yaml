apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homeassistant
spec:
  groups:
    - name: homeassistant.rules
      rules:
        # The recorder gives up after 10 failed connects at start and never
        # retries. A running recorder always holds one connection, so none
        # for 15 minutes means it is off.
        - alert: HomeAssistantRecorderDisconnected
          annotations:
            description: Home Assistant on {{ $labels.instance }} is up and holds no connection to its recorder database. History, logbook and energy statistics are not being written; heating is unaffected. Once the database answers, restart Home Assistant Core.
            runbook_url: https://docs.thaum.xyz/how-to/runbooks/HomeAssistantRecorderDisconnected/
            summary: Home Assistant is not recording
          expr: |
            up{job="scrapeConfig/lancre/homeassistant"} == 1
            unless on (namespace)
            sum by (namespace) (cnpg_backends_total{namespace="lancre", usename="homeassistant"}) > 0
          for: 15m
          labels:
            severity: warning
        # hass-backup-copy on `home` stamps every successful run, new file or
        # not, so HA's own last-backup sensor is watched too. Both peak near 25 h.
        - alert: HomeAssistantBackupStale
          annotations:
            description: '{{ $labels.job }} on {{ $labels.instance }} reports the last Home Assistant backup, or its nightly copy to the UNAS share hasszmc, as more than 36 hours old. A restore would lose everything since then.'
            runbook_url: https://docs.thaum.xyz/how-to/runbooks/HomeAssistantBackupStale/
            summary: Home Assistant backups are stale
          expr: |
            time() - hass_backup_copy_last_success_timestamp_seconds{job="scrapeConfig/lancre/node-exporter"} > 36 * 3600
            or
            time() - hass_sensor_timestamp_seconds{job="scrapeConfig/lancre/homeassistant", entity="sensor.backup_last_successful_automatic_backup"} > 36 * 3600
          for: 30m
          labels:
            severity: warning
        # Energy dashboard sources (Settings → Dashboards → Energy); keep the regex in sync.
        # GNE sensors are unavailable ~10 h every night, so 24 h only trips on a real outage.
        - alert: HomeAssistantEnergySensorUnavailable
          annotations:
            description: '{{ $labels.entity }} on {{ $labels.instance }} has been unavailable in Home Assistant for over 24 hours. The energy dashboard is missing its data; after 10 days its long-term statistics restart from zero.'
            runbook_url: https://docs.thaum.xyz/how-to/runbooks/HomeAssistantEnergySensorUnavailable/
            summary: A Home Assistant energy sensor is unavailable
          expr: |
            max_over_time(hass_entity_available{job="scrapeConfig/lancre/homeassistant", entity=~"sensor\\.(gne_pv_monitoring_.+_sensor_dailyenergy|inwerter_dzienna_produkcja|powermeter_total_active_(returned_)?energy)"}[24h]) == 0
          for: 30m
          labels:
            severity: warning
