apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: evok
spec:
  groups:
    - name: evok recording rules
      # evok is scraped every second; the default interval would flatten it.
      interval: 3s
      rules:
        - record: solar:evok_temperature_celsius:diff
          expr: |
            sum without(address,circuit) (evok_temperature_celsius{circuit="solar-out"})
            - sum without(address,circuit) (evok_temperature_celsius{circuit="solar-in"})
        - record: heater:evok_temperature_celsius:diff
          expr: |
            sum without(address,circuit) (evok_temperature_celsius{circuit="heater-out"})
            - sum without(address,circuit) (evok_temperature_celsius{circuit="heater-in"})
        - record: "solar:evok_temperature:"
          expr: |
            sum without(circuit) (evok_analog_input_volts{circuit="1"}*200/12)
        - record: solar:evok_temperature_high_celsius:diff
          expr: |
            (
              sum without(circuit) (solar:evok_temperature:)
              + sum without(circuit,address) (evok_temperature_celsius{circuit="solar-out"})
            ) / 2
            - sum without(circuit,address) (evok_temperature_celsius{circuit="solar-in"})
        - record: solar:evok_temperature_low_celsius:diff
          expr: |
            sum without(circuit) (solar:evok_temperature:)
            - sum without(circuit,address) (evok_temperature_celsius{circuit="solar-in"})
