apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: cloudflared
spec:
  staticConfigs:
    - targets:
        - 192.168.20.3:8099
        # Cloudflared app on HAOS; host port 36500 is enabled in the app's Network settings.
        - 192.168.20.4:36500
      labels:
        cluster: lancre
        namespace: lancre
