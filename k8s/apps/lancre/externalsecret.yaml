# Long-lived access token Prometheus presents to Home Assistant's
# /api/prometheus.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeassistant-token
spec:
  data:
    - remoteRef:
        key: LANCRE_HOMEASSISTANT_TOKEN
      secretKey: token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    name: homeassistant-token
