---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: atuin
spec:
  chart:
    spec:
      chart: atuin
      version: "0.4.1"
      sourceRef:
        kind: HelmRepository
        name: atuin
        namespace: atuin
      interval: 5m
  interval: 5m
  timeout: 20m
  install:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: values-atuin
  postRenderers:
    - kustomize:
        patches:
          # The chart hardcodes args: ["server", "start"] with no values knob,
          # which was right while one binary carried both client and server.
          # v18.12.0 split them: the image now ships only atuin-server, whose
          # usage is `atuin-server start`, so the leading "server" has to go or
          # the container exits immediately on an unknown subcommand.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: atuin
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/args
                value: ["start"]
          # blackbox discovers targets from Ingresses labelled probe=enabled and
          # the chart exposes annotations but no labels. This Ingress, not
          # cloudflare-ingress: blackbox takes the scheme from whether the
          # Ingress declares TLS, and the cloudflare twin declares none.
          - target:
              group: networking.k8s.io
              version: v1
              kind: Ingress
              name: atuin
            patch: |-
              - op: add
                path: /metadata/labels/probe
                value: enabled
          # atuin labels every request with its path, and the internet supplies
          # the paths: 773 of the 776 distinct values are scanner 404s for
          # /.env, /wp/, /sitemap.xml and the like. One permanent series per URL
          # anyone invents, times twelve histogram buckets -- 9396 bucket series
          # and climbing, from a service with three real routes.
          #
          # Anything outside the known set collapses to path="other", which
          # bounds the label without discarding the requests or flattening the
          # routes the SLOs need to tell apart. The chart offers no
          # metricRelabelings knob, hence the patch.
          - target:
              group: monitoring.coreos.com
              version: v1
              kind: ServiceMonitor
              name: atuin
            patch: |-
              - op: add
                path: /spec/endpoints/0/metricRelabelings
                value:
                  # Deliberately avoids matching on an empty regex: omitted or
                  # empty, the operator defaults regex to (.*), which here would
                  # rewrite every path to "other" including the ones the SLOs
                  # select on. Matching .+ on a temp label is the same test
                  # without depending on that default.
                  - sourceLabels: [path]
                    targetLabel: __tmp_unknown_path
                  - sourceLabels: [path]
                    regex: /|/healthz|/api/v[0-9]+/.*
                    targetLabel: __tmp_unknown_path
                    replacement: ""
                  - sourceLabels: [__tmp_unknown_path]
                    regex: .+
                    targetLabel: path
                    replacement: other
                  - action: labeldrop
                    regex: __tmp_unknown_path
