---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: atuin
spec:
  chart:
    spec:
      chart: atuin
      version: "0.4.1"
      sourceRef:
        kind: HelmRepository
        name: atuin
        namespace: atuin
      interval: 5m
  interval: 5m
  timeout: 20m
  install:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: values
  postRenderers:
    - kustomize:
        patches:
          # The chart hardcodes args: ["server", "start"] with no values knob,
          # which was right while one binary carried both client and server.
          # v18.12.0 split them: the image now ships only atuin-server, whose
          # usage is `atuin-server start`, so the leading "server" has to go or
          # the container exits immediately on an unknown subcommand.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: atuin
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/args
                value: ["start"]
