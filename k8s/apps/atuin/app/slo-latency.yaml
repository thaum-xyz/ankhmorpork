apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: atuin-latency
spec:
  # Note the metric name: http_requests_duration_seconds, not the usual
  # http_request_duration_seconds. atuin pluralises it.
  #
  # le=0.5 measured, not guessed. Over 7d on the sync API the distribution was
  # 44.7% under 5ms, 77.6% under 100ms, 97.9% under 250ms and 100% under 500ms.
  # le=0.25 would start the SLO at 97.9%, already under a 99% target, so 0.5 is
  # the first bucket that leaves any headroom at all.
  #
  # target is a PLACEHOLDER. Same /api/v0 scope and same reasoning as
  # atuin-availability.
  description: >-
    Fraction of atuin sync API requests answered within 500ms.
  alerting:
    name: AtuinLatencyBudgetBurn
    # absent is off, and this is the one SLO family where that is right.
    # /api/v0/* sees ~27 requests a day, so its counter series do not exist
    # until the first sync after a restart -- and Pyrra fixes the absent
    # alert at for: 600s with no knob. It fired twice within minutes of the
    # 2026-09-06 rollout, correctly, for a service that was fine.
    #
    # Absence carries no information at this request rate. What guards
    # against measuring nothing here is the /healthz probe, scraped every
    # 30s by both Prometheus replicas and covered by blackbox-probe-success.
    # Absent-checking belongs on SLIs that are always exercised.
    absent: false
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    latency:
      success:
        metric: http_requests_duration_seconds_bucket{job="atuin",path=~"/api/v0/.*",le="0.5"}
      total:
        metric: http_requests_duration_seconds_count{job="atuin",path=~"/api/v0/.*"}
  target: "99"
  window: 4w
