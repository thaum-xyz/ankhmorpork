apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: atuin-probe-success
spec:
  # Availability as a person experiences it: the blackbox probe, end to end
  # through DNS, TLS and the ingress. Split out of the shared
  # blackbox-probe-success so this service owns the objective that describes it,
  # the same reason its Ingress is not kept in traefik's namespace.
  #
  # Matches on the host rather than the full probe URL, so changing
  # ingress.thaum.xyz/probe-uri retunes the check without silently emptying the
  # SLO behind it.
  # Pairs with atuin-availability, which measures the sync API rather than
  # reachability.
  #
  # target is still a PLACEHOLDER. This probe was re-pointed at a new
  # endpoint on 2026-09-06 14:17 UTC, so a 7d window does not contain one
  # endpoint throughout until 2026-09-13 14:17 UTC -- reading it before then
  # sets a target from a URL that is no longer probed. Everything else in
  # #1379 was set on 2026-09-10; this one waits.
  #
  # Provisionally 99.974% over the 3 days since the change, which is only
  # here to show it is not an outlier that would change the shape.
  description: >-
    Fraction of successful blackbox probes against atuin.thaum.xyz.
  alerting:
    name: AtuinProbeBudgetBurn
    absentName: AtuinProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://atuin\\.thaum\\.xyz(/.*)?"}
  target: "95.0"
  window: 7d