apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: atuin-probe-success
spec:
  # Pairs with atuin-availability, which measures the sync API rather than
  # reachability.
  #
  # target is a PLACEHOLDER (#1379): the probe endpoint changed on 2026-09-06
  # 14:17 UTC, so the first 7d window measuring one endpoint throughout closes
  # 2026-09-13 14:17 UTC. Provisionally 99.974% over the first 3 days.
  description: >-
    Fraction of successful blackbox probes against atuin.thaum.xyz.
  alerting:
    name: AtuinProbeBudgetBurn
    absentName: AtuinProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://atuin\\.thaum\\.xyz(/.*)?"}
  target: "95.0"
  window: 7d