apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: atuin-probe-success
spec:
  # target from the 7d window 2026-09-09..09-16 (#1379): 99.91072% achieved,
  # 18 failed samples in 3 bursts, worst 7m00s, 8.9% of a 99% budget.
  # 7m00s burst is the cluster-wide event of 2026-09-12; see
  # k8s/apps/homer/app/slo-probe-success.yaml.
  description: >-
    Fraction of successful blackbox probes against atuin.thaum.xyz.
  alerting:
    name: AtuinProbeBudgetBurn
    absentName: AtuinProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://atuin\\.thaum\\.xyz(/.*)?"}
  target: "99"
  window: 7d