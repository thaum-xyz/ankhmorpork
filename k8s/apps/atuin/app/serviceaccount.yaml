apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: atuin
    app.kubernetes.io/instance: atuin
  name: atuin
# atuin talks to Postgres and nothing else; it has no reason to hold a token for
# the API server. The chart offered serviceAccount.automount but never applied
# it to the ServiceAccount, so the token was mounted regardless.
automountServiceAccountToken: false
