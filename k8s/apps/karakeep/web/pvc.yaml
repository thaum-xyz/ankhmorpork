apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    # Opt in to K8up. The operator runs with skipWithoutAnnotation, so a claim
    # without this is not backed up.
    #
    # db.db is live SQLite and this is a file-level copy, so the database in a
    # snapshot may be torn. Deliberate for now: a consistent dump needs a
    # k8up.io/backupcommand, which comes separately. assets/ is the bulk of the
    # volume and is write-once, so it is unaffected.
    k8up.io/backup: "true"
  name: data-pvc
spec:
  # piraeus-r2-roaming rather than piraeus-r2: allowRemoteVolumeAccess lets the
  # Pod start on any node and attach diskless instead of waiting for one holding
  # a replica, which matters when kured reboots nodes. auto-diskful promotes it
  # to a local replica after 5 minutes anyway. Well under the class's 32Gi cap.
  storageClassName: piraeus-r2-roaming
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
