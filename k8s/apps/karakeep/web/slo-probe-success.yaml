apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: karakeep-probe-success
spec:
  # target from the 7d window 2026-09-09..09-16 (#1379): 99.91568% achieved,
  # 17 failed samples in 3 bursts, worst 6m30s, 8.4% of a 99% budget.
  # 7m00s burst is the cluster-wide event of 2026-09-12; see
  # k8s/apps/homer/app/slo-probe-success.yaml.
  description: >-
    Fraction of successful blackbox probes against keep.krupa.net.pl.
  alerting:
    name: KarakeepProbeBudgetBurn
    absentName: KarakeepProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://keep\\.krupa\\.net\\.pl(/.*)?"}
  target: "99"
  window: 7d