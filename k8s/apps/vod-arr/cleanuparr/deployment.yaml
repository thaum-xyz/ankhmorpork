apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: cleaner
    app.kubernetes.io/name: cleanuparr
    app.kubernetes.io/part-of: cleanuparr
    app.kubernetes.io/version: 2.10.5
  name: cleanuparr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: cleaner
      app.kubernetes.io/name: cleanuparr
      app.kubernetes.io/part-of: cleanuparr
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: cleanuparr
        # cleanuparr.db, events.db and users.db are all live SQLite, so the
        # file-level copies can tear. This streams consistent copies of all three
        # into the repository as one tar; that is what to restore from, and the
        # file-level copies stay as a fallback.
        k8up.io/backupcommand: /opt/apprise-venv/bin/python3 /backup/dump.py
        k8up.io/file-extension: .tar
      labels:
        app.kubernetes.io/component: cleaner
        app.kubernetes.io/name: cleanuparr
        app.kubernetes.io/part-of: cleanuparr
        app.kubernetes.io/version: 2.10.5
    spec:
      containers:
        - env:
            - name: TZ
              value: Europe/Berlin
            - name: PORT
              value: "11011"
            # This image starts as root and drops to PUID/PGID in its entrypoint,
            # so it cannot run with runAsNonRoot the way the *arrs do. 1000 is
            # what the rest of the namespace uses.
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          image: ghcr.io/cleanuparr/cleanuparr:2.10.5
          imagePullPolicy: IfNotPresent
          name: cleanuparr
          ports:
            - containerPort: 11011
              name: http
          readinessProbe:
            failureThreshold: 5
            initialDelaySeconds: 10
            tcpSocket:
              port: http
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 20m
              memory: 128Mi
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /config/logs
              name: logs
            - mountPath: /backup
              name: backup-script
              readOnly: true
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        # Same lines as stdout, which alloy ships to Loki. Off the claim they also
        # leave the K8up backup, which is here for the three SQLite databases.
        - name: logs
          emptyDir:
            sizeLimit: 64Mi
        - name: config
          persistentVolumeClaim:
            claimName: cleanuparr-config
        - name: backup-script
          configMap:
            name: backup-script-cleanuparr
