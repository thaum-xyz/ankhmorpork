apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: sync
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: recyclarr
    app.kubernetes.io/version: 8.7.1
  name: recyclarr
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  schedule: "0 4 * * *"
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: sync
            app.kubernetes.io/name: recyclarr
            app.kubernetes.io/part-of: recyclarr
        spec:
          containers:
            - args:
                - sync
              env:
                - name: TZ
                  value: Europe/Berlin
                # The NFS export maps /config to uid 977 while this runs as 1000,
                # and git refuses to touch a repo it does not own ("detected
                # dubious ownership"), which fails the whole sync. fsGroup cannot
                # fix it: NFS ignores it. Set via GIT_CONFIG_* rather than a
                # global config file so nothing has to be written to $HOME.
                - name: GIT_CONFIG_COUNT
                  value: "1"
                - name: GIT_CONFIG_KEY_0
                  value: safe.directory
                - name: GIT_CONFIG_VALUE_0
                  value: "*"
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      key: apiKey
                      name: sonarr-api-key
                      optional: true
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      key: apiKey
                      name: radarr-api-key
                      optional: true
              image: ghcr.io/recyclarr/recyclarr:8.7.1
              name: recyclarr
              resources:
                limits:
                  cpu: 500m
                  memory: 300Mi
                requests:
                  cpu: 10m
                  memory: 100Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                # recyclarr clones the guide repos into /config and keeps its
                # profile-rename cache there, so it is a PVC rather than an
                # emptyDir; only the config file itself comes from git.
                - mountPath: /config
                  name: state
                - mountPath: /config/recyclarr.yml
                  name: config
                  subPath: recyclarr.yml
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsUser: 1000
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: recyclarr-config
            - configMap:
                name: recyclarr-config
              name: config
