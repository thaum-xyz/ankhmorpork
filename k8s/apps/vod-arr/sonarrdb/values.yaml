database: sonarr
owner: sonarr

cluster:
  instances: 2
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 130m
      memory: 300Mi
  bootstrap:
    postInitSQL:
      - CREATE DATABASE logs;
      - ALTER DATABASE logs OWNER TO sonarr;

backup:
  # Ends before 01:30 UTC, which is 03:30 Warsaw in summer -- when the UNAS
  # copies these backups offsite. Later, and the copy ships yesterday's.
  schedule: "0 57 23 * * *"
  objectStore:
    # Several clusters share this namespace, so each needs its own store.
    name: versity-vod-sonarr
    bucketPrefix: s3://cnpg/postgres
    endpointURL: http://versitygw.cnpg-system.svc.cluster.local:7070
    retentionPolicy: 7d
    pathSuffix: vod-sonarr

externalSecrets:
  admin:
    remoteKey: SONARR_DB_ADMIN_PASS
  user:
    remoteKey: SONARR_DB_PASS
