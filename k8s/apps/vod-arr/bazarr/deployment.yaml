apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: bazarr
    app.kubernetes.io/part-of: bazarr
    app.kubernetes.io/version: 1.6.0
  name: bazarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/name: bazarr
      app.kubernetes.io/part-of: bazarr
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: bazarr
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/name: bazarr
        app.kubernetes.io/part-of: bazarr
        app.kubernetes.io/version: 1.6.0
    spec:
      containers:
        - env:
            - name: TZ
              value: Europe/Berlin
            # bazarr reads these directly (app/database.py:31-51): POSTGRES_ENABLED
            # overrides settings.postgresql.enabled from config.yaml, and each
            # field below falls back to that file individually. So no init
            # container rewriting config on start, the way the *arrs need for
            # config.xml -- the env is the whole of it.
            - name: POSTGRES_ENABLED
              value: "true"
            - name: POSTGRES_HOST
              value: postgres-bazarr-rw
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DATABASE
              value: bazarr
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-bazarr-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-bazarr-user
                  key: password
          image: ghcr.io/home-operations/bazarr:1.6.0
          imagePullPolicy: IfNotPresent
          name: bazarr
          ports:
            - containerPort: 6767
              name: http
          readinessProbe:
            failureThreshold: 5
            initialDelaySeconds: 5
            tcpSocket:
              port: http
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 700Mi
            requests:
              cpu: 50m
              memory: 250Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Identical mount paths to sonarr and radarr, so bazarr's path
          # mappings are the identity and a renamed episode still resolves.
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /config/log
              name: logs
            - mountPath: /backup
              name: backups
              subPath: bazarr
            - mountPath: /media/tv
              name: tv
            - mountPath: /media/movies
              name: movies
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        # bazarr writes the same lines to log/bazarr.log that it writes to stdout,
        # where alloy already picks them up, so the file set was 7.3M of the claim
        # duplicating what Loki holds. It rotates itself; 64Mi is well clear of it.
        - name: logs
          emptyDir:
            sizeLimit: 64Mi
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config
        - name: backups
          persistentVolumeClaim:
            claimName: backups
        - name: tv
          persistentVolumeClaim:
            claimName: vod-tv
        - name: movies
          persistentVolumeClaim:
            claimName: vod-movies
