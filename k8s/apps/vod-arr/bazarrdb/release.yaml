apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-bazarr
spec:
  releaseName: postgres-bazarr
  chart:
    spec:
      chart: cnpg-database
      version: "0.10.4"
      sourceRef:
        kind: HelmRepository
        name: thaum-charts
      interval: 5m
  interval: 5m
  timeout: 10m
  install:
    # No remediation: an uninstall deletes the Cluster and its PVCs.
    disableWait: true
  upgrade:
    disableWait: true
    remediation:
      retries: 0
  uninstall:
    deletionPropagation: orphan
  driftDetection:
    mode: warn
  valuesFrom:
    - kind: ConfigMap
      name: values-postgres-bazarr
