apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-api-key
spec:
  data:
    - remoteRef:
        key: RADARR_API_KEY
      secretKey: apiKey
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    name: radarr-api-key
