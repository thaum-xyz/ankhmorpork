apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-seerr
spec:
  releaseName: postgres-seerr
  chart:
    spec:
      chart: cnpg-database
      version: "0.10.4"
      sourceRef:
        kind: HelmRepository
        name: thaum-charts
      interval: 5m
  interval: 5m
  timeout: 10m
  install:
    # No remediation: an uninstall deletes the Cluster and its PVCs.
    disableWait: true
  upgrade:
    # Waits, and judges the Cluster through healthCheckExprs below. retries: 0
    # stands: remediation would roll a database back.
    remediation:
      retries: 0
  # Ready only, and no `failed` expression -- both would misread a rolling
  # update. Why: docs/explanation/helm-release-waiting.md
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  uninstall:
    deletionPropagation: orphan
  driftDetection:
    mode: warn
  valuesFrom:
    - kind: ConfigMap
      name: values-postgres-seerr
