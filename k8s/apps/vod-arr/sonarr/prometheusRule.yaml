apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/part-of: sonarr
    app.kubernetes.io/version: 4.0.19
  name: sonarr
spec:
  groups:
    - name: exportarr
      rules:
        - alert: ExportarrDown
          annotations:
            description: |
              Exportarr responsible for data collection from sonarr is down. Check configuration and logs.
            summary: Exportarr is down
          expr: up{job="sonarr"} == 0
          for: 5m
          labels:
            severity: critical
    - name: sonarr
      rules:
        - alert: sonarrDown
          annotations:
            description: |
              Arr Application sonarr in namespace {{ $labels.namespace }} is not reporting status check correctly.
            summary: sonarr is Down
          expr: sonarr_system_status{job="sonarr"} != 1
          for: 15m
          labels:
            severity: critical
        - alert: sonarrUnhealthy
          annotations:
            description: |
              Arr Application sonarr is having issues with {{ $labels.source }} health check - {{ $labels.message }}.
              For more infromation check {{ $labels.wikiurl }}.
            summary: sonarr is unhealthy
          # IndexerStatusCheck joins the exclusions, for the reason prowlarr's
          # own rule already records: every indexer here is synced from prowlarr
          # (each message carries the "(Prowlarr)" suffix), public trackers fail
          # routinely, and prowlarr deliberately stays quiet about a single one.
          # Leaving it in meant one dead tracker opened an issue in both radarr
          # and sonarr while the source of truth said nothing. prowlarr's
          # prowlarrIndexersUnavailable covers the case that is not ordinary.
          # What is left are the checks only sonarr can see: root folder and
          # mount, download client reachability, remote path mapping, import
          # lists.
          expr: max_over_time(sonarr_system_health_issues{job="sonarr",source!="UpdateCheck",source!="IndexerLongTermStatusCheck",source!="IndexerStatusCheck"}[1h]) == 1
          for: 2h
          labels:
            severity: warning
