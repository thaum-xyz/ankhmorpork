apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: seerr-probe-success
spec:
  # target is a PLACEHOLDER (#1379): the probe endpoint changed on 2026-09-06
  # 13:43 UTC, so the first 7d window measuring one endpoint throughout closes
  # 2026-09-13 13:43 UTC. Provisionally 99.385% over the first 3 days.
  description: >-
    Fraction of successful blackbox probes against seek.krupa.net.pl.
  alerting:
    name: SeerrProbeBudgetBurn
    absentName: SeerrProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://seek\\.krupa\\.net\\.pl(/.*)?"}
  target: "95.0"
  window: 7d