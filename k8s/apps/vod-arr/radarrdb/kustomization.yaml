apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - release.yaml
configMapGenerator:
  - name: values-postgres-radarr
    files:
      - values.yaml=values.yaml
# Stable name; see docs/explanation/helm-values.md.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
