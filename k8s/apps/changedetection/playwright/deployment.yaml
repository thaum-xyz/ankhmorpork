apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright
  labels:
    app: playwright
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playwright
  template:
    metadata:
      labels:
        app: playwright
    spec:
      containers:
      - name: playwright
        # Upstream publishes no moving semver tag -- :latest is ahead of the
        # newest release tag -- so pin the digest to keep restarts reproducible
        # and give Renovate something to bump.
        image: dgtlmoon/sockpuppetbrowser:latest@sha256:1d8f72d2ce2085faed4232e5ae1e65c02efe5b831a18e127829b267c260b4fb2
        ports:
          - containerPort: 3000
        env:
          - name: DEFAULT_LAUNCH_ARGS
            value: '["--window-size=1920,1080"]'
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: "1000Mi"
