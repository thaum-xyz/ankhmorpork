apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: changedetection-probe-success
spec:
  # Probes through the oauth2-proxy as well as DNS, TLS and the ingress. Kept
  # beside the Ingress and the proxy that carry the probe configuration, since
  # the three have to move together -- the probe only reaches changedetection
  # because --skip-auth-route exempts the path this measures.
  #
  # changedetection exports no metrics of its own and has no endpoint that
  # reports its own health, so this probe is its only availability signal -- and
  # it is a reachability check, not a statement about whether watches are
  # actually being fetched.
  #
  # target from the 7d window 2026-09-09..09-16 (#1379): 99.90576% achieved,
  # 19 failed samples in 4 bursts, worst 7m00s, 9.4% of a 99% budget.
  # 7m00s burst is the cluster-wide event of 2026-09-12; see
  # k8s/apps/homer/app/slo-probe-success.yaml.
  description: >-
    Fraction of successful blackbox probes against change.krupa.net.pl.
  alerting:
    name: ChangedetectionProbeBudgetBurn
    absentName: ChangedetectionProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://change\\.krupa\\.net\\.pl(/.*)?"}
  target: "99"
  window: 7d