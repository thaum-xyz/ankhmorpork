# Owned here rather than rendered by the chart: the chart's Ingress always
# targets its own Service, which would bypass the proxy. chart values set
# ingress.enabled: false for the same reason.
#
# Deliberately not named "changedetection": that is the chart's own Ingress name,
# and the same upgrade that sets ingress.enabled: false makes Helm delete an
# Ingress by that name -- which would take this one with it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: changedetection-public
  labels:
    app.kubernetes.io/name: changedetection
    homer.rajsingh.info/enabled: "true"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    item.homer.rajsingh.info/name: "Change Detection"
    item.homer.rajsingh.info/subtitle: "Website change detection"
    item.homer.rajsingh.info/logo: "https://user-images.githubusercontent.com/275001/231676626-7d768df9-be4c-4187-a573-aba640b826d3.svg"
    item.homer.rajsingh.info/order: "80"
    service.homer.rajsingh.info/name: "Ankh Cloud"
    service.homer.rajsingh.info/icon: "fa fa-cloud"
    service.homer.rajsingh.info/order: "30"
spec:
  ingressClassName: public
  rules:
    - host: change.krupa.net.pl
      http:
        paths:
          - backend:
              service:
                name: oauth2-proxy
                port:
                  name: oauth2
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - change.krupa.net.pl
      secretName: change-krupa-net-pl-tls
