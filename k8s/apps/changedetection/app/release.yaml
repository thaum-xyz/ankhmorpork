---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: changedetection
spec:
  chart:
    spec:
      chart: changedetection
      version: "0.12.5"
      sourceRef:
        kind: HelmRepository
        name: alekc-charts
        namespace: changedetection
      interval: 5m
  interval: 5m
  timeout: 2m
  install:
    timeout: 10m
    disableWait: false
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    disableWait: false
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: values
  postRenderers:
    - kustomize:
        patches:
        # The chart hardcodes both probes with no values knob, so liveness would
        # kill the pod ~30s in. 0.53.x rewrites the datastore on first boot and a
        # restart loop mid-rewrite is the one failure worth ruling out; a
        # startupProbe holds liveness off until the app actually serves.
        - target:
            group: apps
            version: v1
            kind: Deployment
            name: changedetection
          patch: |-
            - op: add
              path: /spec/template/spec/containers/0/startupProbe
              value:
                httpGet:
                  path: /
                  port: http
                periodSeconds: 5
                failureThreshold: 36
