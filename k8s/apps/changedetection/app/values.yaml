# Reference documentation: https://gitlab.com/alexander-chernov/helm/changedetection

# The chart's Ingress always points at its own Service, which would route around
# the oauth2-proxy. Both ingresses are defined alongside this file instead and
# target the proxy.
ingress:
  enabled: false

env:
  simple:
    BASE_URL: https://change.krupa.net.pl
    PLAYWRIGHT_DRIVER_URL: "ws://playwright:3000/?stealth=1&--disable-web-security=true"

resources:
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

persistence:
  # piraeus-r2-roaming rather than piraeus-r2: allowRemoteVolumeAccess lets the
  # Pod start on any node and attach diskless instead of waiting for one holding
  # a replica, which matters when kured reboots nodes.
  storageClass: "piraeus-r2-roaming"
  size: 1Gi
  # RWX was never required here. Piraeus offers none, and the chart runs one
  # replica with strategy Recreate, so two Pods never hold this at once --
  # which is the usual reason a single-replica Deployment ends up declaring it.
  accessMode: ReadWriteOnce
