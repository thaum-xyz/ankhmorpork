apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-bucket
spec:
  # Loki will not create its own bucket, and a missing one surfaces as opaque
  # write failures rather than anything naming the actual problem.
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          env:
            - name: BUCKET_NAME
              value: loki
            - name: VGW_ENDPOINT
              value: http://versitygw:7070
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: versitygw-credentials
                  key: rootAccessKeyId
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: versitygw-credentials
                  key: rootSecretAccessKey
          command: ["/bin/sh", "-lc"]
          args:
            - |
              mc alias set vgw "$VGW_ENDPOINT" "$ACCESS_KEY" "$SECRET_KEY" --api S3v4
              mc mb --ignore-existing vgw/$BUCKET_NAME
