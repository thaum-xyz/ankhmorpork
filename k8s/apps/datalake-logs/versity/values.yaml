# Config reference: https://github.com/versity/versitygw/blob/main/chart/values.yaml
#
# S3 backend for Loki, sitting next to it. Replaces Backblaze B2, so log chunks
# no longer leave the network.

# Pinned. The chart defaults to :latest. The repository repeats the chart
# default so Renovate can see the image; a bare tag is invisible to it.
image:
  repository: ghcr.io/versity/versitygw
  tag: "v1.11.0"

auth:
  existingSecret: versitygw-credentials

# No fsGroup; the chart defaults to 1000. Where the driver's fsGroupPolicy is
# File, as nfs.csi.k8s.io's was, kubelet walks the whole volume changing group
# and mode before the container may start. Measured 2026-11-10: a million
# files and fourteen minutes, against a ten-minute Helm timeout, so no upgrade
# could finish (#1709) -- and a plain pod restart costs Loki its object store
# for as long. The file count grows with retention.
#
# csi-nfs now sets fsGroupPolicy: None for every volume, so this says the same
# thing twice. It stays because that is one chart value, and a value at a path
# a later chart stops reading is silently inert; here the price of losing it
# is the outage above.
#
# The walk buys nothing here. The UNAS refuses chown: everything on the share
# stays 977:988, what the gateway writes as uid 1000 included, and the group
# the container runs as is already 1000. That is also why
# fsGroupChangePolicy: OnRootMismatch is no way out -- the root never reads as
# gid 1000, so the mismatch is permanent and the walk runs every time.
#
# null rather than {}: Helm deep-merges maps, so only an explicit null removes
# a chart default. seccompProfile stays as the chart sets it.
podSecurityContext:
  fsGroup: null

gateway:
  backend:
    type: posix
    args: "/mnt/data"
    # Object metadata as ordinary files rather than xattrs, which is what lets
    # this sit on an NFSv3 share.
    sidecarDir: "/mnt/metadata"

# Sized for 6 months of retention. nfs.csi.k8s.io does not enforce the request,
# so this is a label rather than a reservation.
persistence:
  enabled: true
  create: true
  size: 100Gi
  storageClassName: unifi-nas
  accessMode: ReadWriteMany

resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 50m
    memory: 128Mi
