# Config reference: https://github.com/rajsinghtech/homer-operator/blob/main/charts/homer-operator/values.yaml
#
# Only the operator is configured here. The dashboard itself is a Dashboard CR,
# see apps/homer/services.

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

highAvailability:
  podDisruptionBudget:
    # The chart does not yet expose unhealthyPodEvictionPolicy; the Kyverno PDB
    # policy will keep warning about that remaining drain-safety gap.
    minAvailable: null
    maxUnavailable: 1
