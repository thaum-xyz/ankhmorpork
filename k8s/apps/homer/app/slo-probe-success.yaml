apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: homer-probe-success
spec:
  # Availability as a person experiences it: the blackbox probe, end to end
  # through DNS, TLS and the ingress. Split out of the shared
  # blackbox-probe-success so this service owns the objective that describes it,
  # the same reason its Ingress is not kept in traefik's namespace.
  #
  # Matches on the host rather than the full probe URL, so changing
  # ingress.thaum.xyz/probe-uri retunes the check without silently emptying the
  # SLO behind it.
  # The dashboard everything else is reached from.
  #
  # target from the 7d window 2026-09-03..09-10 (#1379), the first full window
  # in which this probe measured one endpoint throughout: 100% achieved, not a
  # single failed sample. 99.5 rather than tighter because at 30s samples a
  # 99.9 target pages on one failed scrape; 99.5 needs 1m30s.
  description: >-
    Fraction of successful blackbox probes against ankhmorpork.thaum.xyz.
  alerting:
    name: HomerProbeBudgetBurn
    absentName: HomerProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://ankhmorpork\\.thaum\\.xyz(/.*)?"}
  target: "99.5"
  window: 7d