apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homer
resources:
  - repository.yaml
  - release.yaml
  - ingress.yaml
  - ingress-cloudflare.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: values-homer-operator
    files:
      - values.yaml=values.yaml
