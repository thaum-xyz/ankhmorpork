apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homer
resources:
  - repository.yaml
  - release.yaml
  - homer/ingress.yaml
  - homer/ingress-cloudflare.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: homer-values
    files:
      - values.yaml=values.yaml
