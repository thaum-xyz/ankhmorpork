database: immich
owner: immich

cluster:
  instances: 3
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.11-1.1.1
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
  # Requests only, no limits, matching the live spec.
  resources:
    requests:
      cpu: 50m
      memory: 500Mi
  # Bumping imageName to a release carrying a newer vchord leaves the extension
  # behind at the old version. immich notices and tries to fix it itself, but
  # postgres owns the extension so it cannot, and the workers crashloop with
  # "must be owner of extension vchord". Follow an image bump with:
  #   ALTER EXTENSION vchord UPDATE;
  #   REINDEX INDEX clip_index;
  #   REINDEX INDEX face_index;
  # run as postgres against the immich database, on the primary.
  #
  # The REINDEX is needed whenever vchord's on-disk index format changes, which
  # so far is every minor and major release (0.3, 0.4, 0.5, 1.0, 1.1) and no
  # patch release. Until then every smart search and face match fails with
  # "bad version number; after upgrading VectorChord, please use REINDEX".
  # Both indexes rebuild in about a second, so run it after any vchord bump.
  postgresql:
    shared_preload_libraries:
      - vchord.so
    parameters:
      search_path: '"$user", public'
  bootstrap:
    postInitApplicationSQL:
      - 'CREATE EXTENSION IF NOT EXISTS vchord CASCADE;'
      # public, not pg_catalog: immich resolves these as public.earth and
      # public.ll_to_earth, and that is where the live cluster has them.
      - 'CREATE EXTENSION IF NOT EXISTS cube WITH SCHEMA public;'
      - 'CREATE EXTENSION IF NOT EXISTS earthdistance WITH SCHEMA public;'

backup:
  # Ends before 01:30 UTC, which is 03:30 Warsaw in summer -- when the UNAS
  # copies these backups offsite. Later, and the copy ships yesterday's.
  schedule: "0 43 23 * * *"
  objectStore:
    retentionPolicy: 14d
    pathSuffix: photos

externalSecrets:
  admin:
    remoteKey: IMMICH_POSTGRES_ADMIN_PASS
  user:
    remoteKey: IMMICH_POSTGRES_PASS

prometheusRule:
  # immich's IntegrityService sweeps nightly at 03:00 local, holding one
  # transaction open while it batches through ~42k untracked-file and ~42k
  # missing-file checks. Measured peaks of 1683s (2026-09-02) and 1113s
  # (2026-09-03), climbing then committing -- the job working, not a
  # transaction stuck on locks, and it grows with the library. The default
  # 300s filed a GitHub issue every night (#685); the other ten databases
  # keep that default.
  maxTransactionSeconds: 3600
