database: immich
owner: immich

cluster:
  instances: 3
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.5-0.4.3
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
  # Requests only, no limits, matching the live spec.
  resources:
    requests:
      cpu: 50m
      memory: 500Mi
  # Bumping imageName to a release carrying a newer vchord leaves the extension
  # behind at the old version. immich notices and tries to fix it itself, but
  # postgres owns the extension so it cannot, and the workers crashloop with
  # "must be owner of extension vchord". Follow an image bump with:
  #   ALTER EXTENSION vchord UPDATE;
  # run as postgres against the immich database.
  postgresql:
    shared_preload_libraries:
      - vchord.so
    parameters:
      search_path: '"$user", public'
  bootstrap:
    postInitApplicationSQL:
      - 'CREATE EXTENSION IF NOT EXISTS vchord CASCADE;'
      # public, not pg_catalog: immich resolves these as public.earth and
      # public.ll_to_earth, and that is where the live cluster has them.
      - 'CREATE EXTENSION IF NOT EXISTS cube WITH SCHEMA public;'
      - 'CREATE EXTENSION IF NOT EXISTS earthdistance WITH SCHEMA public;'

backup:
  schedule: "0 13 2 * * *"
  objectStore:
    name: versity
    bucketPrefix: s3://cnpg/postgres
    endpointURL: http://versitygw.cnpg-system.svc.cluster.local:7070
    retentionPolicy: 14d
    pathSuffix: photos

externalSecrets:
  admin:
    remoteKey: IMMICH_POSTGRES_ADMIN_PASS
  user:
    remoteKey: IMMICH_POSTGRES_PASS
