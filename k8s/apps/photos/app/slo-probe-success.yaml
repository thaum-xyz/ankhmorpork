apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: photos-probe-success
spec:
  # Availability as a person experiences it: the blackbox probe, end to end
  # through DNS, TLS and the ingress. Split out of the shared
  # blackbox-probe-success so this service owns the objective that describes it,
  # the same reason its Ingress is not kept in traefik's namespace.
  #
  # Matches on the host rather than the full probe URL, so changing
  # ingress.thaum.xyz/probe-uri retunes the check without silently emptying the
  # SLO behind it.
  # immich exports 565 metric families and not one measures the request path,
  # so the probe is the only availability signal it has.
  #
  # target from the 7d window 2026-09-03..09-10 (#1379): 99.94050% achieved, 12
  # failed samples in 3 bursts, worst 4m00s, 6.0% of a 99% budget.
  #
  # One asterisk on that window: the probe pointed at / rather than
  # /api/server/config for about 5 hours from 2026-09-06 21:19 before #1345
  # put it back. The endpoint measured now is the one measured for the other
  # 6.8 days, so the reading holds.
  description: >-
    Fraction of successful blackbox probes against photos.krupa.net.pl.
  alerting:
    name: PhotosProbeBudgetBurn
    absentName: PhotosProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://photos\\.krupa\\.net\\.pl(/.*)?"}
  target: "99"
  window: 7d