# Config reference: https://github.com/immich-app/immich-charts/tree/main/charts/immich

controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/immich-app/immich-server
          tag: "v3.1.0"
        env:
          TZ: "Europe/Warsaw"
          LOG_LEVEL: "debug"
          DB_HOSTNAME: "postgres-rw"
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: postgres-user
                key: username
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: postgres-user
                key: password
          DB_DATABASE_NAME: "immich"
          # Auto-detection would pick it anyway, but be explicit now that the
          # cluster carries both vchord and vector.
          DB_VECTOR_EXTENSION: "vectorchord"
          IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'

immich:
  metrics:
    enabled: true
  persistence:
    library:
      existingClaim: immich-library

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
  persistence:
    data:
      enabled: false
      size: 1Gi
      type: emptyDir
      accessMode: ReadWriteOnce

server:
  controllers:
    main:
      # Matches what has actually been running since before 2025-11-30. git said
      # 3, the cluster ran 2, and no field manager claimed the field, so an
      # upgrade might or might not have scaled up. Declaring 2 settles it.
      replicas: 2
      strategy: RollingUpdate
      rollingUpdate:
        unavailable: 1
      containers:
        main:
          probes:
            liveness:
              spec:
                initialDelaySeconds: 180
                failureThreshold: 6
            readiness:
              spec:
                failureThreshold: 2
                periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 160Mi

  serviceMonitor:
    main:
      # Chart 0.12.0 switched the default to app.kubernetes.io/name, whose value
      # here is "server" -- a label that says nothing and collides with anything
      # else generic. app.kubernetes.io/service carries "immich-server", so this
      # keeps job="immich-server" and existing series stay continuous.
      jobLabel: app.kubernetes.io/service

  ingress:
    main:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        # Without this the probe hits `/` and gets 10.5KB of Svelte shell, which
        # the web container serves from static assets -- it returns 200 with the
        # API dead, and /health and /healthz fall through to the same catch-all.
        # Not /api/server/ping either: ServerService.ping() is `return { res:
        # 'pong' }`, a literal that cannot fail while the process can route a
        # request, which is what `up` already tells us. getSystemConfig() behind
        # /api/server/config makes three uncached reads -- the config repository,
        # an admin-user lookup for isInitialized, and system_metadata for
        # isOnboarded -- so it answers 372 bytes of JSON and fails when Postgres
        # is unreachable. It is also what the login page itself fetches.
        ingress.thaum.xyz/probe-uri: /api/server/config
        item.homer.rajsingh.info/name: "Immich"
        item.homer.rajsingh.info/subtitle: "Photo & Video Library"
        item.homer.rajsingh.info/logo: "https://raw.githubusercontent.com/loganmarchione/homelab-svg-assets/refs/heads/main/assets/immich.svg"
        item.homer.rajsingh.info/order: "70"
        service.homer.rajsingh.info/name: "Ankh Cloud"
        service.homer.rajsingh.info/icon: "fa fa-cloud"
        service.homer.rajsingh.info/order: "30"
      labels:
        ingress.thaum.xyz/probe: enabled
        homer.rajsingh.info/enabled: "true"
      hosts:
        - host: photos.krupa.net.pl
          paths:
            - path: "/"
      tls:
        - secretName: immich-tls
          hosts:
            - photos.krupa.net.pl
  persistence:
    old:
      enabled: false
      accessMode: ReadWriteMany
      readOnly: true
      mountPath: /old
      existingClaim: library-old

machine-learning:
  enabled: true
  controllers:
    main:
      replicas: 1
      # Recreate since the cache became ReadWriteOnce: RollingUpdate's default
      # maxSurge would start the replacement before this Pod releases the
      # volume, and deadlock if it landed on another node.
      strategy: Recreate
      containers:
        main:
          env:
            HF_XET_CACHE: /cache/huggingface-xet
            MPLCONFIGDIR: /cache/matplotlib-config
          resources:
            requests:
              cpu: 10m
              memory: 780Mi
  persistence:
    cache:
      enabled: true
      size: 3Gi
      type: persistentVolumeClaim
      # RWX was never required -- one replica, one mounter -- and Piraeus offers
      # none. Recreate above keeps two Pods from ever holding it at once.
      accessMode: ReadWriteOnce
      # Kept on replicated storage rather than emptyDir. It is a genuine
      # download cache, but a measured 786M of it (CLIP 583M, buffalo_l 183M,
      # OCR 21M), so emptyDir would mean re-fetching that from HuggingFace after
      # every kured reboot with smart search degraded until it finished.
      storageClass: piraeus-r2-roaming
