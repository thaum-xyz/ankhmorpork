---
apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.universe.tf/address-pool: default
    metallb.universe.tf/allow-shared-ip: valheim-svc
  labels:
    app.kubernetes.io/component: game-server
    app.kubernetes.io/name: valheim
    app.kubernetes.io/part-of: valheim
  name: valheim
spec:
  ports:
  - name: gameport
    port: 2456
    #nodePort: 32456
    protocol: UDP
    targetPort: gameport
  - name: queryport
    port: 2457
    #nodePort: 32457
    protocol: UDP
    targetPort: queryport
  selector:
    app.kubernetes.io/component: game-server
    app.kubernetes.io/name: valheim
    app.kubernetes.io/part-of: valheim
  #type: NodePort
  # Cluster, not Local: tailnet clients enter on the primary Tailscale subnet
  # router, which drops the VIP when the only pod runs elsewhere. See plex README.
  externalTrafficPolicy: Cluster
  type: LoadBalancer
  loadBalancerIP: 192.168.50.131
