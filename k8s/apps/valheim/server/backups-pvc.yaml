apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    # NFS: this PVC reports the whole export's fill level, not its own.
    excluded_from_alerts: "true"
  name: backups
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: unifi-nas
