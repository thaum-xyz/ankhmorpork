---
apiVersion: v1
kind: ConfigMap
metadata:
  name: valheim-config
  labels:
    app.kubernetes.io/component: game-server
    app.kubernetes.io/name: valheim
    app.kubernetes.io/part-of: valheim
data:
  SERVER_NAME: "MISTery"
  # Valheim 1.0 world folder, seeded by hand into
  # data-valheim-0:/gamefiles/worlds_local/Pingwiny/ from a Steam Cloud save.
  WORLD_NAME: "Pingwiny"
  SERVER_PORT: "2456"
  SERVER_PUBLIC: "false"
  SERVER_PASS: "babeczka"
  # No -preset/-modifier: the world already stores its own (default preset,
  # raids "more"), and launch flags would override them.
  SERVER_ARGS: ""
