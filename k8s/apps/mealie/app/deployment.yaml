kind: Deployment
apiVersion: apps/v1
metadata:
  name: mealie
  labels:
    app.kubernetes.io/name: mealie
spec:
  # data is ReadWriteOnce since it moved to piraeus, which offers no RWX. A
  # rolling update would start the replacement before the old Pod releases the
  # volume and deadlock if it landed on another node -- the same trap karakeep
  # documents. Recreate takes the old Pod down first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
    spec:
      containers:
      - name: mealie
        # OIDC note, inherited from v3.21.0 rather than introduced here: mealie
        # refuses a login unless the provider asserts email_verified. It works
        # because pocket-id runs with EMAILS_VERIFIED=true. If that is ever
        # turned off, logins here break, and OIDC_REQUIRES_EMAIL_VERIFICATION
        # false is the escape hatch -- at the cost of trusting an unverified,
        # self-asserted address to match an existing account.
        image: ghcr.io/mealie-recipes/mealie:v3.22.0
        env:
        - name: ALLOW_SIGNUP
          value: 'false'
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: Europe/Warsaw
        # Loads the logging ConfigMap in place of mealie's built-in
        # logconf.prod.json, whose "file" handler wrote ${DATA_DIR}/mealie.log --
        # a duplicate of this container's stdout, which alloy already ships to
        # Loki, growing ~1M/day on a replicated volume holding 2.1M of recipes.
        - name: LOG_CONFIG_OVERRIDE
          value: /etc/mealie/logconf.json
        - name: BASE_URL
          value: https://recipes.krupa.net.pl
        - name: ALLOW_PASSWORD_LOGIN
          value: 'False'
        - name: OIDC_AUTO_REDIRECT
          value: 'True'
        - name: OIDC_AUTH_ENABLED
          value: 'True'
        - name: OIDC_SIGNUP_ENABLED
          value: 'True'
        - name: OIDC_CONFIGURATION_URL
          value: https://login.krupa.net.pl/.well-known/openid-configuration
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oidc-client
              key: clientID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oidc-client
              key: clientSecret
        - name: OIDC_ADMIN_GROUP
          value: admin
        - name: OIDC_USER_GROUP
          value: app:mealie
        - name: DB_ENGINE
          value: postgres
        - name: POSTGRES_SERVER
          value: postgres-rw
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: mealie
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-user
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-user
              key: password
        ports:
        - containerPort: 9000
          name: http
        resources:
          limits:
            cpu: 1
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: data
          mountPath: /app/data/
        # Its own directory, so no subPath is needed. mealie reads this once
        # while building the root logger, so editing the ConfigMap alone changes
        # nothing until the Pod restarts.
        - name: logging
          mountPath: /etc/mealie
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
      - name: logging
        configMap:
          name: logging
