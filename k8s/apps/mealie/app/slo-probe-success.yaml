apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: mealie-probe-success
spec:
  # Availability as a person experiences it: the blackbox probe, end to end
  # through DNS, TLS and the ingress. Split out of the shared
  # blackbox-probe-success so this service owns the objective that describes it,
  # the same reason its Ingress is not kept in traefik's namespace.
  #
  # Matches on the host rather than the full probe URL, so changing
  # ingress.thaum.xyz/probe-uri retunes the check without silently emptying the
  # SLO behind it.
  #
  # target from the 7d window 2026-09-03..09-10 (#1379): 99.91560% achieved, 17
  # failed samples in 4 bursts, worst 7m00s, 8.4% of a 99% budget. 99.9 was
  # rejected here: its weekly budget is 10m04s and this week spent 8m30s on
  # planned work alone.
  description: >-
    Fraction of successful blackbox probes against recipes.krupa.net.pl.
  alerting:
    name: MealieProbeBudgetBurn
    absentName: MealieProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://recipes\\.krupa\\.net\\.pl(/.*)?"}
  target: "99"
  window: 7d