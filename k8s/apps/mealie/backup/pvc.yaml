# This namespace's restic repository: docs/explanation/app-backups.md.
# excluded_from_alerts is stamped by mutate-nfs-pvc-alert-exclusion; do not add it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-repo
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/name: mealie
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: unifi-nas
