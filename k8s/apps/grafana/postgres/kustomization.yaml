apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Declared here because pocket-id, paperless and multimedia have no namespace on
# their parent kustomization -- their manifests each carried their own.
namespace: grafana
resources:
  - repository.yaml
  - release.yaml
configMapGenerator:
  - name: values-postgres
    files:
      - values.yaml=values.yaml
# Stable name; see docs/explanation/helm-values.md.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
