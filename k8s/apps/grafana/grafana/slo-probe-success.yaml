apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: grafana-probe-success
spec:
  # /api/health reports database status, so this fails when Grafana's DB is
  # unreachable and not only when the process dies.
  #
  # target from the 7d window 2026-09-09..09-16 (#1379): 99.90576% achieved,
  # 19 failed samples in 5 bursts, worst 7m00s, 9.4% of a 99% budget.
  # 7m00s burst is the cluster-wide event of 2026-09-12; see
  # k8s/apps/homer/app/slo-probe-success.yaml.
  description: >-
    Fraction of successful blackbox probes against grafana.krupa.net.pl.
  alerting:
    name: GrafanaProbeBudgetBurn
    absentName: GrafanaProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://grafana\\.krupa\\.net\\.pl(/.*)?"}
  target: "99"
  window: 7d