# Helm chart values reference https://github.com/grafana/helm-charts/tree/main/charts/grafana

replicas: 1
headlessService: true

podDisruptionBudget:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow

# The chart renders the traefik route; ingress-cloudflare.yaml carries the same
# host for outside access.
#
# This was cloudflare-only, which left grafana.krupa.net.pl with no internal A
# record -- external-dns published just the tunnel CNAME, and
# *.cfargotunnel.com resolves nowhere outside Cloudflare's edge, so the host was
# unreachable from the tailnet. Note the grafana at grafana.ankhmorpork.thaum.xyz
# is a different instance, kube-prometheus's in the monitoring namespace, so it
# was not covering for this one.
#
# probe-uri and the probe label are restored along with it: blackbox takes its
# scheme from whether the Ingress declares TLS, so only the traefik route is
# probeable.
ingress:
  enabled: true
  ingressClassName: public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    probe-uri: /-/healthy
    item.homer.rajsingh.info/name: "Grafana"
    item.homer.rajsingh.info/logo: "https://grafana.com/static/img/logos/grafana_logo_swirl-events.svg"
    item.homer.rajsingh.info/order: "50"
    service.homer.rajsingh.info/name: "Administration"
    service.homer.rajsingh.info/icon: "fa fa-user-shield"
    service.homer.rajsingh.info/order: "10"
  labels:
    homer.rajsingh.info/enabled: "true"
    probe: enabled
  hosts:
    - "grafana.krupa.net.pl"
  tls:
    - hosts:
        - grafana.krupa.net.pl
      secretName: ingress-grafana-tls

resources:
  requests:
    cpu: 80m
    memory: 512Mi
  limits:
    cpu: 800m
    memory: 4096Mi

service:
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "grafana-server"

persistence:
  enabled: false

sidecar:
  enableUniqueFilenames: true
  resources:
    requests:
      cpu: 6m
      memory: 192Mi
    limits:
      cpu: 50m
      memory: 384Mi
  alerts:
    enabled: false
  dashboards:
    enabled: true
    searchNamespace: ALL
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true

  datasources:
    enabled: true
    label: "grafana_datasource"
    searchNamespace: ALL

#datasources:

#plugins: []

imageRenderer:
  # Note: This will take considerable amount of memory.
  enabled: false

admin:
  existingSecret: grafana-admin-creds
  userKey: admin-user
  passwordKey: admin-password

serviceMonitor:
  enabled: true

testFramework:
  enabled: false

env:
  GF_FEATURE_TOGGLES_ENABLE: "publicDashboards,prometheusResourceBrowserCache"

extraSecretMounts:
  - name: postgres-user
    secretName: postgres-user
    defaultMode: 0440
    mountPath: /etc/secrets/database
    readOnly: true
  - name: pocket-id-oauth
    secretName: grafana-oidc
    defaultMode: 0440
    mountPath: /etc/secrets/oauth
    readOnly: true

grafana.ini:
  # Config reference - https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
  analytics:
    check_for_updates: false
  news:
    news_feed_enabled: false
  server:
    domain: grafana.krupa.net.pl
    root_url: "https://grafana.krupa.net.pl"
  auth:
    disable_login_form: true
    #disable_signout_menu: false
  auth.basic:
    # Enable basic auth as reloaders are using this method to authenticate
    enabled: true
  auth.generic_oauth:
    enabled: true
    name: "Pocket ID"
    client_id: "$__file{/etc/secrets/oauth/clientID}"
    client_secret: "$__file{/etc/secrets/oauth/clientSecret}"
    auth_url: "https://login.krupa.net.pl/authorize"
    token_url: "https://login.krupa.net.pl/api/oidc/token"
    #scopes: "openid email profile groups"
    scopes: "openid email profile"
    email_attribute_name: "email:primary"
    #groups_attribute_path: "groups"
    #allowed_groups: "monitoring admin"
    skip_org_role_sync: true
  database:
    type: postgres
    host: postgres-rw:5432
    name: grafana
    # Secrets are mounted from a file in /etc/secrets/database mounted by extraSecretMounts
    # more about this in grafana helm-chart doc:
    # https://github.com/grafana/helm-charts/blob/main/charts/grafana/README.md#how-to-securely-reference-secrets-in-grafanaini
    user: $__file{/etc/secrets/database/username}
    password: $__file{/etc/secrets/database/password}
    # ssl_mode: require
  unified_alerting:
    enabled: true
    execute_alerts: false  # Alerts should be evaluated/excuted by prometheus/thanos. Otherwise grafana will become a critical part of the observability stack which is unnnecessary.
