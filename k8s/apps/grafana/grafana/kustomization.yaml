apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - repository.yaml
  - release.yaml
  - prometheusrule.yaml
  - admin-creds.yaml
  - oidc-secret.yaml
  - ingress-cloudflare.yaml
  - slo-probe-success.yaml
configMapGenerator:
  - name: values-grafana
    files:
      - values.yaml=values.yaml
# Stable name; see docs/explanation/helm-values.md.
generatorOptions:
  disableNameSuffixHash: true
