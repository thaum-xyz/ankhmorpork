apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# multimedia was one of the three apps whose parent declared no namespace,
# leaving every manifest to carry its own -- so anything added without one
# would silently land in default.
namespace: multimedia
resources:
  - namespace.yaml
  - shared/
  - prowlarr/
  - prowlarrdb/
  - radarr/
  - radarrdb/
  - sonarr/
  - sonarrdb/
  - transmission/
