database: sonarr
owner: sonarr

cluster:
  imageName: ghcr.io/cloudnative-pg/postgresql:16.1
  instances: 2
  storage:
    size: 10Gi
  # Requests only, no limits, matching the live spec.
  resources:
    requests:
      cpu: 130m
      memory: 300Mi
  bootstrap:
    postInitSQL:
      - CREATE DATABASE logs;
      - ALTER DATABASE logs OWNER TO sonarr;

backup:
  schedule: "0 27 3 * * *"
  objectStore:
    # Three clusters share this namespace, so each needs its own store.
    name: backblaze-sonarr
    retentionPolicy: 7d
    pathSuffix: sonarr

externalSecrets:
  admin:
    remoteKey: SONARR_DB_ADMIN_PASS
  user:
    remoteKey: SONARR_DB_PASS
