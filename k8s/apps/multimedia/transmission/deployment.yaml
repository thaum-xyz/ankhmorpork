apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: transmission
    app.kubernetes.io/version: 5.3.0
  name: transmission
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transmission
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: transmission
      labels:
        app.kubernetes.io/name: transmission
        app.kubernetes.io/version: 5.3.0
    spec:
      # The transmission-exporter sidecar was removed here. Its upstream repo is
      # archived and the :master tag it floated on was last built in 2020; the
      # process wedged on 2026-07-09 -- its final log line and the start of the
      # TargetDown alert are the same minute -- and served nothing but scrape
      # timeouts for the three weeks after. The replacements on offer are all
      # single-digit-star hobby forks, so swapping one unmaintained exporter for
      # another was not an improvement. Removed along with its PodMonitor, which
      # takes a permanently firing alert with it.
      containers:
        - envFrom:
            - configMapRef:
                name: transmission-config
                optional: false
            - secretRef:
                name: transmission-vpn-creds
                optional: false
          image: haugene/transmission-openvpn:5.4.2
          name: transmission
          ports:
            - containerPort: 9091
              name: http-api
          readinessProbe:
            failureThreshold: 5
            initialDelaySeconds: 10
            tcpSocket:
              port: http-api
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - mountPath: /config
              name: transmission-config
            - mountPath: /download
              name: data
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.0.0.1
      dnsPolicy: None
      restartPolicy: Always
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_adv_win_scale
            value: "4"
      tolerations: []
      volumes:
        - name: transmission-config
          persistentVolumeClaim:
            claimName: transmission-config
        - name: data
          persistentVolumeClaim:
            claimName: downloads
