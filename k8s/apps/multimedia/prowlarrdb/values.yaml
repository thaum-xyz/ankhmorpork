database: prowlarr
owner: prowlarr

cluster:
  imageName: ghcr.io/cloudnative-pg/postgresql:16.1
  instances: 2
  storage:
    size: 10Gi
  # Requests only, no limits, matching the live spec.
  resources:
    requests:
      cpu: 130m
      memory: 300Mi
  bootstrap:
    postInitSQL:
      - CREATE DATABASE logs;
      - ALTER DATABASE logs OWNER TO prowlarr;

backup:
  schedule: "0 7 3 * * *"
  objectStore:
    # Three clusters share this namespace, so each needs its own store.
    name: backblaze-prowlarr
    retentionPolicy: 7d
    pathSuffix: prowlarr

externalSecrets:
  admin:
    remoteKey: PROWLARR_DB_ADMIN_PASS
  user:
    remoteKey: PROWLARR_DB_PASS
