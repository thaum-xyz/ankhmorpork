kind: Deployment
apiVersion: apps/v1
metadata:
  name: nanny-ogg-tools
  labels:
    app.kubernetes.io/name: nanny-ogg-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nanny-ogg-tools
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanny-ogg-tools
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: tools
          # Source: https://github.com/odi-adrianna/nanny-ogg
          image: ghcr.io/odi-adrianna/nanny-ogg:2026.48.0
          env:
            - name: MEALIE_BASE_URL
              value: http://mealie.mealie.svc:9000
            # "today" in the meal plan is the household's day, not UTC's.
            - name: TZ
              value: Europe/Warsaw
          envFrom:
            - secretRef:
                name: nanny-ogg-tools-secrets
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
