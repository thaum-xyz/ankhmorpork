apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nanny-ogg-tools-secrets
  labels:
    app.kubernetes.io/name: nanny-ogg-tools
spec:
  data:
    # Created from Adrianna's Mealie account, so plans land in her household.
    - remoteRef:
        key: NANNY_OGG_MEALIE_TOKEN
      secretKey: MEALIE_API_TOKEN
    - remoteRef:
        key: NANNY_OGG_TOOLS_KEY
      secretKey: TOOLS_API_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    name: nanny-ogg-tools-secrets
