apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nanny-ogg
# Nanny Ogg: meal-planning assistant for the household, built like mended-drum
# (Open WebUI + an OpenAPI tool server) but with no database of its own --
# Mealie is the source of truth for recipes and the meal plan.
resources:
  - open-webui/
  - tools/
  - backup/
