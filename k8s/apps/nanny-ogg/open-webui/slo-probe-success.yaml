apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: nanny-ogg-probe-success
spec:
  # Same shape and target as mended-drum, which runs the same Open WebUI image:
  # there is no history for this host yet. Revisit once a 7d window exists.
  description: >-
    Fraction of successful blackbox probes against nanny-ogg.krupa.net.pl.
  alerting:
    name: NannyOggProbeBudgetBurn
    absentName: NannyOggProbeMetricAbsent
    severities:
      fastBurn: critical
      mediumBurn: critical
      slowBurn: warning
      longTermBurn: warning
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://nanny\\-ogg\\.krupa\\.net\\.pl(/.*)?"}
  # 97: the fast tier needs 6m18s of failed probes, so one restart or image pull passes.
  target: "97"
  window: 7d
