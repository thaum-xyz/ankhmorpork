prometheusUrl: http://prometheus-k8s:9090
prometheusExternalUrl: https://prometheus.ankhmorpork.thaum.xyz

# Homer selects on Ingresses only (ingressSelector in the Dashboard CR), so
# labelling every chart resource is harmless and keeps this out of a patch.
additionalLabels:
  homer.rajsingh.info/enabled: "true"

ingress:
  enabled: true
  className: public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Deliberately not probed, and so carries no ingress.thaum.xyz/probe-uri.
    # It used to carry /-/healthy copied from its Prometheus neighbours, which
    # pyrra 404s -- inert anyway, since the label that selects it was never
    # added. There is nothing honest to point a probe at: / is a 1.1KB React
    # shell that returns 200 with the backend dead (#1308), /metrics only says
    # the process is alive, and the real API is Connect RPC, which 405s on the
    # GET that blackbox's single http_2xx module makes. Probing it would need a
    # POST module built for this one console. #1340.
    item.homer.rajsingh.info/name: "Pyrra"
    item.homer.rajsingh.info/logo: "https://avatars.githubusercontent.com/u/87393422?s=200&v=4"
    item.homer.rajsingh.info/order: "30"
    service.homer.rajsingh.info/name: "Administration"
    service.homer.rajsingh.info/icon: "fa fa-user-shield"
    service.homer.rajsingh.info/order: "10"
  hosts:
    - host: pyrra.ankhmorpork.thaum.xyz
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pyrra-api-tls
      hosts:
        - pyrra.ankhmorpork.thaum.xyz

resources:
  requests:
    cpu: 100m
    memory: 30Mi
operator:
  resources:
    requests:
      cpu: 100m
      memory: 30Mi

serviceMonitor:
  enabled: true
serviceMonitorOperator:
  enabled: true
prometheusRule:
  enabled: true

dashboards:
  enabled: true
  annotations:
    grafana_folder: pyrra
