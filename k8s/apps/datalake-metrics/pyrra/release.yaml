apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pyrra
spec:
  chart:
    spec:
      chart: pyrra
      version: "1.13.0"
      sourceRef:
        kind: HelmRepository
        name: pyrra
      interval: 5m
  interval: 5m
  timeout: 10m
  install:
    timeout: 10m
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: pyrra-values
