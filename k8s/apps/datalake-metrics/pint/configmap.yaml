apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: linter
    app.kubernetes.io/name: pint
  name: pint-config
data:
  # Distinct from the repo's .pint.hcl, which is CI-shaped: its parser.include is
  # hard-wired to tmp/rules and it declares no prometheus server, so none of the
  # online checks can run there. This config exists to run exactly those.
  pint.hcl: |
    prometheus "k8s" {
      uri         = "http://prometheus-k8s:9090"
      timeout     = "1m"
      concurrency = 4
    }

    # Remote write is not configured, so prometheus_remote_storage_* has no
    # series and promql/series reports these three as bugs. They are kept
    # deliberately -- they become correct the moment remote write is turned on,
    # which is the likely path if Thanos comes back -- so the check is scoped
    # off them rather than the rules being deleted. Verified against pint
    # 0.87.0: without this block the three report 5 problems, with it, none.
    rule {
      match {
        name = "PrometheusRemoteStorageFailures|PrometheusRemoteWriteBehind|PrometheusRemoteWriteDesiredShards"
      }
      disable = ["promql/series"]
    }

    # Watchdog is supposed to always fire -- that is the whole point of a
    # dead-man's switch, and Alertmanager's watchdog receiver is built on it
    # firing continuously. alerts/comparison is right in general and wrong here.
    rule {
      match {
        name = "Watchdog"
      }
      disable = ["alerts/comparison"]
    }

    # promql/fragile objects to topk returning a different set on each
    # evaluation, which is a fair criticism of the upstream mixin query. There
    # are no ResourceQuotas on this cluster for it to select from, and it is not
    # ours to rewrite, so scope the check off rather than carry a fork.
    #
    # All three KubeQuota* rules, not the one pint happens to name. They share
    # the same topk expression and pint deduplicates identical problems, so it
    # reports one and hides the others behind it. Scoping the visible name lets
    # the next duplicate step forward and the count does not move -- the same
    # dynamic that made --max-problems=50 hide two dozen fixes in #1271.
    # Demonstrated twice while writing this: scoping AlmostFull surfaced
    # FullyUsed, and scoping both surfaced Exceeded. Match the family.
    rule {
      match {
        name = "KubeQuota.+"
      }
      disable = ["promql/fragile"]
    }

    # smartctl-exporter declares smartctl_device_percentage_used,
    # _available_spare, _available_spare_threshold and _critical_warning as
    # counters in its metadata. They are gauges -- a wear level does not
    # monotonically accumulate in the way rate() assumes -- so reading them
    # directly is correct and promql/counter is reacting to the exporter's
    # mislabelling, not to these rules. The fix belongs upstream in the
    # exporter.
    rule {
      match {
        name = "SmartCTLDevice.+"
      }
      disable = ["promql/counter"]
    }

    # ---- Accepted promql/series findings -------------------------------
    #
    # Everything below is a rule that works, reported because the series it
    # selects is not present *right now*. They are permanent findings, and the
    # PintRuleProblems alert fires on pint_problems > 0, so left alone they keep
    # issue #1237 open forever and train everyone to ignore it.
    #
    # Two things to know before adding to this list.
    #
    # pint's config file cannot disable a check for a single metric --
    # `promql/series(kubelet_evictions)` is rejected with "unknown check name";
    # that syntax only works as a comment inside the rule file, which is not an
    # option for chart-generated rules. So every entry here disables
    # promql/series for the whole rule, and a later rename or typo in any metric
    # that rule reads goes unnoticed.
    #
    # That is why only two of pint's four wordings are accepted here: "has the
    # metric ... but there are no series matching {label=value}" and "only
    # sometimes present". In both the metric itself exists, so a typo would
    # produce the *other* wording -- "didn't have any series for" -- against a
    # rule that is not on this list, and still be caught. Findings of that third
    # kind are deliberately left reported. One of them turned out to be a dead
    # alert.

    # The label value only exists when something is wrong: status="429",
    # key="node.kubernetes.io/unreachable", access_mode="ReadOnlyMany",
    # result="error", reason="OOMKilled", type="task-failed". Each metric is
    # present and each alert is correct; there is simply nothing wrong yet.
    #
    # KubePersistentVolume.*FillingUp, not KubePersistentVolumeFillingUp: the
    # Inodes variant carries the same `unless ... access_mode="ReadOnlyMany"`
    # clause, and all four rules in kubernetes-storage (warning and critical of
    # each) share it. pint deduplicates identical problems and shows one, so
    # matching the name it happened to print just promotes the next. Verified by
    # doing exactly that -- scoping the visible name surfaced
    # KubePersistentVolumeInodesFillingUp on the next run. KubePersistentVolumeErrors
    # does not use the clause and stays checked.
    rule {
      match {
        name = "CertManagerHittingRateLimits|KubeNodeUnreachable|KubePersistentVolume.*FillingUp|KubeStateMetricsWatchErrors|MultipleContainersOOMKilled|TaskFailureRatioTooHigh"
      }
      disable = ["promql/series"]
    }

    # Pyrra ratio SLOs that have had no errors yet. sum(rate(...{code=~"5.."}))
    # over an empty selector returns no series rather than zero, so the
    # numerator is empty, the division is empty, and the burnrate record records
    # nothing. Each clears itself the first time the thing it measures fails.
    # SLOMetricAbsent already covers the input metric disappearing.
    #
    # `burnrate.+`, not the one window pint happened to name. Pyrra generates
    # seven windows per SLO -- 5m, 30m, 1h, 2h, 6h, 1d, 4d for these three --
    # all with the same empty numerator, so they are duplicates of each other
    # and pint shows one. Matching that one just promotes the next window.
    # apiserver_request:burnrate.+ is deliberately absent: the read SLO does
    # produce series, so a break there should still be reported.
    rule {
      match {
        name = "KubeAPIServerWriteErrorBudgetBurn|prometheus_http_requests:burnrate.+|prometheus_operator_kubernetes_client_http_requests:burnrate.+|prometheus_sd_kubernetes_http_request:burnrate.+"
      }
      disable = ["promql/series"]
    }

    # Union branches for pod owners this cluster does not have: owner_kind="Node"
    # is static pods, owner_kind="" is ownerless ReplicaSets. The rule produces
    # 225 series from DaemonSet, ReplicaSet, StatefulSet and Job owners. Only
    # promql/series is scoped off -- the promql/impossible finding about the
    # redundant owner_kind join stays visible, because that one is upstream
    # style rather than a property of this cluster.
    rule {
      match {
        name = "namespace_workload_pod:kube_pod_owner:relabel"
      }
      disable = ["promql/series"]
    }

    # Metrics that exist only while their condition holds, so pint sees them
    # come and go: kube_job_failed (1d15h average life span),
    # kube_pod_container_status_waiting_reason (6m55s),
    # alertmanager_notifications_failed_total (3d17h), the *arr health metrics
    # (3d17h-6h), and gotk_resource_info{ready=~"False|Unknown"} (5m), which is
    # the healthy case for Flux.
    #
    # Every rule reading each of those metrics is listed, not just the one pint
    # named. Three were found only by asking which other rules read the same
    # metric, and the first of them had already stepped forward:
    #   kube_pod_container_status_waiting_reason  KubePodCrashLooping,
    #                                             KubeContainerWaiting
    #   alertmanager_notifications_failed_total   AlertmanagerClusterFailedToSendAlerts,
    #                                             AlertmanagerFailedToSendAlerts
    #   the prowlarr pair                         prowlarrUnhealthy reads
    #                                             prowlarr_system_health_issues,
    #                                             prowlarrIndexersUnavailable reads
    #                                             prowlarr_indexer_unavailable
    #   kube_job_failed                           KubeJobFailed, K8upJobFailed
    #
    # K8upJobFailed joined this list by being rewritten, not by being missed:
    # #1291 moved it off kube_job_labels -- which has no series at all, and is
    # why it could never fire -- onto kube_job_failed and kube_job_owner. It now
    # reports the same "only sometimes present" wording as KubeJobFailed, for
    # the same reason: the metric exists only while a failed Job does, with an
    # average life span of 1d15h. Re-check co-readers after a rule is rewritten,
    # not just after one is accepted.
    rule {
      match {
        name = "AlertmanagerClusterFailedToSendAlerts|AlertmanagerFailedToSendAlerts|FluxCDReconciliationFailure|K8upJobFailed|KubeContainerWaiting|KubeJobFailed|KubePodCrashLooping|prowlarrIndexersUnavailable|prowlarrUnhealthy|radarrUnhealthy|sonarrUnhealthy"
      }
      disable = ["promql/series"]
    }

    checks {
      disabled = [
        # 48 findings, 41 of them namespace=~".*" inside the chart's own mixin
        # rules. Not ours to fix without forking, so it would be permanent noise.
        "promql/regexp",
        # Annotation templating is CI's job; here it would drown the online checks.
        "alerts/template",
        # Strips comparison operators to estimate firing frequency, which breaks
        # vector matching on the kube-state-metrics join rules and errors instead
        # of reporting. Also the most expensive check -- it queries per alert.
        "alerts/count",
      ]
    }
