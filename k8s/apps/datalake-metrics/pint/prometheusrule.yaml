apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: linter
    app.kubernetes.io/name: pint
  name: pint
spec:
  groups:
    - name: pint.rules
      rules:
        # Fires when pint starts reporting something it was not reporting
        # before, not when the count is non-zero.
        #
        # The old shape was max(pint_problems) > 0 for 1h. The count has a floor
        # -- rules that work, reported because the series they select is not
        # present right now, like an alert waiting on a label value that only
        # appears when something breaks -- so it was permanently true, held one
        # github issue open forever, and taught everyone to skim it.
        #
        # The count is also the wrong signal even as a delta. Findings replace
        # each other: silencing one can promote a hidden duplicate, and pint
        # shows one problem per group. On 2026-09-06 the total fell 37 -> 15
        # while KubeContainerWaiting appeared underneath -- a delta alert would
        # have seen the drop and said nothing. Comparing the *set* caught it.
        #
        # Aggregating to (name, reporter) is required, not tidiness. `problem`
        # embeds durations that change every run ("average life span of 6m55s"),
        # `filename` embeds the PrometheusRule's UID, and the scrape adds pod
        # and instance -- so a pint rollout alone would mark every finding new.
        #
        # `for` is an hour because a node reboot produces findings that last
        # less than one. pint reports a series as "only sometimes present"
        # when two things hold: its selector matches nothing at the moment
        # pint looks, and the series already has a gap somewhere in the last
        # week. A reboot leaves the gap, and the next one empties the selector
        # for as long as the pods it moved take to come back -- so each reboot
        # after the first reported whatever was restarting. On 2026-11-11
        # seven CNPG* rules, CeleryWorkerOffline, prowlarrDown and radarrDown
        # were reported for 8 to 19 minutes after beelink01 and master02
        # rebooted, and at `for: 15m` that reopened #1457. The longest a
        # healthy cordon-to-uncordon has measured is 25 minutes, and a finding
        # outlives its cause by up to one ten-minute lint.
        #
        # `for` must stay well under the offset. The baseline catches up two
        # hours after a finding appears, so a longer `for` would never fire --
        # and that is also where this ends, an hour after it started.
        #
        # So resolving says nothing about the finding, which is still in
        # pint_problem. Nor does it close the issue this opened: github-receiver
        # runs with --auto-close-resolved-issues=false. Close the issue when the
        # finding is gone or accepted, not when the alert is.
        #
        # 24h is how far back the baseline looks, not how long this fires: a
        # finding that goes away and comes back within a day is not news again.
        #
        # If pint is down for more than 26h the baseline window is empty and
        # everything reads as new. PintNotReporting fires long before that.
        - alert: PintNewRuleProblem
          annotations:
            description: pint has started reporting {{ $labels.reporter }} against {{ $labels.name }}, which it was not reporting in the previous 24h. Either a rule changed, or the cluster changed underneath one.
            summary: pint found a problem it was not reporting before
          expr: |
            count by (name, reporter) (pint_problem{job="pint"})
            unless
            count by (name, reporter) (last_over_time(pint_problem{job="pint"}[24h] offset 2h))
          for: 1h
          labels:
            severity: warning
        # Zero problems and a dead linter look identical from the outside, so
        # alert on the absence of the signal itself. up{job="pint"} == 0 would be
        # silent in the case that matters most -- if the ServiceMonitor never
        # matches, the series does not exist and the comparison has nothing to
        # evaluate. The job label is pinned in the ServiceMonitor.
        - alert: PintNotReporting
          annotations:
            description: pint is not checking anything. Either it is absent or unscrapeable, or it is running but its last iteration checked zero rules; either way the loaded rules are unverified.
            summary: pint is not reporting
          expr: absent(pint_problems{job="pint"}) or max(pint_last_run_checks{job="pint"}) == 0
          for: 1h
          labels:
            severity: warning
