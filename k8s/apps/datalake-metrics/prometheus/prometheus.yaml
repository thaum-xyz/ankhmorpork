apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/instance: k8s
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kube-prometheus
  name: k8s
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - preference:
            matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64
          weight: 1
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: prometheus
                app.kubernetes.io/instance: k8s
                app.kubernetes.io/name: prometheus
                app.kubernetes.io/part-of: kube-prometheus
            topologyKey: kubernetes.io/hostname
          weight: 100
  alerting:
    alertmanagers:
      - apiVersion: v2
        name: alertmanager-main
        namespace: datalake-alerts
        port: web
  # A ServiceMonitor may not read a file off this pod. Without this, whoever
  # can write one -- every namespace's reconciler can, in its own namespace --
  # could set bearerTokenFile to the ServiceAccount token path, point the
  # monitor at an endpoint of their own, and be sent prometheus-k8s's token,
  # which may list pods, services, endpoints, nodes and ingresses everywhere.
  #
  # The operator rejects a ServiceMonitor whose endpoint sets bearerTokenFile,
  # or caFile, certFile or keyFile under tlsConfig. It drops the whole object,
  # so the targets vanish rather than go down; the reason is a Warning event on
  # the ServiceMonitor. A credential goes in a Secret beside the monitor
  # instead, named by `authorization.credentials`, and a CA by `tlsConfig.ca`.
  #
  # Turned on once nothing depended on it: on 2026-11-10 none of the 46 live
  # ServiceMonitors set any of the four fields. The last to use them were the
  # kube-prometheus-stack control-plane monitors (#1699) and blackbox-exporter
  # (#1707).
  arbitraryFSAccessThroughSMs:
    deny: true
  enableFeatures:
    - memory-snapshot-on-shutdown
  externalLabels:
    cluster: ankhmorpork
  externalUrl: https://prometheus.ankhmorpork.thaum.xyz
  nodeSelector:
    kubernetes.io/os: linux
  podMetadata:
    labels:
      app.kubernetes.io/component: prometheus
      app.kubernetes.io/instance: k8s
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/part-of: kube-prometheus
  podMonitorNamespaceSelector: {}
  podMonitorSelector: {}
  probeNamespaceSelector: {}
  probeSelector: {}
  replicas: 2
  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1800Mi
  # 63d costs ~109GB per replica: 1.15 B/sample at 17.0k samples/s is
  # 1.7 GB/day (prometheus_tsdb_* on 2026-11-15, lancre jobs included).
  # retentionSize is a guard rail at ~69 days' worth, so time is what bounds
  # the window. Re-measure after any large change in series count.
  retention: 63d
  retentionSize: 110GB
  ruleNamespaceSelector: {}
  ruleSelector: {}
  scrapeConfigNamespaceSelector: {}
  scrapeConfigSelector: {}
  serviceAccountName: prometheus-k8s
  serviceMonitorNamespaceSelector: {}
  serviceMonitorSelector: {}
  storage:
    volumeClaimTemplate:
      metadata:
        name: prometheus
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            # 25% over retentionSize: compaction writes a merged block before
            # dropping its sources, and max block duration is 10% of retention
            # (6.3d, ~10.7GB here). Thin-provisioned, so the unused part costs
            # nothing until written.
            storage: 140Gi
        storageClassName: lvm-thin
  # Image is derived from version; pinning both is how they drifted apart.
  # renovate: datasource=github-releases depName=prometheus/prometheus extractVersion=^v(?<version>.+)$
  version: 3.16.0
