apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: prometheus-query-errors
spec:
  # target from the 7d window 2026-09-03..09-10 (#1379): no 5xx at all over 1.6M
  # queries. The 95.0 it replaces was never grounded in anything.
  description: ""
  alerting:
    name: PrometheusQueryBudgetBurn
    absentName: PrometheusQueryMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    ratio:
      errors:
        metric: prometheus_http_requests_total{job="prometheus-k8s",handler=~"/api/v1/query.*",code=~"5.."}
      grouping:
        - handler
      total:
        metric: prometheus_http_requests_total{job="prometheus-k8s",handler=~"/api/v1/query.*"}
  target: "99.9"
  window: 7d