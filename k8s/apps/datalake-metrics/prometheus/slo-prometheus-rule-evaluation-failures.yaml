apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: prometheus-rule-evaluation-failures
spec:
  # target confirmed against the 7d window 2026-09-03..09-10 (#1379), not
  # changed: 99.99989% achieved over 30.0M evaluations, 1.1% of the budget.
  description: Rule and alerting rules are being evaluated every few seconds. This needs to work for recording rules to be created and most importantly for alerts to be evaluated.
  alerting:
    name: PrometheusRuleEvaluationBudgetBurn
    absentName: PrometheusRuleEvaluationMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    ratio:
      errors:
        metric: prometheus_rule_evaluation_failures_total{job="prometheus-k8s"}
      total:
        metric: prometheus_rule_evaluations_total{job="prometheus-k8s"}
  target: "99.99"
  window: 7d