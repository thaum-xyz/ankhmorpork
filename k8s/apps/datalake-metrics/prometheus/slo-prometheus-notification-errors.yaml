apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: prometheus-notification-errors
spec:
  # target from the 7d window 2026-09-03..09-10 (#1379): 99.99501% achieved
  # over 1.3M notifications, 5.0% of a 99.9% budget.
  description: ""
  alerting:
    name: PrometheusNotificationBudgetBurn
    absentName: PrometheusNotificationMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    ratio:
      errors:
        metric: prometheus_notifications_errors_total{job="prometheus-k8s"}
      total:
        metric: prometheus_notifications_sent_total{job="prometheus-k8s"}
  target: "99.9"
  window: 7d