apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    grafana_datasource: "1"
  name: prometheus-grafana-datasource
data:
  prometheus-datasource.yaml: |
    apiVersion: 1
    # The retired kube-prometheus grafana left a read-only Prometheus datasource
    # behind, pointing at the deleted monitoring namespace. Its provisioning file
    # is gone, so nothing reclaims it and the API refuses to delete it. Grafana
    # processes deletes before inserts, so this drops it and re-provisions below.
    deleteDatasources:
      - name: Prometheus
        orgId: 1
    datasources:
      - name: Prometheus
        type: prometheus
        orgId: 1
        uid: datalake-metrics
        url: http://prometheus-k8s.datalake-metrics.svc:9090
        access: proxy
        isDefault: true
