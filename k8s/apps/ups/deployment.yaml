apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: ups-modbus
  name: ups-modbus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: exporter
      app.kubernetes.io/name: ups-modbus
  template:
    metadata:
      labels:
        app.kubernetes.io/component: exporter
        app.kubernetes.io/name: ups-modbus
    spec:
      containers:
        - name: telegraf
          image: docker.io/library/telegraf:1.39.3-alpine
          args:
            - --config
            - /etc/telegraf/telegraf.conf
          ports:
            - containerPort: 9273
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/telegraf/telegraf.conf
              name: config
              subPath: telegraf.conf
            - mountPath: /tmp
              name: tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      volumes:
        - name: config
          configMap:
            name: telegraf
        - name: tmp
          emptyDir: {}
