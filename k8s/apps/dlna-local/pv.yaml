apiVersion: v1
kind: PersistentVolume
metadata:
  name: photos
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 6Ti
  nfs:
    path: /var/nfs/shared/Multimedia
    server: 192.168.40.10
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  volumeMode: Filesystem
