apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: ai-gateway-probe-success
spec:
  # The first availability signal this service has ever had: before #1337 all
  # 308 metric families in the namespace came from cadvisor, kube-state-metrics
  # or the CNPG database, and described the container and its Postgres rather
  # than whether the gateway answers.
  #
  # target is a PLACEHOLDER (#1379), not even carried over from the shared
  # objective -- ai-gateway was never in it. The probe started on 2026-09-07
  # 08:57 UTC, so its first full 7d window closes 2026-09-14 08:57 UTC.
  # Provisionally 99.904% over the first 3 days.
  description: >-
    Fraction of successful blackbox probes against ai-gateway.krupa.net.pl.
  alerting:
    name: AiGatewayProbeBudgetBurn
    absentName: AiGatewayProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      metric: probe_success{instance=~"https://ai-gateway\\.krupa\\.net\\.pl(/.*)?"}
  target: "95.0"
  window: 7d
