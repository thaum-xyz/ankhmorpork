apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  chart:
    spec:
      chart: litellm-helm
      sourceRef:
        kind: HelmRepository
        name: litellm
      version: "1.97.0"
      interval: 30m
  interval: 5m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: values-litellm
  # The litellm chart has no ingress.labels, and homer-operator selects
  # Ingresses by label.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Ingress
              name: litellm
            patch: |
              - op: add
                path: /metadata/labels/homer.rajsingh.info~1enabled
                value: "true"
