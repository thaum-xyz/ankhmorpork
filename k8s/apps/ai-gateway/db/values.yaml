database: litellm
owner: litellm

cluster:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  instances: 2
  storage:
    size: 2Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

backup:
  schedule: "0 30 23 * * *"
  objectStore:
    retentionPolicy: 30d
    pathSuffix: ai-gateway

externalSecrets:
  admin:
    remoteKey: AI_GATEWAY_DB_ADMIN_PASS
  user:
    remoteKey: AI_GATEWAY_DB_PASS
