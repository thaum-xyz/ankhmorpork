apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ankhmorpork
  namespace: plex
  annotations:
    kubernetes.io/description: >-
      The same repository flux-system's GitRepository points at, fetched again
      here because --no-cross-namespace-refs=true lets a Kustomization name a
      source only in its own namespace. A namespace that gains a Kustomization
      therefore gains one of these.

      It costs a poll rather than a credential: the repo is public, so unlike
      every other per-namespace source this needs no Secret. It does cost
      immediacy -- the github-receiver in flux-system cannot notify a source in
      another namespace, so this one only polls.
spec:
  interval: 60s
  ref:
    branch: master
  url: https://github.com/thaum-xyz/ankhmorpork
