apiVersion: v1
kind: Namespace
metadata:
  name: platform-cluster
  annotations:
    kubernetes.io/description: >-
      Node and cluster lifecycle: descheduler, node-feature-discovery,
      node-problem-detector, system-kured.

      Shared by several components, which is why the object lives here and not
      in any one of their directories. With one component per namespace the
      owner was obvious; with four it would be arbitrary, and the loser of that
      choice gets deleted out from under the other three the first time its
      Kustomization is pruned.
    # Never garbage-collect this Namespace. Pruning is inventory-based, so
    # dropping it from a Kustomization's inventory would delete the namespace
    # and everything inside it.
    kustomize.toolkit.fluxcd.io/prune: disabled
