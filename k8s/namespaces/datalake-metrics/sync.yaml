apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: datalake-metrics
  namespace: datalake-metrics
  annotations:
    kubernetes.io/description: >-
      Reconciles ./k8s/apps/datalake-metrics as datalake-metrics's own
      flux-reconciler, which the ClusterRoleBinding beside this file widens to
      cluster-admin; read that object to know what this one can reach.
      Platform-owned; what it reconciles is the tenant's.
spec:
  interval: 5m0s
  path: ./k8s/apps/datalake-metrics
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
