apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mended-drum
  namespace: mended-drum
  annotations:
    kubernetes.io/description: >-
      Reconciles ./k8s/apps/mended-drum as mended-drum's own flux-reconciler,
      which a RoleBinding confines to this namespace -- the object's namespace
      is what decides how much it may do. Platform-owned; what it reconciles is
      the tenant's.
spec:
  interval: 15m0s
  path: ./k8s/apps/mended-drum
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
