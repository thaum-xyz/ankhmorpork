apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: datalake-logs
  namespace: datalake-logs
  annotations:
    kubernetes.io/description: >-
      Reconciles this app as datalake-logs's own flux-reconciler, not flux-system's
      cluster-admin one: kustomize-controller resolves --default-service-account
      in the OBJECT's namespace, so where this object lives is what decides how
      much it may do.

      That ServiceAccount is bound with a RoleBinding, so this can apply
      anything namespaced in datalake-logs and nothing anywhere else. Repointing
      spec.path at another component would not widen it -- the apply is simply
      denied.

      It sits beside the Namespace and the GitRepository because all three are
      platform-owned, and that split is the review boundary: everything under
      k8s/apps/datalake-logs/ is the tenant's, everything here is not. sourceRef names
      the source in this namespace; --no-cross-namespace-refs=true forbids
      flux-system's.
spec:
  interval: 5m0s
  path: ./k8s/apps/datalake-logs
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
