apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless
  namespace: paperless
  annotations:
    kubernetes.io/description: >-
      Reconciles this app as paperless's own flux-reconciler, rather than a
      cluster-admin one. kustomize-controller resolves --default-service-account
      in the OBJECT's namespace, so where this object lives is what decides how
      much it may do.

      Unlike most apps, that identity is widened to cluster-admin by the
      ClusterRoleBinding beside this file, because what this Kustomization
      applies includes PersistentVolumes and those are cluster-scoped. Read that
      object to know what this one can reach.

      sourceRef names the source in this namespace; --no-cross-namespace-refs
      forbids flux-system's.
spec:
  interval: 60m0s
  path: ./k8s/apps/paperless/manifests
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
