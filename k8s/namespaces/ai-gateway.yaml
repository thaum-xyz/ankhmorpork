apiVersion: v1
kind: Namespace
metadata:
  name: ai-gateway
  annotations:
    # Never garbage-collect this Namespace. Pruning is inventory-based, so
    # dropping it from a Kustomization's inventory would delete the namespace
    # and everything inside it.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Generates the flux-reconciler ServiceAccount and a RoleBinding giving it
    # this ClusterRole here, via the generate-flux-reconciler GeneratingPolicy.
    # A RoleBinding, so Flux is confined to this namespace: everything the app
    # installs is namespaced. A chart that grows a cluster-scoped object will
    # fail to apply rather than quietly gaining the right to create one.
    flux.rbac.thaum.xyz/role: flux-tenant-reconciler
