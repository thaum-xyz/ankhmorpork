apiVersion: v1
kind: Namespace
metadata:
  name: vod-arr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    flux.rbac.thaum.xyz/role: cluster-admin
    # qbittorrent takes NET_ADMIN and hostPath for its VPN sidecar's tunnel
    # device.
    pod-security.kubernetes.io/enforce: privileged
