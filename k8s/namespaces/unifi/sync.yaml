apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unifi
  namespace: unifi
  annotations:
    kubernetes.io/description: >-
      Reconciles ./k8s/apps/unifi as unifi's own flux-reconciler, which a
      RoleBinding confines to this namespace -- the object's namespace is what
      decides how much it may do. Platform-owned; what it reconciles is the
      tenant's.
spec:
  interval: 120m0s
  path: ./k8s/apps/unifi
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
