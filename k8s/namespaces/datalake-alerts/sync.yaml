apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: datalake-alerts
  namespace: datalake-alerts
  annotations:
    kubernetes.io/description: >-
      Reconciles ./k8s/apps/datalake-alerts as datalake-alerts's own
      flux-reconciler, which a RoleBinding confines to this namespace -- the
      object's namespace is what decides how much it may do. Platform-owned;
      what it reconciles is the tenant's.
spec:
  interval: 5m0s
  path: ./k8s/apps/datalake-alerts
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
