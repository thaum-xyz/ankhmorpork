apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-reconciler-grafana
  annotations:
    kubernetes.io/description: >-
      cluster-admin, because this namespace reconciles the ClusterRole and
      ClusterRoleBinding the grafana chart installs, and no RoleBinding can
      confer a cluster-scoped object at any width of role. It widens the
      flux-reconciler that generate-flux-reconciler already binds here; rights
      are additive, so dropping this object narrows the namespace back to
      confined rather than to nothing. Narrowing it for good is
      thaum-xyz/ankhmorpork#1436.
subjects:
  - kind: ServiceAccount
    name: flux-reconciler
    namespace: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
