apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: karakeep
  namespace: karakeep
  annotations:
    kubernetes.io/description: >-
      Reconciles ./k8s/apps/karakeep as karakeep's own flux-reconciler, which a
      RoleBinding confines to this namespace -- the object's namespace is what
      decides how much it may do. Platform-owned; what it reconciles is the
      tenant's.
spec:
  interval: 60m0s
  path: ./k8s/apps/karakeep
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
