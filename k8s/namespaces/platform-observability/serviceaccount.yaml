apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-reconciler
  namespace: platform-observability
  annotations:
    kubernetes.io/description: >-
      The identity kustomize-controller impersonates for every Kustomization in
      this namespace, via --default-service-account. The SA is resolved in the
      Kustomization's OWN namespace, so it has to exist before a Kustomization is
      created here: without it the controller impersonates a name that holds
      nothing and every apply is denied, with no way for the Kustomization to
      create the SA that would fix it.
# NOT generated by generate-flux-reconciler, unlike every app namespace's. This
# identity is on the bootstrap path: the Kustomization that impersonates it is
# how Kyverno itself gets installed, directly or upstream of it. An SA generated
# by the policy engine that Flux installs cannot be the SA Flux needs in order
# to install that policy engine -- on a rebuild nothing would ever reconcile.
#
# So this file stays, and the namespace carries no flux.rbac.thaum.xyz/role
# label. Do not "finish the job" by deleting it.
#
# No token is mounted anywhere: impersonation goes through the API server, not
# through a mounted credential. automountServiceAccountToken is off so a Pod that
# names this SA cannot borrow its rights, and validate-reconciler-sa-usage denies
# such a Pod outright.
automountServiceAccountToken: false
