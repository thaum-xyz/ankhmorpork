apiVersion: v1
kind: Namespace
metadata:
  name: platform-observability
  annotations:
    kubernetes.io/description: >-
      Collectors and exporters only; the stores they feed have their own
      namespaces. Holds the components listed in
      k8s/platform/observability/kustomization.yaml.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # node-exporter needs hostNetwork and hostPID to report on the node rather
    # than its own pod, and alloy reads the host log directories.
    pod-security.kubernetes.io/enforce: privileged
