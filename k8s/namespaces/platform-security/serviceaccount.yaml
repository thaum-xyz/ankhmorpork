apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-reconciler
  namespace: platform-security
  annotations:
    kubernetes.io/description: >-
      The identity every Kustomization in this namespace impersonates through
      --default-service-account. It is resolved in the Kustomization's own
      namespace, so it has to exist before one is created here. A file rather
      than generate-flux-reconciler output because it is on the bootstrap path:
      the policy engine that would generate it is installed by a Kustomization
      impersonating it. No token is mounted; impersonation goes through the API
      server.
automountServiceAccountToken: false
