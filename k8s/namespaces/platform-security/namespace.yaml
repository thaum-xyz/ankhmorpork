apiVersion: v1
kind: Namespace
metadata:
  name: platform-security
  annotations:
    kubernetes.io/description: >-
      Admission control, certificates and secret delivery. Holds the components
      listed in k8s/platform/security/kustomization.yaml.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # the kubeconfig service reads the k3s server credentials off the host.
    pod-security.kubernetes.io/enforce: privileged
