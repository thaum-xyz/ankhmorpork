apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-reconciler-platform-storage
  annotations:
    kubernetes.io/description: >-
      cluster-admin, because this domain reconciles StorageClasses, CSIDrivers,
      admission policies and the ClusterRoles its drivers run under, and binding
      a ClusterRole at all needs escalate or bind, which no Role confined to the
      namespace can hold. One identity per domain rather than one for the whole
      platform: the rights are the same, the name in an audit log is not.
      Narrowing it is thaum-xyz/ankhmorpork#1436.
subjects:
  - kind: ServiceAccount
    name: flux-reconciler
    namespace: platform-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
