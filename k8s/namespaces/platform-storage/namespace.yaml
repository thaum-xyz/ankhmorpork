apiVersion: v1
kind: Namespace
metadata:
  name: platform-storage
  annotations:
    kubernetes.io/description: >-
      Volume provisioning and backup. Holds the components listed in
      k8s/platform/storage/kustomization.yaml.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # CSI drivers and the LINSTOR satellites mount host paths and run
    # privileged; this label is what lets them schedule at all.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
