apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ankhmorpork
  namespace: platform-storage
  annotations:
    kubernetes.io/description: >-
      Fetched once per namespace, because --no-cross-namespace-refs=true lets a
      Kustomization name a source only in its own namespace. A file here where
      an app's is generated by generate-flux-source, because this namespace is
      on the bootstrap path: the engine that would generate it is installed
      through a Kustomization reading a source like this one. Costs a poll and
      no credential: the repository is public, and a Receiver cannot notify a
      source in another namespace.
spec:
  interval: 60s
  ref:
    branch: master
  url: https://github.com/thaum-xyz/ankhmorpork
