apiVersion: v1
kind: Namespace
metadata:
  name: platform-observability
  annotations:
    kubernetes.io/description: >-
      Collectors and exporters only: alloy, kube-prometheus-stack, blackbox-exporter,
      uptimerobot. The stores they feed have their own namespaces -- datalake-metrics,
      datalake-logs, datalake-alerts, grafana.

      Shared by several components, which is why the object lives here and not in
      any one of their directories. It sat with prometheus-operator-crds because
      that component is first in the dependency graph, which made it the earliest
      owner rather than the right one.
    # Never garbage-collect this Namespace. Pruning is inventory-based, so
    # dropping it from a Kustomization's inventory would delete the namespace
    # and everything inside it.
    kustomize.toolkit.fluxcd.io/prune: disabled
