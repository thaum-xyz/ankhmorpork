apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: photos
  namespace: photos
  annotations:
    kubernetes.io/description: >-
      Reconciles ./k8s/apps/photos as photos's own flux-reconciler, which the
      ClusterRoleBinding beside this file widens to cluster-admin; read that
      object to know what this one can reach. Platform-owned; what it reconciles
      is the tenant's.
spec:
  interval: 15m0s
  path: ./k8s/apps/photos
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
