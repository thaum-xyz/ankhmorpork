apiVersion: v1
kind: Namespace
metadata:
  name: dlna-local
  annotations:
    # Never garbage-collect this Namespace. Pruning is inventory-based, so
    # dropping it from a Kustomization's inventory would delete the namespace
    # and everything inside it.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Generates the flux-reconciler ServiceAccount and a RoleBinding giving it
    # this ClusterRole here, via the generate-flux-reconciler GeneratingPolicy.
    #
    # `cluster-admin` names the RULES, not the reach. A RoleBinding confers only
    # the namespaced half of them and only inside this namespace, so this is
    # namespace-admin here and nothing at all anywhere else.
    flux.rbac.thaum.xyz/role: cluster-admin
    # Pod Security Admission, deliberately `privileged` rather than `baseline`:
    # minidlna needs hostNetwork: SSDP discovery is broadcast-based
    # and does not survive a pod network.
    #
    # Set explicitly even though it matches the cluster default, so that the
    # exemption is a reviewable line rather than an absence, and so nobody
    # tightens it without reading why.
    pod-security.kubernetes.io/enforce: privileged
