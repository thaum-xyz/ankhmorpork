apiVersion: v1
kind: Namespace
metadata:
  name: dlna-local
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    flux.rbac.thaum.xyz/role: cluster-admin
    # minidlna needs hostNetwork: SSDP discovery is broadcast-based and does not
    # survive a pod network.
    pod-security.kubernetes.io/enforce: privileged
