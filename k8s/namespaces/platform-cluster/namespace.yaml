apiVersion: v1
kind: Namespace
metadata:
  name: platform-cluster
  annotations:
    kubernetes.io/description: >-
      Node and cluster lifecycle. Holds the components listed in
      k8s/platform/cluster/kustomization.yaml.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # kured and node-problem-detector run privileged with hostPID to reboot and
    # inspect the node; nfd, the GPU plugin and the module signing labeler read
    # the host filesystem.
    pod-security.kubernetes.io/enforce: privileged
