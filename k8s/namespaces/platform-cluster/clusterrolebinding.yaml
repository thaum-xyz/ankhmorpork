apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-reconciler-platform-cluster
  annotations:
    kubernetes.io/description: >-
      cluster-admin, because this domain reconciles NodeFeatureRules,
      ClusterRoles and the flux2 release itself, and binding a ClusterRole at
      all needs escalate or bind, which no Role confined to the namespace can
      hold. One identity per domain rather than one for the whole platform: the
      rights are the same, the name in an audit log is not. Narrowing it is
      thaum-xyz/ankhmorpork#1436.
subjects:
  - kind: ServiceAccount
    name: flux-reconciler
    namespace: platform-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
