apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The only kustomization.yaml under k8s/namespaces/: k8s/bootstrap/ builds this
# directory by hand before any Kustomization exists, and kustomize needs one to
# reference a directory. No `namespace:` transformer -- two of these objects are
# cluster-scoped and the other two state their own.
resources:
  - namespace.yaml
  - gitrepository.yaml
  - serviceaccount.yaml
  - clusterrolebinding.yaml
