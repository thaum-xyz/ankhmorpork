apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homer-services
  namespace: homer
  annotations:
    kubernetes.io/description: >-
      Separate from the homer Kustomization because the HomerServices CRD
      arrives with the chart: Flux dry-runs every resource before applying any
      of them, so a CR beside the HelmRelease blocked the very install that
      would have registered its kind.

      Reconciles ./k8s/apps/homer/services as homer's own flux-reconciler, which
      the ClusterRoleBinding beside this file widens to cluster-admin; read that
      object to know what this one can reach. Platform-owned; what it reconciles
      is the tenant's.
spec:
  interval: 15m0s
  path: ./k8s/apps/homer/services
  prune: true
  dependsOn:
    - name: homer
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
