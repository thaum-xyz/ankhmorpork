apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: atuin
  namespace: atuin
  annotations:
    kubernetes.io/description: >-
      Reconciles ./k8s/apps/atuin as atuin's own flux-reconciler, which a
      RoleBinding confines to this namespace -- the object's namespace is what
      decides how much it may do. Platform-owned; what it reconciles is the
      tenant's.
spec:
  interval: 15m0s
  path: ./k8s/apps/atuin
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
