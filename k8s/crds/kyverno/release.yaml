apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-api
  annotations:
    kubernetes.io/description: >-
      The eleven policies.kyverno.io CRDs, which is every kyverno kind this repo
      actually declares: the ValidatingPolicy, MutatingPolicy, GeneratingPolicy
      and DeletingPolicy objects under k8s/platform/security/kyverno/policies
      and k8s/platform/storage/.

      They are here rather than in the kyverno release because those objects
      live in two domains, and neither can declare that it waits for a chart
      installed by the other -- --no-cross-namespace-refs allows a dependsOn
      only within a namespace. Nothing makes that ordering certain; what this
      changes is what a cold start retries against, a CRD-only release with no
      dependencies of its own rather than the whole kyverno stack.

      Version is not Renovate's to move on its own, and renovate.json disables
      it by name: this chart is the kyverno chart's own dependency, and CRDs
      that outrun the controllers serving them fail quietly. Bump it with the
      kyverno chart; `make validate-kyverno-crd-pin` fails when the two
      diverge.
spec:
  chart:
    spec:
      chart: kyverno-api
      version: "0.0.1-alpha.4"
      sourceRef:
        kind: HelmRepository
        name: kyverno-api
      interval: 5m
  interval: 5m
  timeout: 10m
  # No `crds:` policy on either action: the chart ships its CRDs as ordinary
  # templates rather than in a crds/ directory, so Helm upgrades them like any
  # other object and Flux's CRD policy has nothing to act on.
  install:
    timeout: 10m
    # Adoption stays on, which is Helm 4's default under helm-controller. The
    # eleven CRDs already exist, owned by the kyverno release until this one
    # installs, and adoption is what moves them: ownership annotations
    # rewritten, specs unchanged, no hand step. A reinstall after a failed one
    # picks them up the same way.
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    # Once owned, never re-adopted. If another release ever renders one of these
    # CRDs, this upgrade fails loudly instead of trading ownership back and
    # forth; the kyverno release carries the same guard on both actions.
    disableTakeOwnership: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: values-kyverno-api
