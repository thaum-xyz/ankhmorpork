apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno-api
  annotations:
    kubernetes.io/description: >-
      Upstream's separate repository for the kyverno API chart, which is not the
      one the kyverno chart itself comes from -- that is
      https://kyverno.github.io/kyverno/, in platform-security beside the
      release. Two URLs, two objects, no name to collide over.
spec:
  interval: 5m
  url: https://kyverno.github.io/api
