apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: thaum-charts-crds
  annotations:
    kubernetes.io/description: >-
      The registry every cnpg-database consumer names thaum-charts, under a name
      only this layer uses: the crds Kustomization applies into
      platform-security beside that domain's own Kustomization, and two
      Kustomizations applying one object would each reclaim the ownership
      labels from the other on every reconcile.
spec:
  type: oci
  interval: 5m
  url: oci://ghcr.io/thaum-xyz/helm-charts
