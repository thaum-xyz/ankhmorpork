apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# platform-security, matching where the kyverno controllers run: a HelmRelease
# has to render somewhere, and a release whose content is kyverno's CRDs
# belongs next to kyverno rather than in a namespace of its own.
namespace: platform-security
resources:
  - repository.yaml
  - release.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: values-kyverno-api
    files:
      - values.yaml=values.yaml
