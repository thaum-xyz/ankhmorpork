apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-reconciler
  namespace: node-problem-detector
  annotations:
    kubernetes.io/description: >-
      The identity helm-controller and kustomize-controller impersonate for Flux
      objects in this namespace that do not set spec.serviceAccountName. Bound to cluster-admin: this namespace's Helm release owns cluster-scoped objects, which no RoleBinding can grant.
# Impersonation goes through the API server, never a mounted credential, so no
# Pod needs this token -- and validate-reconciler-sa-usage denies any Pod that
# names this ServiceAccount.
automountServiceAccountToken: false
