apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-luggage
spec:
  # Keeps a workload's images pulled on every node it may run on, so a drain
  # reschedules it without a cold pull. One DaemonSet per workload, in
  # platform-cluster: a pause container that mounts each of the workload's
  # images as a read-only image volume. Nothing in those images runs.
  #
  # Opt in one workload at a time, on the Deployment's or StatefulSet's own
  # metadata (not the Pod template):
  #
  #   labels:
  #     luggage.thaum.xyz/carry: "true"
  #
  # Every node pulls every carried image, and on disk an image costs several
  # times its compressed size. On 2026-11-12 opting in whole namespaces put
  # master01 under DiskPressure, so carry only workloads whose cold pull hurts.
  evaluation:
    generateExisting:
      enabled: true
    # Re-renders the DaemonSet when the workload changes, so a Renovate bump is
    # pulled on every node while the app rolls out.
    synchronize:
      enabled: true
    orphanDownstreamOnPolicyDelete:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
  matchConditions:
    # A condition, not an objectSelector, so an update that drops the label
    # still reaches the policy and synchronize can delete the DaemonSet.
    - name: opted-in
      expression: object.metadata.?labels["luggage.thaum.xyz/carry"].orValue("") == "true"
    # Pull secrets live in the app's namespace and cannot follow it here.
    - name: public-images-only
      expression: object.spec.template.spec.?imagePullSecrets.orValue([]).size() == 0
  variables:
    - name: pod
      expression: object.spec.template.spec
    - name: instance
      expression: object.metadata.namespace + "-" + object.metadata.name
    - name: images
      expression: >-
        variables.pod.?initContainers.orValue([]).map(c, {"name": "init-" + c.name, "image": c.image})
        + variables.pod.containers.map(c, {"name": "app-" + c.name, "image": c.image})
    - name: labels
      expression: >-
        {"app.kubernetes.io/name": "luggage", "app.kubernetes.io/instance": variables.instance}
  generate:
    - expression: >-
        generator.Apply("platform-cluster", [
          {
            "apiVersion": "apps/v1",
            "kind": "DaemonSet",
            "metadata": {
              "name": "luggage-" + variables.instance,
              "namespace": "platform-cluster",
              "labels": variables.labels,
              "annotations": {
                "kubernetes.io/description":
                  "Generated by the generate-luggage GeneratingPolicy from "
                  + object.kind + " " + object.metadata.namespace + "/" + object.metadata.name
                  + ". Keeps its images pulled on every node it may run on."
              }
            },
            "spec": {
              "selector": {"matchLabels": variables.labels},
              "template": {
                "metadata": {"labels": variables.labels},
                "spec": {
                  "automountServiceAccountToken": false,
                  "enableServiceLinks": false,
                  "terminationGracePeriodSeconds": 0,
                  "nodeSelector": variables.pod.?nodeSelector.orValue({}),
                  "affinity": {"nodeAffinity": variables.pod.?affinity.?nodeAffinity.orValue({})},
                  "tolerations": variables.pod.?tolerations.orValue([]),
                  "securityContext": {
                    "runAsNonRoot": true,
                    "runAsUser": 65535,
                    "runAsGroup": 65535,
                    "seccompProfile": {"type": "RuntimeDefault"}
                  },
                  "containers": [{
                    "name": "pause",
                    "image": "docker.io/rancher/mirrored-pause:3.10.2",
                    "resources": {
                      "requests": {"cpu": "1m", "memory": "8Mi"},
                      "limits": {"memory": "16Mi"}
                    },
                    "securityContext": {
                      "allowPrivilegeEscalation": false,
                      "readOnlyRootFilesystem": true,
                      "capabilities": {"drop": ["ALL"]}
                    },
                    "volumeMounts": variables.images.map(i,
                      {"name": i.name, "mountPath": "/luggage/" + i.name, "readOnly": true})
                  }],
                  "volumes": variables.images.map(i,
                    {"name": i.name, "image": {"reference": i.image, "pullPolicy": "IfNotPresent"}})
                }
              }
            }
          }
        ])
