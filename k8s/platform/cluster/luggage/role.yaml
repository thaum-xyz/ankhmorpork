apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: luggage-generator
  annotations:
    kubernetes.io/description: >-
      What generate-luggage needs to write its DaemonSets. Namespaced, so the
      background controller can write DaemonSets here and nowhere else; that
      still covers every DaemonSet in platform-cluster, kured's included.
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
