---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ephemeral-storage-metrics
spec:
  chart:
    spec:
      chart: k8s-ephemeral-storage-metrics
      version: "1.21.3"
      sourceRef:
        kind: HelmRepository
        name: ephemeral-storage-metrics
        namespace: platform-cluster
      interval: 5m
  interval: 5m
  timeout: 20m
  install:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: values-ephemeral-storage-metrics
