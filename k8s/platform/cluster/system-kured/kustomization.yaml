apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-cluster
resources:
  - repository.yaml
  - release.yaml
  - prometheus-rules.yaml
configMapGenerator:
  - name: values-kured
    files:
      - values.yaml=values.yaml
# Stable name; see docs/explanation/helm-values.md.
generatorOptions:
  disableNameSuffixHash: true
