apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  annotations:
    kubernetes.io/description: >-
      What is left of Flux's original home. The controllers run in
      platform-cluster; this holds the GitRepository and flux-reconciler that
      every app Kustomization still resolves, and the app Kustomizations
      themselves. It goes when they do.
    # Never garbage-collect this Namespace. Pruning is inventory-based, and
    # deleting a Namespace takes everything inside it: every app Kustomization,
    # the GitRepository they read and the identity they apply as. Nothing would
    # be left able to put them back.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
