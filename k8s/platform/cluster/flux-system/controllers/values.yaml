# Reference documentation: https://github.com/fluxcd-community/helm-charts/tree/main/charts/flux2

# All 11 Flux CRDs are templates of this chart and carry its ownership metadata,
# so `helm uninstall flux2` deletes them -- and deleting a CRD deletes every
# custom resource of that kind. That is every Kustomization, HelmRelease,
# GitRepository, HelmRepository, Receiver and Alert in the cluster: 53
# Kustomizations and 31 HelmReleases as this was written.
#
# Worse than the count. Deleting a HelmRelease is what makes helm-controller
# uninstall the release behind it, so a teardown racing a still-running
# controller can take real workloads with it -- postgres, traefik, cilium -- on
# its way out.
#
# `keep` makes Helm leave the CRDs alone, which leaves every CR alone with them.
# The chart documents this annotation as the reason crds.annotations exists.
#
# This is what makes moving the controllers out of flux-system survivable at
# all: that move is an uninstall and a reinstall, because Flux cannot relocate
# its own release. Do not remove this to tidy up.
crds:
  annotations:
    helm.sh/resource-policy: keep

helmController:
  # Confine a HelmRelease to chart sources and dependsOn targets in its own
  # namespace. Verified inert: no HelmRelease references either across one.
  #
  # --default-service-account is deliberately absent. The SA is resolved in each
  # HelmRelease's OWN namespace, and only the platform-<domain> namespaces hold a
  # flux-reconciler; setting the flag now would strand every HelmRelease in an app
  # namespace on an identity that does not exist. It goes on once they all do.
  #
  # Note what that means today: the Kustomization that applies a HelmRelease
  # impersonates its namespace's reconciler, but the release helm-controller then
  # installs is applied as the controller's own cluster-admin. Moving the
  # Kustomizations narrowed the first path, not the second.
  container:
    additionalArgs:
      - --no-cross-namespace-refs=true
  priorityClassName: system-cluster-critical
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists

kustomizeController:
  # Flux's multi-tenancy lockdown, minus the one flag that does not apply here.
  # https://fluxcd.io/flux/installation/configuration/multitenancy/
  #
  # --default-service-account: impersonate flux-system's flux-reconciler for
  #   every Kustomization that does not set spec.serviceAccountName, rather
  #   than applying as the controller's own cluster-admin identity. The SA is
  #   resolved in each Kustomization's OWN namespace, so what it selects depends
  #   on where the Kustomization lives. The five platform-<domain> Kustomizations
  #   each resolve it to the SA in their own namespace; everything still in
  #   flux-system -- the umbrellas and every app -- resolves it to reconciler/,
  #   which is cluster-admin. Each app Kustomization that moves into its own
  #   namespace narrows itself the same way the platform domains already did.
  #
  #   Upstream uses `default` here. A named SA instead, because `default` is
  #   what a Pod gets when it names none: granting it reconcile rights would
  #   hand namespace-admin, token already mounted, to every such Pod -- 30 of
  #   them across 15 namespaces when this was measured. See reconciler/.
  #
  # --no-cross-namespace-refs: a Flux object may only reference sources,
  #   dependsOn targets and notification providers in its own namespace. Each
  #   namespace that gains a Kustomization therefore gains its own
  #   GitRepository -- which is already how every HelmRelease here works, and
  #   costs nothing extra since the repo is public and needs no credential.
  #
  # --no-remote-bases: a kustomization.yaml may not pull a base from a URL, so
  #   only what the Flux source carries can reach the cluster.
  #
  # Both of the latter were verified to break nothing before being set: zero
  # cross-namespace sourceRefs, zero cross-namespace dependsOn, and no remote
  # bases anywhere in k8s/.
  #
  # Set through additionalArgs rather than the chart's `multitenancy.enabled`,
  # which would be the natural switch for all three. It also puts
  # --default-service-account on helm-controller, where it is NOT inert: that
  # SA is resolved in each HelmRelease's own namespace, and the 48 HelmReleases
  # are spread over 31 namespaces, none of which has the SA yet. Switch to it
  # once they do.
  container:
    additionalArgs:
      - --default-service-account=flux-reconciler
      - --no-cross-namespace-refs=true
      - --no-remote-bases=true
  priorityClassName: system-cluster-critical
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists

sourceController:
  priorityClassName: system-cluster-critical
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists

notificationController:
  # An Alert may only reference a Provider in its own namespace, and a Receiver
  # only resources in its own. No notification object exists here at all now, so
  # this is inert, and it stops a tenant subscribing to another namespace's
  # events later.
  container:
    additionalArgs:
      - --no-cross-namespace-refs=true
  # No webhookReceiver, which is why flux.thaum.xyz is gone. It served one
  # Receiver, pointed at the one GitRepository in flux-system -- and a Receiver
  # may only name resources in its OWN namespace. Each platform-<domain> gets its
  # own GitRepository when its Kustomization moves there, so the webhook would
  # have covered one source out of six; making it cover all of them means a
  # Receiver, a GitHub webhook and a token per namespace. What that buys is the
  # difference between an immediate reconcile and the 60s poll every
  # GitRepository already does, which is not worth five copies of a credential.

imageAutomationController:
  create: false

imageReflectionController:
  create: false

prometheus:
  podMonitor:
    create: true
