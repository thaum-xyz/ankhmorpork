apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The controllers themselves move; what stays in flux-system is in additional/
# and reconciler/, kept there by references that are namespace-local.
namespace: platform-cluster
resources:
  - repository.yaml
  - release.yaml
  - prometheusRules.yaml
  - certManagerPolicy.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: values-flux2
    files:
      - values.yaml=values.yaml
