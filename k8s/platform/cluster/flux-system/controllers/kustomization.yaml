apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - repository.yaml
  - release.yaml
  - prometheusRules.yaml
  - certManagerPolicy.yaml
  - githubToken.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: values-flux2
    files:
      - values.yaml=values.yaml
