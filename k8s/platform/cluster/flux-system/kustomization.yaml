apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Deliberately no namespace here. This component spans two: the controllers now
# run in platform-cluster, while the namespace object and the reconciler identity
# the Kustomizations impersonate stay in flux-system. A namespace at this level
# would flatten that back and silently drag the controllers along with it. Each
# subdirectory states its own.
resources:
  - namespace.yaml
  - controllers/
  - reconciler/
