apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-reconciler
  annotations:
    # Never prune this. Without it the ServiceAccount beside it holds nothing,
    # so every app Kustomization applies as an identity with no rights -- the
    # same deadlock, one object along.
    kustomize.toolkit.fluxcd.io/prune: disabled
    kubernetes.io/description: >-
      cluster-admin, deliberately: this SA reconciles flux-system, which holds
      the umbrellas, the CRD and namespace layers, and every app Kustomization.
      Narrowing it would not bound anything -- flux-system is the control plane,
      not a tenant.

      The platform no longer reconciles through it. Each platform-<domain>
      Kustomization lives in its own namespace with its own flux-reconciler, so
      what is left here is the layer above them plus the apps. The boundary keeps
      appearing one namespace at a time, as each app's Kustomization moves into
      its own with an SA scoped to that app.
subjects:
  - kind: ServiceAccount
    name: flux-reconciler
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
