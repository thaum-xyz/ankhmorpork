apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-flux-reconciler
spec:
  # What a Kustomization needs before it can run in a namespace, from one label:
  #
  #   labels:
  #     flux.rbac.thaum.xyz/role: cluster-admin
  #
  # the `flux-reconciler` ServiceAccount kustomize-controller and helm-controller
  # impersonate there, a RoleBinding giving it that ClusterRole, and the
  # GitRepository its Kustomizations read. What the label means, why the binding
  # is a RoleBinding and never a ClusterRoleBinding, and why the platform-<domain>
  # namespaces carry no label and keep theirs as files:
  # docs/reference/annotations.md, under flux.rbac.thaum.xyz/role.
  evaluation:
    # Labelled namespaces that already exist are processed too. An object that
    # already exists and is not this policy's is left alone, not adopted: delete
    # it, and the next Namespace event recreates it as the policy's own.
    generateExisting:
      enabled: true
    # Recreates any of the three if deleted, and removes all of them when the
    # label goes.
    synchronize:
      enabled: true
    # Deleting or renaming this policy leaves its objects in place, so nothing
    # stops reconciling; a successor policy takes each over once it is deleted
    # and regenerated. Removing the label still removes the objects.
    orphanDownstreamOnPolicyDelete:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    # Only a cluster-admin can label a Namespace, so a tenant cannot widen their
    # own reconciler.
    - name: has-a-reconciler-label
      expression: >-
        object.metadata.?labels.orValue({}).exists(k, k == "flux.rbac.thaum.xyz/role")
  variables:
    - name: role
      expression: object.metadata.labels["flux.rbac.thaum.xyz/role"]
  generate:
    # `expression` rather than `template` because generator.Apply takes the
    # target namespace and the resources, and must evaluate to a bool.
    - expression: >-
        generator.Apply(object.metadata.name, [
          {
            "apiVersion": "v1",
            "kind": "ServiceAccount",
            "metadata": {
              "name": "flux-reconciler",
              "namespace": object.metadata.name,
              "annotations": {
                "kubernetes.io/description":
                  "Generated by the generate-flux-reconciler GeneratingPolicy "
                  + "from the flux.rbac.thaum.xyz/role label on this namespace. "
                  + "Edit the label, not this object -- synchronize is on, so "
                  + "changes here are reverted. The identity Flux impersonates "
                  + "for objects in this namespace that do not set "
                  + "spec.serviceAccountName."
              }
            },
            "automountServiceAccountToken": false
          },
          {
            "apiVersion": "rbac.authorization.k8s.io/v1",
            "kind": "RoleBinding",
            "metadata": {
              "name": "flux-reconciler",
              "namespace": object.metadata.name,
              "annotations": {
                "kubernetes.io/description":
                  "Generated from the flux.rbac.thaum.xyz/role label on this "
                  + "namespace. A RoleBinding, so it confers "
                  + variables.role + " only inside " + object.metadata.name + "."
              }
            },
            "subjects": [{
              "kind": "ServiceAccount",
              "name": "flux-reconciler",
              "namespace": object.metadata.name
            }],
            "roleRef": {
              "apiGroup": "rbac.authorization.k8s.io",
              "kind": "ClusterRole",
              "name": variables.role
            }
          },
          {
            "apiVersion": "source.toolkit.fluxcd.io/v1",
            "kind": "GitRepository",
            "metadata": {
              "name": "ankhmorpork",
              "namespace": object.metadata.name,
              "annotations": {
                "kubernetes.io/description":
                  "Generated by the generate-flux-reconciler GeneratingPolicy from "
                  + "the flux.rbac.thaum.xyz/role label on this namespace. Edit the "
                  + "policy, not this object -- synchronize is on, so changes here "
                  + "are reverted. The source every Kustomization in "
                  + object.metadata.name + " reads; --no-cross-namespace-refs=true "
                  + "forbids naming one elsewhere."
              }
            },
            "spec": {
              "interval": "60s",
              "ref": {"branch": "master"},
              "url": "https://github.com/thaum-xyz/ankhmorpork"
            }
          }
        ])
