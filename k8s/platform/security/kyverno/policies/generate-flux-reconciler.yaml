apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-flux-reconciler
spec:
  # Everything a Kustomization needs to exist before it can run in a namespace,
  # from one label. A Namespace names the ClusterRole Flux may use inside it:
  #
  #   labels:
  #     flux.rbac.thaum.xyz/role: cluster-admin
  #
  # and this generates the `flux-reconciler` ServiceAccount that
  # kustomize-controller and helm-controller impersonate there
  # (--default-service-account), a RoleBinding giving it that ClusterRole, and
  # the GitRepository those Kustomizations read: --no-cross-namespace-refs=true
  # lets a Kustomization name a source only in its own namespace, and every
  # app's copy is the same public repository. A Kustomization can create neither
  # the source it reads nor the identity it applies as, so both are
  # prerequisites, and one label decides both. The source polls rather than
  # receives, because a Receiver in flux-system cannot notify one in another
  # namespace.
  #
  # ONLY RoleBindings. A namespace whose Flux objects install cluster-scoped
  # resources -- ClusterRoles, CRDs, webhook configurations, StorageClasses --
  # cannot be served by any RoleBinding, however wide the role. Those namespaces
  # are hand-written in k8s/namespaces/<name>/, ServiceAccount and ClusterRoleBinding
  # together, and are deliberately NOT labelled here.
  #
  # That split is the security boundary. Generating the cluster-scoped half
  # would mean granting the Kyverno background controller `clusterrolebindings`
  # write and `bind` on `cluster-admin` -- after which any policy, however
  # written, could mint cluster-admin from a namespace label. Keeping that
  # capability out of the controller entirely is worth the one line per
  # platform component that hand-writing costs.
  #
  # The platform-<domain> identities and sources are hand-written for a second
  # reason on top of that one: they are on the bootstrap path. platform-security's
  # flux-reconciler and GitRepository are what the Kustomization installing
  # Kyverno impersonates and reads, and platform-network's are how the CNI
  # arrives, so an object generated by the policy engine that Flux installs
  # cannot be one Flux needs in order to install it. On a rebuild nothing would
  # ever reconcile.
  evaluation:
    # Namespaces already carrying the label are reconciled too, not only ones
    # created or relabelled after this policy lands. An object that already
    # exists with the same content is adopted, as the pre-seeded ServiceAccounts
    # were.
    generateExisting:
      enabled: true
    # Recreates any of the three if deleted, and removes all of them when the
    # label goes.
    synchronize:
      enabled: true
    # Deleting this policy leaves its objects in place. Without this, synchronize
    # makes a policy deletion delete every labelled namespace's reconciler and
    # source at once, so nothing would reconcile until something recreated them
    # -- which is also what made a rename a two-commit change. A successor policy
    # adopts what is left, the way this one adopted the pre-seeded
    # ServiceAccounts. Removing the label still removes the objects; this only
    # covers the policy itself going away.
    orphanDownstreamOnPolicyDelete:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    # Namespaces are cluster-scoped, so only a cluster-admin can set this label
    # -- `admin` and `edit` get get/list/watch on namespaces and nothing more.
    # A tenant cannot label their way into a wider reconciler.
    - name: has-a-reconciler-label
      expression: >-
        object.metadata.?labels.orValue({}).exists(k, k == "flux.rbac.thaum.xyz/role")
  variables:
    - name: role
      expression: object.metadata.labels["flux.rbac.thaum.xyz/role"]
  generate:
    # `expression` rather than `template` because generator.Apply takes the
    # target namespace and the resources, and must evaluate to a bool.
    - expression: >-
        generator.Apply(object.metadata.name, [
          {
            "apiVersion": "v1",
            "kind": "ServiceAccount",
            "metadata": {
              "name": "flux-reconciler",
              "namespace": object.metadata.name,
              "annotations": {
                "kubernetes.io/description":
                  "Generated by the generate-flux-reconciler GeneratingPolicy "
                  + "from the flux.rbac.thaum.xyz/role label on this namespace. "
                  + "Edit the label, not this object -- synchronize is on, so "
                  + "changes here are reverted. The identity Flux impersonates "
                  + "for objects in this namespace that do not set "
                  + "spec.serviceAccountName."
              }
            },
            "automountServiceAccountToken": false
          },
          {
            "apiVersion": "rbac.authorization.k8s.io/v1",
            "kind": "RoleBinding",
            "metadata": {
              "name": "flux-reconciler",
              "namespace": object.metadata.name,
              "annotations": {
                "kubernetes.io/description":
                  "Generated from the flux.rbac.thaum.xyz/role label on this "
                  + "namespace. A RoleBinding, so it confers "
                  + variables.role + " only inside " + object.metadata.name + "."
              }
            },
            "subjects": [{
              "kind": "ServiceAccount",
              "name": "flux-reconciler",
              "namespace": object.metadata.name
            }],
            "roleRef": {
              "apiGroup": "rbac.authorization.k8s.io",
              "kind": "ClusterRole",
              "name": variables.role
            }
          },
          {
            "apiVersion": "source.toolkit.fluxcd.io/v1",
            "kind": "GitRepository",
            "metadata": {
              "name": "ankhmorpork",
              "namespace": object.metadata.name,
              "annotations": {
                "kubernetes.io/description":
                  "Generated by the generate-flux-reconciler GeneratingPolicy from "
                  + "the flux.rbac.thaum.xyz/role label on this namespace. Edit the "
                  + "policy, not this object -- synchronize is on, so changes here "
                  + "are reverted. The source every Kustomization in "
                  + object.metadata.name + " reads; --no-cross-namespace-refs=true "
                  + "forbids naming one elsewhere."
              }
            },
            "spec": {
              "interval": "60s",
              "ref": {"branch": "master"},
              "url": "https://github.com/thaum-xyz/ankhmorpork"
            }
          }
        ])
