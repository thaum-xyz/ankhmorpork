apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  # Cluster-scoped. kustomize cannot know that for a CRD kind and stamps the
  # component's namespace on it in the rendered output; the API server ignores
  # the field for cluster-scoped resources.
  name: generate-flux-reconciler
spec:
  # Self-service reconciler identities. A Namespace names the ClusterRole Flux
  # may use inside it:
  #
  #   labels:
  #     flux.rbac.thaum.xyz/role: flux-tenant-reconciler
  #
  # and this generates the `flux-reconciler` ServiceAccount that
  # kustomize-controller and helm-controller impersonate there
  # (--default-service-account), plus a RoleBinding giving it that ClusterRole.
  #
  # ONLY RoleBindings. A namespace whose Flux objects install cluster-scoped
  # resources -- ClusterRoles, CRDs, webhook configurations, StorageClasses --
  # cannot be served by any RoleBinding, however wide the role. Those namespaces
  # are hand-written in k8s/reconcilers/, ServiceAccount and ClusterRoleBinding
  # together, and are deliberately NOT labelled here.
  #
  # That split is the security boundary. Generating the cluster-scoped half
  # would mean granting the Kyverno background controller `clusterrolebindings`
  # write and `bind` on `cluster-admin` -- after which any policy, however
  # written, could mint cluster-admin from a namespace label. Keeping that
  # capability out of the controller entirely is worth the one line per
  # platform component that hand-writing costs.
  #
  # flux-system is also hand-written, for a different reason: Flux must be able
  # to reconcile before and without Kyverno. A reconciler identity generated by
  # the policy engine that Flux itself installs cannot be the one Flux needs to
  # install it.
  evaluation:
    # Namespaces already carrying the label are reconciled too, not only ones
    # created or relabelled after this policy lands.
    generateExisting:
      enabled: true
    # Recreates either object if deleted, and removes both when the label goes.
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    # Namespaces are cluster-scoped, so only a cluster-admin can set this label
    # -- `admin` and `edit` get get/list/watch on namespaces and nothing more.
    # A tenant cannot label their way into a wider reconciler.
    - name: has-a-reconciler-label
      expression: >-
        object.metadata.?labels.orValue({}).exists(k, k == "flux.rbac.thaum.xyz/role")
  variables:
    - name: role
      expression: object.metadata.labels["flux.rbac.thaum.xyz/role"]
  generate:
    # `expression` rather than `template` because generator.Apply takes the
    # target namespace and the resources, and must evaluate to a bool.
    - expression: >-
        generator.Apply(object.metadata.name, [
          {
            "apiVersion": "v1",
            "kind": "ServiceAccount",
            "metadata": {
              "name": "flux-reconciler",
              "namespace": object.metadata.name,
              "annotations": {
                "kubernetes.io/description":
                  "Generated by the generate-flux-reconciler GeneratingPolicy "
                  + "from the flux.rbac.thaum.xyz/role label on this namespace. "
                  + "Edit the label, not this object -- synchronize is on, so "
                  + "changes here are reverted. The identity Flux impersonates "
                  + "for objects in this namespace that do not set "
                  + "spec.serviceAccountName."
              }
            },
            "automountServiceAccountToken": false
          },
          {
            "apiVersion": "rbac.authorization.k8s.io/v1",
            "kind": "RoleBinding",
            "metadata": {
              "name": "flux-reconciler",
              "namespace": object.metadata.name,
              "annotations": {
                "kubernetes.io/description":
                  "Generated from the flux.rbac.thaum.xyz/role label on this "
                  + "namespace. A RoleBinding, so it confers "
                  + variables.role + " only inside " + object.metadata.name + "."
              }
            },
            "subjects": [{
              "kind": "ServiceAccount",
              "name": "flux-reconciler",
              "namespace": object.metadata.name
            }],
            "roleRef": {
              "apiGroup": "rbac.authorization.k8s.io",
              "kind": "ClusterRole",
              "name": variables.role
            }
          }
        ])
