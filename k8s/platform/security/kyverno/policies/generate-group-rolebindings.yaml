apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  # Cluster-scoped. kustomize cannot know that for a CRD kind and stamps the
  # component's namespace on it in the rendered output; the API server ignores
  # the field for cluster-scoped resources.
  name: generate-group-rolebindings
spec:
  # Self-service namespace provisioning. A Namespace declares who may touch it
  # and at what level, one label per group:
  #
  #   labels:
  #     group.rbac.thaum.xyz/media: edit
  #     group.rbac.thaum.xyz/guests: view
  #
  # and this generates a RoleBinding per label, giving `oidc:k8s:group:<group>`
  # that ClusterRole in that namespace.
  #
  # The group is in the label KEY and the tier in the value, which is what lets
  # several groups share a namespace at different levels: label keys are unique,
  # label values are not a set. The earlier shape -- one label naming a tier --
  # could hold only one group, and a label per tier could hold only one group
  # per tier.
  #
  # Groups scale with people, not with namespaces: one `k8s:group:media` in
  # pocket-id covers every namespace that names it, at whatever level each
  # namespace grants, so onboarding someone is a single membership change. The
  # tier is a property of the (namespace, group) pair rather than of the group.
  #
  # The group name is DERIVED from the key, never taken from a value. Pocket-id
  # groups are shared across every OIDC client, so `oidc:mealie` already exists
  # as the Mealie app's own SSO group; the `k8s:group:` prefix confines what a
  # label can select to names created for this purpose, so a typo picks a group
  # that does not exist -- no access -- rather than an application's own.
  # (A label value could not name a group anyway: values reject `:`.)
  #
  # The ceiling on this whole mechanism is not enforced here, where a policy
  # edit could move it, but in RBAC: the background controller may `bind` only
  # `edit` and `view` (clusterrole-background-controller.yaml), so no policy can
  # generate a binding to `admin` or `cluster-admin` whatever it asks for.
  # validate-group-labels.yaml rejects any other tier at admission so the
  # failure is loud rather than a binding that never appears.
  evaluation:
    # Namespaces that already carry labels are reconciled too, not only ones
    # created or relabelled after this policy lands.
    generateExisting:
      enabled: true
    # Keeps the bindings matching this policy, recreates them if deleted, and
    # removes one when its label goes -- which is what makes revoking a group's
    # access a one-line diff rather than a manual cleanup.
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  variables:
    - name: prefix
      expression: '"group.rbac.thaum.xyz/"'
    - name: labels
      expression: object.metadata.?labels.orValue({})
    # Map iteration binds the key, so this is the set of group labels present.
    - name: groupKeys
      expression: variables.labels.filter(k, k.startsWith(variables.prefix))
  matchConditions:
    # Namespaces are cluster-scoped, so only a cluster-admin can set these
    # labels -- `admin` and `edit` get get/list/watch on namespaces and nothing
    # more. A tenant cannot label their way into a grant.
    #
    # Inlined rather than reusing the variables above: matchConditions are
    # evaluated before `variables`, so they cannot reference them.
    - name: has-a-group-label
      expression: >-
        object.metadata.?labels.orValue({}).exists(k, k.startsWith("group.rbac.thaum.xyz/"))
  generate:
    # `expression` rather than `template` because the number of bindings is not
    # known ahead of time: a template renders a fixed document, while this maps
    # over however many group labels the namespace carries. generator.Apply
    # takes the target namespace and the resources to generate.
    - expression: >-
        generator.Apply(object.metadata.name, variables.groupKeys.map(k, {
          "apiVersion": "rbac.authorization.k8s.io/v1",
          "kind": "RoleBinding",
          "metadata": {
            "name": "oidc-k8s-group-" + k.split("/")[1] + "-" + variables.labels[k],
            "namespace": object.metadata.name,
            "annotations": {
              "kubernetes.io/description":
                "Generated by the generate-group-rolebindings GeneratingPolicy "
                + "from the " + k + " label on this namespace. Edit the label, "
                + "not this object -- synchronize is on, so changes here are reverted."
            }
          },
          "subjects": [{
            "apiGroup": "rbac.authorization.k8s.io",
            "kind": "Group",
            "name": "oidc:k8s:group:" + k.split("/")[1]
          }],
          "roleRef": {
            "apiGroup": "rbac.authorization.k8s.io",
            "kind": "ClusterRole",
            "name": variables.labels[k]
          }
        }))
