apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-group-rolebindings
spec:
  # Who may touch a namespace, and at what level, one label per group:
  #
  #   labels:
  #     group.rbac.thaum.xyz/media: edit
  #     group.rbac.thaum.xyz/guests: view
  #
  # Each becomes a RoleBinding giving `oidc:k8s:group:<group>` that ClusterRole
  # in that namespace. Why the group is in the key, why the prefix is derived
  # rather than taken from the label, and where the ceiling on the tier is
  # enforced: docs/reference/annotations.md, under group.rbac.thaum.xyz/<group>.
  evaluation:
    # Labelled namespaces that already exist are processed too.
    generateExisting:
      enabled: true
    # Recreates a binding if deleted and removes it when its label goes, which
    # is what makes revoking access a one-line diff.
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  variables:
    - name: prefix
      expression: '"group.rbac.thaum.xyz/"'
    - name: labels
      expression: object.metadata.?labels.orValue({})
    # Map iteration binds the key, so this is the set of group labels present.
    - name: groupKeys
      expression: variables.labels.filter(k, k.startsWith(variables.prefix))
  matchConditions:
    # Only a cluster-admin can label a Namespace, so a tenant cannot label their
    # way into a grant. Inlined rather than reusing the variables above:
    # matchConditions are evaluated before `variables`.
    - name: has-a-group-label
      expression: >-
        object.metadata.?labels.orValue({}).exists(k, k.startsWith("group.rbac.thaum.xyz/"))
  generate:
    # `expression` rather than `template`: the number of bindings is only known
    # at evaluation, so this maps over the group labels present.
    - expression: >-
        generator.Apply(object.metadata.name, variables.groupKeys.map(k, {
          "apiVersion": "rbac.authorization.k8s.io/v1",
          "kind": "RoleBinding",
          "metadata": {
            "name": "oidc-k8s-group-" + k.split("/")[1] + "-" + variables.labels[k],
            "namespace": object.metadata.name,
            "annotations": {
              "kubernetes.io/description":
                "Generated by the generate-group-rolebindings GeneratingPolicy "
                + "from the " + k + " label on this namespace. Edit the label, "
                + "not this object -- synchronize is on, so changes here are reverted."
            }
          },
          "subjects": [{
            "apiGroup": "rbac.authorization.k8s.io",
            "kind": "Group",
            "name": "oidc:k8s:group:" + k.split("/")[1]
          }],
          "roleRef": {
            "apiGroup": "rbac.authorization.k8s.io",
            "kind": "ClusterRole",
            "name": variables.labels[k]
          }
        }))
