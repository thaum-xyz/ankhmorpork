apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Every policy here is cluster-scoped. kustomize cannot know that for a CRD kind
# and stamps the component's namespace on them in the rendered output; the API
# server ignores the field for cluster-scoped resources.
resources:
  - require-resource-requests.yaml
  - validate-pdb-drain-safety.yaml
  - validate-helm-chart-version.yaml
  - validate-ingress-contract.yaml
  - mutate-configmap-autoreload.yaml
  - validate-group-labels.yaml
  - generate-group-rolebindings.yaml
  - validate-reconciler-sa-usage.yaml
  - validate-flux-role-labels.yaml
  - generate-flux-reconciler.yaml
