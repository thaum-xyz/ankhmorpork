apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-flux-source
spec:
  # The source a namespace's Kustomizations read. --no-cross-namespace-refs=true
  # lets a Kustomization name a GitRepository only in its own namespace, so every
  # namespace that reconciles needs its own copy of the same public repository.
  # It is a prerequisite of the Kustomization -- one cannot create the source it
  # reads -- exactly as the identity generate-flux-reconciler produces from the
  # same label is, and every app's copy is identical, so it comes from the label
  # too rather than from a file per namespace.
  #
  # Apps only. The platform-<domain> namespaces keep theirs as files in
  # k8s/namespaces/<domain>/ because they are on the bootstrap path: this policy
  # is installed through platform-security and the CNI through platform-network,
  # so a source generated here could never be the one Flux reads to install the
  # engine that generates it. They carry no flux.rbac.thaum.xyz/role label,
  # which is what keeps them out of the match below.
  #
  # Polls rather than receives: a Receiver in flux-system cannot notify a source
  # in another namespace, so a merge lands within the interval.
  evaluation:
    # Namespaces already carrying the label are reconciled too, not only ones
    # created or relabelled after this policy lands. A GitRepository that already
    # exists with the same content is adopted, the way the pre-seeded
    # ServiceAccounts were.
    generateExisting:
      enabled: true
    # Recreates the source if deleted, reverts edits, and removes it when the
    # label goes.
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    # Namespaces are cluster-scoped, so only a cluster-admin can set this label.
    - name: has-a-reconciler-label
      expression: >-
        object.metadata.?labels.orValue({}).exists(k, k == "flux.rbac.thaum.xyz/role")
  generate:
    - expression: >-
        generator.Apply(object.metadata.name, [{
          "apiVersion": "source.toolkit.fluxcd.io/v1",
          "kind": "GitRepository",
          "metadata": {
            "name": "ankhmorpork",
            "namespace": object.metadata.name,
            "annotations": {
              "kubernetes.io/description":
                "Generated by the generate-flux-source GeneratingPolicy from the "
                + "flux.rbac.thaum.xyz/role label on this namespace. Edit the policy, "
                + "not this object -- synchronize is on, so changes here are reverted. "
                + "The source every Kustomization in " + object.metadata.name
                + " reads; --no-cross-namespace-refs=true forbids naming one elsewhere."
            }
          },
          "spec": {
            "interval": "60s",
            "ref": {"branch": "master"},
            "url": "https://github.com/thaum-xyz/ankhmorpork"
          }
        }])
