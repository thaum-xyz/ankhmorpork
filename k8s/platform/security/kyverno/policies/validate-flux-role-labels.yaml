apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-flux-role-labels
spec:
  # generate-flux-reconciler turns a `flux.rbac.thaum.xyz/role` label into a
  # RoleBinding to the ClusterRole its value names. Two ways that goes wrong
  # quietly, both made loud here:
  #
  #   - a ClusterRole the background controller may not `bind`. RBAC's
  #     escalation check rejects it inside a background UpdateRequest -- no
  #     admission error, no binding, and a HelmRelease that simply stops
  #     reconciling with a Forbidden nobody is watching for. Every name allowed
  #     here must also appear in the `bind` resourceNames of
  #     clusterrole-background-controller.yaml; adding one without the other
  #     produces exactly that silent failure.
  #   - an empty value, which would bind a ClusterRole named "" rather than
  #     nothing.
  #
  # What `cluster-admin` does and does not mean through a RoleBinding, and why a
  # namespace that installs cluster-scoped objects needs a ClusterRoleBinding as
  # well: docs/reference/annotations.md, under flux.rbac.thaum.xyz/role.
  #
  # Scoped to namespaces that actually carry the label, so it can never block
  # creating an ordinary namespace.
  evaluation:
    background:
      enabled: false
  failurePolicy: Fail
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
  matchConditions:
    # Inlined rather than reusing a variable: matchConditions are evaluated
    # before `variables` and cannot reference them.
    - name: has-a-reconciler-label
      expression: >-
        object.metadata.?labels.orValue({}).exists(k, k == "flux.rbac.thaum.xyz/role")
  validations:
    - expression: >-
        object.metadata.labels["flux.rbac.thaum.xyz/role"] in
        ["cluster-admin"]
      message: >-
        A flux.rbac.thaum.xyz/role label must name a ClusterRole the Kyverno
        background controller is allowed to bind -- currently only
        "cluster-admin". It grants that role to this namespace's
        flux-reconciler ServiceAccount through a RoleBinding, which confers only
        its namespaced rules and only here, so it can never reach outside this
        namespace. A namespace whose Flux objects install cluster-scoped
        resources cannot use this label at all; it belongs in
        k8s/namespaces/<name>/ with a hand-written ClusterRoleBinding.
