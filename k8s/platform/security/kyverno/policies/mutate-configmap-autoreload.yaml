apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-configmap-autoreload
spec:
  # A process that reads its ConfigMap once at startup never sees a change to
  # it. This stamps the referenced ConfigMap's resourceVersion into the Pod
  # template of a workload that opts in, so a ConfigMap change rolls its Pods on
  # the next Flux apply. Why the trigger is the workload rather than the
  # ConfigMap, what that trades, and why Secrets are left out:
  # docs/explanation/configmap-autoreload.md.
  evaluation:
    background:
      enabled: false
  # Ignore, not Fail: this runs on every Deployment and StatefulSet admission,
  # Flux's included, and a missing ConfigMap makes resource.Get error. Failing
  # open costs a stale Pod; failing closed costs the ability to deploy.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
          - statefulsets
  matchConditions:
    # Opt-in per workload, naming the ConfigMap: one API read per admission, and
    # the workload's own manifest shows which config it reloads on.
    - name: opted-in
      expression: >-
        has(object.metadata.annotations) &&
        object.metadata.annotations.exists(k, k == "autoreloader.thaum.xyz/configmap")
  variables:
    - name: cmname
      expression: >-
        object.metadata.annotations["autoreloader.thaum.xyz/configmap"]
    - name: cmversion
      expression: >-
        resource.Get("v1", "configmaps", object.metadata.namespace, variables.cmname).metadata.resourceVersion
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              template: Object.spec.template{
                metadata: Object.spec.template.metadata{
                  annotations: {"autoreloader.thaum.xyz/version": variables.cmversion}
                }
              }
            }
          }
