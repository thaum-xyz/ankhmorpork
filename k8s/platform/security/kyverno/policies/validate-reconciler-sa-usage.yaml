apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-reconciler-sa-usage
spec:
  # `flux-reconciler` is the identity Flux impersonates to reconcile a namespace
  # -- namespace-admin in an app namespace, cluster-admin in a platform one --
  # and impersonation mounts no token, so nothing legitimately runs as it. A Pod
  # naming it is the likeliest leak: `serviceAccountName: flux-reconciler`
  # copy-pasted into a Deployment hands that workload the reconciler's rights
  # with no error and no symptom. This denies the name outright.
  #
  # It bounds workloads, not people: `edit` carries `impersonate` on
  # ServiceAccounts, so a tenant can act as the reconciler without creating
  # anything, and a tenant who controls the reconciled git path can ship its
  # token out. What bounds a tenant is the namespace edge, not this rule:
  # docs/reference/annotations.md, under flux.rbac.thaum.xyz/role. Refs #1436.
  #
  # Lives with the other cluster-wide conventions rather than with flux:
  # `flux-reconciler` is a reserved name in every namespace, not one
  # component's object, and the policy that mints it sits in this directory.
  evaluation:
    background:
      enabled: false
  failurePolicy: Fail
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          # spec.serviceAccountName is immutable on a Pod, so CREATE is the
          # only way in.
          - CREATE
        resources:
          - pods
  validations:
    # Both spellings: `serviceAccount` is the deprecated alias for
    # `serviceAccountName`. The API server defaults one from the other before
    # admission runs, so checking either would do -- checking both means the
    # rule does not rest on that defaulting staying where it is.
    - expression: >-
        object.spec.?serviceAccountName.orValue("") != "flux-reconciler" &&
        object.spec.?serviceAccount.orValue("") != "flux-reconciler"
      message: >-
        The flux-reconciler ServiceAccount is the identity Flux impersonates to
        reconcile this namespace, not one a workload may run as; it is
        privileged by construction. Give the Pod its own ServiceAccount and
        grant that what it needs.
