apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-nfs-pvc-alert-exclusion
spec:
  # Every unifi-nas claim is a directory on one btrfs volume on the UNAS, so all
  # of them report that volume's fill level as their own. KubePersistentVolumeFillingUp
  # then fires once per claim for a single filling disk. The mixin rule already
  # ends with `unless ... kube_persistentvolumeclaim_labels
  # {label_excluded_from_alerts="true"}`, so this label is the supported way out.
  #
  # A policy rather than manifest labels because the versitygw chart owns three of
  # these claims and does not expose PVC labels.
  evaluation:
    background:
      enabled: true
    mutateExisting:
      enabled: true
    # Must be false for mutateExisting to act on background-controller requests.
    skipBackgroundRequests: false
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - persistentvolumeclaims
  matchConditions:
    - name: only-nfs-storage-class
      expression: >-
        object.spec.?storageClassName.orValue("") == "unifi-nas"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              labels: {"excluded_from_alerts": "true"}
            }
          }
