apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-helm-chart-version
spec:
  evaluation:
    background:
      enabled: false
  failurePolicy: Fail
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - helm.toolkit.fluxcd.io
        apiVersions:
          - v2
        operations:
          - CREATE
          - UPDATE
        resources:
          - helmreleases
  validations:
    - expression: >-
        object.spec.chart.spec.?version.orValue("").matches(
        r'^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$')
      message: HelmRelease chart versions must be pinned to an exact semantic version.
