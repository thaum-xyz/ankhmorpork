# Config reference: https://github.com/kyverno/kyverno/blob/main/charts/kyverno/values.yaml

# The chart has no `crds/` directory -- all 22 CRDs are ordinary templates, so
# they carry Helm ownership and a rollback or an uninstall deletes them. That
# takes every ClusterPolicy in policies/ and every pending UpdateRequest with
# them, and `install.remediation.retries` makes an uninstall reachable from a
# failed upgrade rather than only from a deliberate teardown.
#
# `keep` makes Helm leave the CRDs alone. It has to reach them through the
# chart -- `kubectl annotate` does not survive the next apply.
#
# Two blocks, not one. `crds.annotations` reaches only the 11 CRDs from the
# bundled `crds` subchart; the 11 in `policies.kyverno.io` come from the
# external `kyverno-api` subchart, which reads its own key. Setting just the
# first leaves half the CRDs unguarded and looks done.
#
# This is a guard, not a preference. Do not drop it because the release looks
# stable; the cost only shows up during an uninstall.
crds:
  annotations:
    helm.sh/resource-policy: keep
kyverno-api:
  annotations:
    helm.sh/resource-policy: keep

# Admission reports require the reports controller. Enforcement still happens
# synchronously and is observable through controller metrics and events.
features:
  admissionReports:
    enabled: false
  aggregateReports:
    enabled: false
  policyReports:
    enabled: false
  validatingAdmissionPolicyReports:
    enabled: false
  backgroundScan:
    enabled: false

# The pre-delete hooks that tear the webhooks down on uninstall, and the
# helm-test Pods. Neither runs in normal operation; they are here so that
# "does anything still carry a CPU limit?" has one answer.
webhooksCleanup:
  resources:
    limits:
      cpu: null
test:
  resources:
    limits:
      cpu: null

admissionController:
  # Admission is on the API write path, so keep one replica on each of the
  # cluster's three control-plane nodes.
  replicas: 3
  priorityClassName: system-cluster-critical
  podDisruptionBudget:
    minAvailable: null
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
  initContainer:
    resources:
      limits: null
      requests:
        cpu: 10m
        memory: 64Mi
  container:
    resources:
      limits: null
      requests:
        cpu: 100m
        memory: 128Mi
  serviceMonitor:
    enabled: true

# Required by generate-tenant-rolebinding. The admission controller only records
# an UpdateRequest for a generate rule; this is the controller that reconciles
# one into the generated object, and keeps it in sync afterwards. Without it a
# generate policy parks UpdateRequests in Pending forever.
#
# The chart's own `kyverno:background-controller:core` role already carries
# rolebindings create/update/patch/delete. What it does not carry is the `bind`
# verb, without which RBAC's escalation check rejects a binding to a role the
# controller does not itself hold -- see clusterrole-background-controller.yaml,
# which grants it for exactly two ClusterRoles.
backgroundController:
  enabled: true
  replicas: 1
  priorityClassName: system-cluster-critical
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
  resources:
    limits: null
    requests:
      cpu: 100m
      memory: 64Mi
  serviceMonitor:
    enabled: true

cleanupController:
  enabled: true
  replicas: 1
  priorityClassName: system-cluster-critical
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
  resources:
    limits: null
    requests:
      cpu: 100m
      memory: 64Mi
  serviceMonitor:
    enabled: true

# PolicyReport generation and background auditing can be added independently if
# reports become useful; neither is needed for admission or cleanup enforcement.
reportsController:
  enabled: false
