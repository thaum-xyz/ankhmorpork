apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:tenant-rbac
  labels:
    # kyverno:background-controller is an aggregated role; this is the
    # documented extension point, and the admission and cleanup controllers use
    # the same pattern. Extending it here rather than through
    # backgroundController.rbac.clusterRole.extraResources in the chart values
    # keeps a privilege grant reviewable as an RBAC object instead of buried in
    # a Helm values file.
    rbac.kyverno.io/aggregate-to-background-controller: "true"
  annotations:
    kubernetes.io/description: >-
      Lets the background controller bind the roles the generating policies
      need: `edit` and `view` for generate-group-rolebindings, `cluster-admin`
      for generate-flux-reconciler. RBAC's escalation check rejects creating a
      RoleBinding to a role the creator neither holds nor may `bind`, and the
      chart grants the controller no `bind` at all. It also lets it write the
      two kinds those policies generate that are not bindings, ServiceAccounts
      and GitRepositories.

      `resourceNames` caps which roles a policy may reference, and each addition
      raises that cap for every policy at once -- so add one only with the reason
      written beside it.

      But the ceiling that matters is not this list. It is the ABSENCE of any
      `clusterrolebindings` verb in this role: every binding the controller can
      create is a RoleBinding, and a RoleBinding confers only the namespaced
      half of whatever role it names, in one namespace. So the worst a policy
      can produce is namespace-admin somewhere -- true of `cluster-admin` here
      exactly as it was of the bespoke role this replaced. Namespaces that need
      a cluster-scoped identity are hand-written, and adding
      `clusterrolebindings` here would collapse that distinction.
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    verbs:
      - bind
    resourceNames:
      - edit
      - view
      # generate-flux-reconciler binds this to each tenant namespace's
      # flux-reconciler ServiceAccount. This DOES move the ceiling above `edit`,
      # and knowingly: a generated RoleBinding to it is namespace-admin.
      #
      # It does NOT put cluster-admin within the controller's reach, which is
      # the thing worth protecting. No `clusterrolebindings` verb appears
      # anywhere in this role, so every binding it can create is a RoleBinding,
      # and a RoleBinding confers only the namespaced half of whatever role it
      # names, in one namespace. Naming `cluster-admin` here therefore buys a
      # policy no more than naming any `*` on `*` role would -- which is why a
      # bespoke role was dropped rather than kept as a fig leaf.
      #
      # The corollary is the invariant to defend: adding `clusterrolebindings`
      # to this role would turn this entry into real cluster-admin. Do not.
      # Namespaces that genuinely need a cluster-scoped identity -- the platform
      # domains, and the four apps whose charts install cluster-scoped objects --
      # are hand-written in k8s/namespaces/<name>/ for exactly that reason.
      #
      # validate-flux-role-labels rejects any other value at admission, so this
      # list and that policy have to change together: a name allowed there but
      # missing here fails inside a background UpdateRequest, where nothing
      # surfaces it.
      - cluster-admin
  # generate-flux-reconciler creates the ServiceAccount as well as its binding.
  # Creating one confers nothing by itself -- a fresh ServiceAccount holds no
  # rights -- so this grants no privilege; what the SA may do is decided entirely
  # by the `bind` list above. Read verbs for the same reason rolebindings need
  # them, below.
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # generate-flux-reconciler also creates the GitRepository each labelled
  # namespace's Kustomizations read. Wider than a ServiceAccount, and knowingly:
  # a source decides what a Kustomization applies, so a policy that rewrote
  # spec.url would have every labelled namespace's reconciler apply whatever it
  # points at -- namespace-admin in each, nothing across, the same reach the
  # `bind` list above already concedes. The ceiling on both is who may write
  # policies.
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # The chart's core role grants create/update/patch/delete on rolebindings but
  # no read verbs, and generation reads before it writes -- it looks for an
  # existing object to decide between create and update, and synchronize needs
  # to see drift. Without these, every generate fails with
  #   permission denied: rolebindings ... is forbidden: ... cannot get resource
  #   "rolebindings" ... in the namespace "<ns>"
  # inside a background UpdateRequest, where nothing surfaces it at admission.
  #
  # This widens no ceiling: the controller can already write RoleBindings, and
  # `bind` above still caps which ClusterRole any of them may reference.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - get
      - list
      - watch
