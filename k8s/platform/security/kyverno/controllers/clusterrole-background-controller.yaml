apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:tenant-rbac
  labels:
    # kyverno:background-controller is an aggregated role and this is its
    # documented extension point. An RBAC object here is a reviewable grant; the
    # chart's extraResources value would bury the same grant in Helm values.
    rbac.kyverno.io/aggregate-to-background-controller: "true"
  annotations:
    kubernetes.io/description: >-
      Lets the background controller bind the roles the generating policies
      need -- `edit` and `view` for generate-group-rolebindings, `cluster-admin`
      for generate-flux-reconciler -- and write the kinds those policies generate
      that are not bindings. RBAC's escalation check rejects a RoleBinding to a
      role the creator neither holds nor may `bind`, and the chart grants no
      `bind` at all; `resourceNames` caps what any policy may reference.

      The ceiling that matters is the ABSENCE of any `clusterrolebindings` verb
      here: every binding the controller can create is a RoleBinding, which
      confers only the namespaced half of a role in one namespace, so the worst
      a policy can produce is namespace-admin somewhere. Adding that verb would
      turn the `cluster-admin` entry into real cluster-admin. Do not.
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    verbs:
      - bind
    resourceNames:
      - edit
      - view
      # generate-flux-reconciler binds this to each labelled namespace's
      # flux-reconciler. Knowingly above `edit`: a RoleBinding to it is
      # namespace-admin, and no wider, for the reason in the description.
      # validate-flux-role-labels allows exactly this list, so the two change
      # together: a name allowed there but missing here fails inside a
      # background UpdateRequest, where nothing surfaces it.
      - cluster-admin
  # Creating a ServiceAccount confers nothing; what it may do is decided by the
  # `bind` list above. Read verbs for the same reason rolebindings need them.
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # A source decides what a Kustomization applies, so a policy rewriting spec.url
  # would have every labelled namespace's reconciler apply whatever it points at
  # -- namespace-admin in each, nothing across, the reach the `bind` list already
  # concedes. The ceiling on both is who may write policies.
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # The chart grants write verbs on rolebindings but no read verbs, and
  # generation reads before it writes -- to choose create or update, and for
  # synchronize to see drift. Without these every generate fails with a
  # "cannot get resource rolebindings" Forbidden inside a background
  # UpdateRequest, where nothing surfaces it at admission.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - get
      - list
      - watch
