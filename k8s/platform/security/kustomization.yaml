apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Every component the platform-security Kustomization reconciles.
#
# kyverno/policies is listed beside kyverno rather than folded into
# kyverno/kustomization.yaml, which would be the tidier shape. That file sets
# `namespace: platform-security`, and every object under policies/ is
# cluster-scoped: kustomize cannot know that for a CRD kind, so it would stamp
# the namespace onto each one. The API server ignores the field, but Flux's
# inventory does not, and the entries would change identity for nothing.
#
# No `namespace:` at this level, for the same reason.
resources:
  - cert-manager/
  - external-secrets/
  - kubeconfig/
  - kyverno/
  - kyverno/policies/
  - oidc-rbac/
# Hashes every generated values ConfigMap and rewrites the HelmRelease
# valuesFrom entry that names it, so a values edit changes the release spec and
# helm-controller upgrades on the event instead of noticing on its next
# interval. See k8s/kustomize/helmrelease-values/nameref.yaml.
components:
  - ../../kustomize/helmrelease-values
