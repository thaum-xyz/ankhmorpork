apiVersion: v1
kind: Config
current-context: ankhmorpork
clusters:
  - name: ankhmorpork
    cluster:
      server: SERVER_PLACEHOLDER
      certificate-authority-data: CA_PLACEHOLDER
users:
  - name: pocket-id
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        command: kubectl
        args:
          - oidc-login
          - get-token
          - --oidc-issuer-url=ISSUER_PLACEHOLDER
          - --oidc-client-id=CLIENT_ID_PLACEHOLDER
          # offline_access earns a refresh token, so the passkey is needed
          # once per session rather than once per command.
          - --oidc-extra-scope=email
          - --oidc-extra-scope=groups
          - --oidc-extra-scope=offline_access
          - --oidc-pkce-method=S256
        interactiveMode: IfAvailable
        provideClusterInfo: false
contexts:
  - name: ankhmorpork
    context:
      cluster: ankhmorpork
      user: pocket-id
preferences: {}
