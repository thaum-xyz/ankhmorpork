# Reference documentation: https://github.com/kubernetes-sigs/external-dns/blob/master/charts/external-dns/values.yaml

txtOwnerId: thaum.xyz
txtPrefix: k8s.

policy: sync
domainFilters:
  - thaum.xyz
  - krupa.net.pl

registry: txt
triggerLoopOnEvent: true
logLevel: &logLevel debug

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 10m
    memory: 64Mi

extraArgs:
  - --ignore-ingress-tls-spec
  - --fqdn-template={{`{{`}}.Name{{`}}`}}.{{`{{`}}.Namespace{{`}}`}}.ankhmorpork.thaum.xyz
  - --service-type-filter=LoadBalancer

# Uses UniFi's Integration API; requires Network 10.3.58+ and external-dns 0.21.0.
provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/home-operations/external-dns-unifi-webhook
      tag: "0.10.12"
    resources:
      requests:
        cpu: 10m
        memory: 80Mi
    env:
      - name: LOG_LEVEL
        value: *logLevel
      - name: UNIFI_HOST
        value: https://192.168.1.1 # replace with the address to your UniFi router/controller
      - name: UNIFI_API_KEY
        valueFrom:
          secretKeyRef:
            name: unifi-credentials
            key: UNIFI_API_KEY
    livenessProbe:
      httpGet:
        path: /healthz
        port: http-webhook
      initialDelaySeconds: 10
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /readyz
        port: http-webhook
      initialDelaySeconds: 10
      timeoutSeconds: 5
