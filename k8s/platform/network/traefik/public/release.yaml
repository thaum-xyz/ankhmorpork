---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-public
  namespace: platform-network
  annotations:
    # Never prune this object. Pruning a HelmRelease uninstalls the release
    # behind it, which here means every public Ingress stops resolving to a
    # backend -- and the two traefik releases share IngressClasses, so the
    # uninstall takes them from the other one too.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  chart:
    spec:
      chart: traefik
      version: "41.6.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: platform-network
      interval: 5m
  interval: 5m
  timeout: 20m
  install:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
  driftDetection:
    mode: warn
  valuesFrom:
    - kind: ConfigMap
      name: values-traefik-common
    - kind: ConfigMap
      name: values-traefik-public
