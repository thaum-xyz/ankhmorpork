---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-public
  namespace: platform-network
spec:
  chart:
    spec:
      chart: traefik
      version: "41.4.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: platform-network
      interval: 5m
  interval: 5m
  timeout: 20m
  install:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
  driftDetection:
    mode: warn
  valuesFrom:
    - kind: ConfigMap
      name: values-traefik-common
    - kind: ConfigMap
      name: values-traefik-public
