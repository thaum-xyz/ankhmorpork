apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-network
resources:
  - public/release.yaml
  - private/release.yaml
  - repository.yaml
  - clusterrole-aggregate-view.yaml
  - clusterrole-aggregate-edit.yaml
generatorOptions:
  disableNameSuffixHash: true
# All three are prefixed with the component, not just the release name. The
# releases are called `public` and `private`, which said enough when this had a
# namespace to itself; in platform-network, beside cloudflared and external-dns,
# a ConfigMap called `values-public` names nothing. `values-common` was worse
# still -- common to what? A generic name in a shared namespace is the shape of
# the alloy/kube-prometheus-stack collision that validate-configmap-ownership
# exists to catch.
configMapGenerator:
  - name: values-traefik-public
    files:
      - values.yaml=public/values.yaml
  - name: values-traefik-private
    files:
      - values.yaml=private/values.yaml
  - name: values-traefik-common
    files:
      - values.yaml=values-common.yaml
