# Config reference: https://github.com/STRRL/cloudflare-tunnel-ingress-controller

cloudflare:
# NOTE: Sensitive values are to be provided via the `credentials` Secret,
#  apiToken: "<cloudflare-api-token>"
#  accountId: "<cloudflare-account-id>"
  tunnelName: "ankhmorpork-tunnel"

ingressClass:
  name: cloudflare

replicaCount: 2

# Covers both controller and connector endpoints; replaced cloudflaredServiceMonitor in 0.1.0.
serviceMonitor:
  create: true

# Pinned so Renovate tracks it. Maintainer fork, carries the host-metrics patches.
cloudflared:
  image:
    repository: ghcr.io/strrl/cloudflared
    tag: "2026.7.3-host-metrics.1"
  resources:
    requests:
      cpu: 20m
      memory: 80Mi
