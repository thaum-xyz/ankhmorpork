apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-network
resources:
  - repository.yaml
  - release.yaml
  - credentials.yaml
configMapGenerator:
  - name: values-cloudflared
    files:
      - values.yaml=values.yaml
# Stable name; see docs/explanation/helm-values.md.
generatorOptions:
  disableNameSuffixHash: true
