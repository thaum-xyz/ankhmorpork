# Reference - https://docs.cilium.io/en/stable/helm-reference/#id1

# 9000 yields insignificant performance improvement while causing unnecessary
# complexity, so jumbo frames are deliberately not used here.
#
# 1270 = tailscale0's 1280 minus 10, and both halves of that matter.
#
# Pods must not exceed the tunnel, or their packets die in bpf_lxc with
# BPF_FIB_LKUP_RET_FRAG_NEEDED and no ICMP comes back, so the sender never
# learns. Symptom: small replies pass, large transfers hang -- a Plex web UI
# that loaded but rendered blank. Host-stack traffic is immune because the
# kernel takes its MSS from the 1280 route; pods do not (cilium/cilium#41478).
#
# The 10 is the awkward part. tailscale0 is a TUN carrying `vnet_hdr on` (see
# `ip -d link show tailscale0`), so every frame is prefixed with a
# struct virtio_net_hdr -- exactly 10 bytes -- which tailscale needs for GSO.
# The host's own TX path hides that, and measures a clean 1280 ceiling: from
# beelink01, a DF ping of 1280 succeeds and 1281 fails. Cilium's BPF redirect
# does not hide it, so pods lose those 10 bytes and cap at 1270. Measured
# 2026-08-30, sharp on both sides -- 1270 works, 1271 does not.
#
# So this tracks tailscale0, it is not a tuning knob: if tailscale ever changes
# its TUN MTU or stops using vnet_hdr, the right value is (tailscale0 MTU - 10),
# not 1500. Note cilium programs this as a route MTU inside the pod netns
# (`ip route show` there shows `mtu 1270`), which is what governs MSS -- raising
# the pod's eth0 by hand changes nothing.
#
# Kept explicit rather than deleted: auto-detection picks 1280 from tailscale0,
# which is 10 too high, and would jump to 1500 if tailscale0 ever stopped being
# a detected device.
MTU: 1270

pmtuDiscovery:
  enabled: true

bpf:
  hostLegacyRouting: false
  masquerade: true
  datapathMode: netkit
  distributedLRU:
    enabled: true
  # Keep this explicit while distributedLRU is enabled. Cilium's 0.0025 default
  # would be too small here: size for at most 50% map pressure using
  #   peak = max(max_over_time(cilium_bpf_map_pressure[30d]))
  #   ratio >= current ratio * peak / 0.50
  # On 2026-08-20: 0.08 * 0.0542 / 0.50 = 0.0087, rounded up to 0.01.
  # Recalculate when the 30-day peak crosses 0.50 or cluster traffic changes.
  mapDynamicSizeRatio: 0.01
bpfClockProbe: true
enableIPv4BIGTCP: false
enableIPv4Masquerade: true
cluster:
  name: ankhmorpork
cni:
  uninstall: false
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
    - 10.42.0.0/16
# k3s loopback apiserver LB. 6444, not 6443 -- agents have no 6443 on loopback.
k8sServiceHost: 127.0.0.1
k8sServicePort: 6444
kubeProxyReplacement: true
priorityClassName: system-node-critical
policyEnforcementMode: never

routingMode: native
ipv4NativeRoutingCIDR: 192.168.50.0/24
autoDirectNodeRoutes: true

securityContext:
  capabilities:
    ciliumAgent:
      # Defaults redefined due to how helm merges lists
      - "CHOWN"
      - "KILL"
      - "NET_ADMIN"
      - "NET_RAW"
      - "IPC_LOCK"
      - "SYS_MODULE"
      - "SYS_ADMIN"
      - "SYS_RESOURCE"
      - "DAC_OVERRIDE"
      - "FOWNER"
      - "SETGID"
      - "SETUID"
      # Added to allow BGP peering on port 179
      - "CAP_NET_BIND_SERVICE"

bgpControlPlane:
  enabled: true

rollOutCiliumPods: true
loadBalancer:
  # FIXME: enable 'dsr' after testing using annotation based SVCs - https://docs.cilium.io/en/stable/network/kubernetes/kubeproxy-free/#annotation-based-dsr-and-snat-mode
  mode: snat
  dsrDispatch: opt
  algorithm: maglev

#l2announcements:
#  enabled: true
#  leaseDuration: 60s
#  leaseRenewDeadline: 3s

#k8sClientRateLimit:
#  qps: 2
#  burst: 6

#ipMasqAgent:
#  enabled: true

operator:
  replicas: 1
  priorityClassName: system-cluster-critical
  unmanagedPodWatcher:
    restart: false
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

hubble:
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp
      - http
    serviceMonitor:
      enabled: true
