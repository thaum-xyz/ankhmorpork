# Reference - https://docs.cilium.io/en/stable/helm-reference/#id1

# Setting to default 1500 as 9000 yields insignificant performance improvement while causing unnecessary complexity
# By default cilium will set MTU to 1280 due to tailscale0 interface presence
MTU: 1500

bpf:
  hostLegacyRouting: false
  masquerade: true
  datapathMode: netkit
  distributedLRU:
    enabled: true
  # Keep this explicit while distributedLRU is enabled. Cilium's 0.0025 default
  # would be too small here: size for at most 50% map pressure using
  #   peak = max(max_over_time(cilium_bpf_map_pressure[30d]))
  #   ratio >= current ratio * peak / 0.50
  # On 2026-08-20: 0.08 * 0.0542 / 0.50 = 0.0087, rounded up to 0.01.
  # Recalculate when the 30-day peak crosses 0.50 or cluster traffic changes.
  mapDynamicSizeRatio: 0.01
bpfClockProbe: true
enableIPv4BIGTCP: true
enableIPv4Masquerade: true
cluster:
  name: ankhmorpork
cni:
  uninstall: false
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
    - 10.42.0.0/16
# k3s loopback apiserver LB. 6444, not 6443 -- agents have no 6443 on loopback.
k8sServiceHost: 127.0.0.1
k8sServicePort: 6444
kubeProxyReplacement: true
priorityClassName: system-node-critical
policyEnforcementMode: never

routingMode: native
ipv4NativeRoutingCIDR: 192.168.50.0/24
autoDirectNodeRoutes: true

securityContext:
  capabilities:
    ciliumAgent:
      # Defaults redefined due to how helm merges lists
      - "CHOWN"
      - "KILL"
      - "NET_ADMIN"
      - "NET_RAW"
      - "IPC_LOCK"
      - "SYS_MODULE"
      - "SYS_ADMIN"
      - "SYS_RESOURCE"
      - "DAC_OVERRIDE"
      - "FOWNER"
      - "SETGID"
      - "SETUID"
      # Added to allow BGP peering on port 179
      - "CAP_NET_BIND_SERVICE"

bgpControlPlane:
  enabled: true

rollOutCiliumPods: true
loadBalancer:
  # FIXME: enable 'dsr' after testing using annotation based SVCs - https://docs.cilium.io/en/stable/network/kubernetes/kubeproxy-free/#annotation-based-dsr-and-snat-mode
  mode: snat
  dsrDispatch: opt
  algorithm: maglev

#l2announcements:
#  enabled: true
#  leaseDuration: 60s
#  leaseRenewDeadline: 3s

#k8sClientRateLimit:
#  qps: 2
#  burst: 6

#ipMasqAgent:
#  enabled: true

operator:
  replicas: 1
  priorityClassName: system-cluster-critical
  unmanagedPodWatcher:
    restart: false
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

hubble:
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp
      - http
    serviceMonitor:
      enabled: true
