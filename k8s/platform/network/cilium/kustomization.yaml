apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-network
resources:
  - repository.yaml
  - release.yaml
  - additional/
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: values-cilium
    files:
      - values.yaml=values.yaml
