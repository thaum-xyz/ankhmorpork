apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The namespace is created and owned by base/cnpg-system.
namespace: cnpg-system
resources:
  - repository.yaml
  - release.yaml
  - credentials-secret.yaml
  - job.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: versity-values
    files:
      - values.yaml=values.yaml
