---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: barman
  namespace: platform-storage
spec:
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.7.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: platform-storage
      interval: 5m
  interval: 5m
  timeout: 20m
  install:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: values-barman
