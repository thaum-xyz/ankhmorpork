apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: versitygw
spec:
  chart:
    spec:
      chart: versitygw
      version: "0.3.5"
      sourceRef:
        kind: HelmRepository
        name: versity
      interval: 15m
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: values-versitygw
