apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system
resources:
  - repository.yaml
  - namespace.yaml
  - release.yaml
  - prometheusrule.yaml
  - sc-low-repl.yaml
  - recurring-job-backup.yaml
  - middleware.yaml
  - oidc-secret.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: values-longhorn
    files:
      - values.yaml=values.yaml
