# Config reference: https://github.com/longhorn/longhorn/tree/master/chart

persistence:
  defaultClass: false
  defaultFsType: xfs
  defaultDataLocality: best-effort
  migratable: true

defaultSettings:
  defaultDataPath: "/var/lib/rancher/longhorn"
  snapshotDataIntegrity: "fast-check"
  upgradeChecker: false
  concurrentAutomaticEngineUpgradePerNodeLimit: "3"
  systemManagedCSIComponentsResourceLimits: >-
    {"csi-attacher":{"requests":{"cpu":"10m","memory":"80Mi"}},"csi-provisioner":{"requests":{"cpu":"10m","memory":"80Mi"}},"csi-resizer":{"requests":{"cpu":"10m","memory":"80Mi"}},"csi-snapshotter":{"requests":{"cpu":"10m","memory":"80Mi"}},"longhorn-csi-plugin":{"requests":{"cpu":"10m","memory":"96Mi"}},"node-driver-registrar":{"requests":{"cpu":"10m","memory":"32Mi"}},"longhorn-liveness-probe":{"requests":{"cpu":"10m","memory":"32Mi"}}}

# Keep the live default target reproducible. The credentials Secret is generated
# alongside the in-cluster Versity gateway and contains both the gateway and
# Longhorn key names.
defaultBackupStore:
  backupTarget: "s3://longhorn@us-east-1/"
  backupTargetCredentialSecret: versitygw-credentials
  pollInterval: 300

longhornUI:
  replicas: 1

longhornManager:
  priorityClass: "system-node-critical"
  resources:
    requests:
      cpu: 110m
      memory: 656Mi

longhornDriver:
  priorityClass: "system-node-critical"

longhornConversionWebhook:
  replicas: 1

longhornAdmissionWebhook:
  replicas: 1

longhornRecoveryBackend:
  replicas: 1

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
    traefik.ingress.kubernetes.io/router.middlewares: longhorn-system-oidc@kubernetescrd
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
  ingressClassName: private
  tls: true
  tlsSecret: "longhorn-ui-tls"
  host: "longhorn.ankhmorpork.thaum.xyz"

metrics:
  serviceMonitor:
    enabled: true
