apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-versity-gw
spec:
  # Its claim is unifi-nas, so the provisioner has to exist before the chart's
  # PVC is admitted -- csi-nfs also ships mutate-nfs-pvc-alert-exclusion, which
  # is failurePolicy: Fail on PVC CREATE for that storage class. This was a
  # Kustomization-level dependsOn while each component had its own.
  dependsOn:
    - name: csi-nfs
  chart:
    spec:
      chart: versitygw
      version: "0.3.5"
      sourceRef:
        kind: HelmRepository
        name: versity
      interval: 15m
  interval: 5m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: values-cnpg-versity-gw
