# Config reference: https://github.com/piraeusdatastore/helm-charts/blob/main/charts/linstor-cluster/values.yaml

linstorCluster:
  # nodeAffinity alone decides where Piraeus runs. The operator applies it to
  # the satellite, CSI node plugin and HA controller DaemonSets and to the
  # controller Deployments alike, and a node it excludes also cannot run a Pod
  # that mounts a Piraeus volume.
  #
  # There was a `nodeSelector: linstor: "true"` here as well, hand-applied to
  # three nodes and defined nowhere. Both expressions below are discovered, so
  # a new node with a thin pool joins the cluster correctly labelled or not at
  # all -- nothing to remember.
  nodeAffinity:
    nodeSelectorTerms:
      # Expressions inside one term are ANDed; a second term would be an OR.
      - matchExpressions:
          # Only nodes with one of the existing TopoLVM thin pools can host a
          # local replica. This also prevents Piraeus volumes from scheduling
          # onto a node where the CSI node and LINSTOR satellite are absent.
          - key: devices.topolvm.io/vg
            operator: In
            values:
              - secondary-vg
              - ubuntu-vg
          # The constraint itself, discovered rather than hardcoded: true means
          # the kernel rejects unsigned out-of-tree modules, which is what stops
          # DRBD from loading. Written by the module-signing-labeler DaemonSet,
          # see docs/reference/annotations.md.
          #
          # NotIn, never In [false]: NotIn also matches a node carrying no such
          # label, so a labeler that has not run yet -- or has broken -- cannot
          # deschedule a satellite and take its replicas offline. The cost of
          # that direction is that a node with Secure Boot on gets a satellite
          # that cannot load DRBD until discovery catches up.
          - key: feature.node.kubernetes.io/module-signing-enforced
            operator: NotIn
            values:
              - "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  maxConcurrentEvacuations: 1

  controller:
    enabled: true
  csiController:
    enabled: true
    replicas: 1
  csiNode:
    enabled: true
  highAvailabilityController:
    enabled: true
  affinityController:
    enabled: true
    replicas: 1
  # RWX remains provided by the existing NFS CSI deployment.
  nfsServer:
    enabled: false

  # Piraeus creates these workloads from the LinstorCluster CR rather than the
  # Helm chart, so set requests with operator patches. Values are deliberately
  # requests-only until real cluster usage is available in Prometheus.
  patches:
    - target:
        kind: Deployment
        name: linstor-controller
      patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: linstor-controller
        spec:
          template:
            spec:
              initContainers:
                - name: run-migration
                  resources:
                    requests:
                      cpu: 50m
                      memory: 512Mi
              containers:
                - name: linstor-controller
                  resources:
                    requests:
                      cpu: 100m
                      memory: 512Mi
    - target:
        kind: Deployment
        name: linstor-csi-controller
      patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: linstor-csi-controller
        spec:
          template:
            spec:
              initContainers:
                - name: linstor-wait-api-online
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
              containers:
                - name: linstor-csi
                  resources:
                    requests:
                      cpu: 20m
                      memory: 64Mi
                - name: csi-attacher
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
                - name: csi-livenessprobe
                  resources:
                    requests:
                      cpu: 5m
                      memory: 16Mi
                - name: csi-provisioner
                  resources:
                    requests:
                      cpu: 20m
                      memory: 64Mi
                - name: csi-snapshotter
                  resources:
                    requests:
                      cpu: 10m
                      memory: 48Mi
                - name: csi-resizer
                  resources:
                    requests:
                      cpu: 10m
                      memory: 48Mi
                - name: csi-health-monitor
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
    - target:
        kind: DaemonSet
        name: linstor-csi-node
      patch: |-
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: linstor-csi-node
        spec:
          template:
            spec:
              initContainers:
                - name: linstor-wait-node-online
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
              containers:
                - name: linstor-csi
                  resources:
                    requests:
                      cpu: 20m
                      memory: 64Mi
                - name: csi-node-driver-registrar
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
                - name: csi-livenessprobe
                  resources:
                    requests:
                      cpu: 5m
                      memory: 16Mi
    - target:
        kind: DaemonSet
        name: ha-controller
      patch: |-
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: ha-controller
        spec:
          template:
            spec:
              containers:
                - name: ha-controller
                  resources:
                    requests:
                      cpu: 20m
                      memory: 64Mi
    - target:
        kind: Deployment
        name: linstor-affinity-controller
      patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: linstor-affinity-controller
        spec:
          template:
            spec:
              containers:
                - name: linstor-affinity-controller
                  resources:
                    requests:
                      cpu: 20m
                      memory: 64Mi

linstorSatelliteConfigurations:
  - name: common
    deletionPolicy: Evacuate
    # Import the NFD label into LINSTOR's topology namespace. Anything under
    # Aux/topology/ is stripped of that prefix and reported by the driver as a
    # CSI topology key (linstor-csi GetNodeTopologies), which is how it reaches
    # a PV's nodeAffinity through allowRemoteVolumeAccess below.
    #
    # This key rather than linbit.com/hostname because fromSame freezes the
    # placing node's *value* into the PV, so the key has to carry the same value
    # on every eligible node. hostname is unique per node, which would pin each
    # volume to one machine.
    #
    # optional: a node with no such label gets no property, rather than an empty
    # one.
    properties:
      - name: Aux/topology/feature.node.kubernetes.io/module-signing-enforced
        valueFrom:
          nodeFieldRef: metadata.labels['feature.node.kubernetes.io/module-signing-enforced']
        optional: true
    podTemplate:
      spec:
        # DRBD replication should use the node network directly instead of the
        # Cilium overlay. The satellite owns the DRBD network namespace.
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        initContainers:
          - name: drbd-module-loader
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
          - name: drbd-shutdown-guard
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
          - name: setup-lvm-configuration
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
        containers:
          - name: linstor-satellite
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
          - name: drbd-reactor
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
  - name: secondary-vg
    nodeSelector:
      devices.topolvm.io/vg: secondary-vg
    storagePools:
      - name: temporary-topolvm
        lvmThinPool:
          volumeGroup: secondary-vg
          thinPool: thin-pool0
  - name: ubuntu-vg
    nodeSelector:
      devices.topolvm.io/vg: ubuntu-vg
    storagePools:
      - name: temporary-topolvm
        lvmThinPool:
          volumeGroup: ubuntu-vg
          thinPool: thin-pool0

storageClasses:
  - name: piraeus-r2
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: WaitForFirstConsumer
    parameters:
      csi.storage.k8s.io/fstype: xfs
      linstor.csi.linbit.com/autoPlace: "2"
      linstor.csi.linbit.com/storagePool: temporary-topolvm
      # Keep application I/O local to one of the two diskful replicas. The
      # affinity controller updates PV affinity if LINSTOR moves a replica.
      linstor.csi.linbit.com/allowRemoteVolumeAccess: "false"
      # DRBD writes activity-log metadata synchronously whenever a write lands in
      # an extent it is not already tracking. The default 1237 extents cover
      # ~4.8GiB, so a random write workload over a larger volume thrashes the AL
      # and pays a metadata write on nearly every miss. 6433 is the maximum and
      # covers ~25GiB.
      #
      # Measured 2026-09-03 on beelink01/beelink02/master02, 8GiB working set:
      # random write IOPS 3833/3751/7491 -> 11800/11500/24100 (3.1-3.2x), QD1
      # write latency -35%/-34%/-46%, durable commits +19-28%. Reads unchanged,
      # which is expected -- the activity log only gates writes. Neither option
      # trades away durability.
      property.linstor.csi.linbit.com/DrbdOptions/Disk/al-extents: "6433"
      property.linstor.csi.linbit.com/DrbdOptions/Net/max-buffers: "8000"
  # Same two replicas, but Pods are not pinned to them: a Pod may schedule onto
  # any satellite node and attach diskless, and auto-diskful then converts that
  # attachment into a local replica and drops the surplus one. I/O is remote
  # until the conversion completes, hence the size cap enforced by the
  # validate-roaming-volume-size policy.
  - name: piraeus-r2-roaming
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: WaitForFirstConsumer
    parameters:
      csi.storage.k8s.io/fstype: xfs
      linstor.csi.linbit.com/autoPlace: "2"
      linstor.csi.linbit.com/storagePool: temporary-topolvm
      # "true" means accessible from anywhere, which is why every roaming PV
      # created before this carries no nodeAffinity at all -- and why a Pod could
      # be scheduled onto master01 and then wait forever on "CSINode master01
      # does not contain driver linstor.csi.linbit.com".
      #
      # fromSame narrows "anywhere" to "nodes whose module-signing-enforced value
      # matches the placing node's", i.e. false -- so a new volume's PV carries
      # nodeAffinity the scheduler enforces, and master01 (true) is refused
      # before the Pod is placed rather than after.
      #
      # Verified on a scratch class 2026-09-07: PV came out with
      # `module-signing-enforced In [false]`, and a Pod pinned to master01 stayed
      # Pending with "didn't match PersistentVolume's node affinity".
      #
      # Only applies to volumes created from here on. PV nodeAffinity is
      # immutable, so the 13 roaming volumes that predate this keep none.
      linstor.csi.linbit.com/allowRemoteVolumeAccess: |
        - fromSame:
            - feature.node.kubernetes.io/module-signing-enforced
      property.linstor.csi.linbit.com/DrbdOptions/auto-diskful: "5"
      # DRBD writes activity-log metadata synchronously whenever a write lands in
      # an extent it is not already tracking. The default 1237 extents cover
      # ~4.8GiB, so a random write workload over a larger volume thrashes the AL
      # and pays a metadata write on nearly every miss. 6433 is the maximum and
      # covers ~25GiB.
      #
      # Measured 2026-09-03 on beelink01/beelink02/master02, 8GiB working set:
      # random write IOPS 3833/3751/7491 -> 11800/11500/24100 (3.1-3.2x), QD1
      # write latency -35%/-34%/-46%, durable commits +19-28%. Reads unchanged,
      # which is expected -- the activity log only gates writes. Neither option
      # trades away durability.
      property.linstor.csi.linbit.com/DrbdOptions/Disk/al-extents: "6433"
      property.linstor.csi.linbit.com/DrbdOptions/Net/max-buffers: "8000"

volumeSnapshotClasses:
  - name: piraeus
    driver: linstor.csi.linbit.com
    deletionPolicy: Delete
    parameters:
      snap.linstor.csi.linbit.com/type: InCluster

monitoring:
  enabled: true
  dashboard:
    enabled: true

ingress:
  enabled: false
