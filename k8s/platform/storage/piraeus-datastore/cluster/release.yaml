apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linstor-cluster
spec:
  dependsOn:
    - name: piraeus-operator
  chart:
    spec:
      chart: linstor-cluster
      version: "1.2.0"
      sourceRef:
        kind: HelmRepository
        name: piraeus-charts
        namespace: platform-storage
      interval: 5m
  interval: 5m
  timeout: 20m
  install:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
  postRenderers:
    - kustomize:
        patches:
          # The upstream chart uses "warn", while this cluster's Alertmanager
          # routes and inhibition rules use the conventional "warning" value.
          - target:
              group: monitoring.coreos.com
              version: v1
              kind: PrometheusRule
              name: piraeus-datastore
            patch: |-
              - op: replace
                path: /spec/groups/0/rules/5/labels/severity
                value: warning
              - op: replace
                path: /spec/groups/1/rules/1/labels/severity
                value: warning
              - op: replace
                path: /spec/groups/1/rules/2/labels/severity
                value: warning
              - op: replace
                path: /spec/groups/1/rules/3/labels/severity
                value: warning
              - op: replace
                path: /spec/groups/1/rules/4/labels/severity
                value: warning
              - op: replace
                path: /spec/groups/1/rules/5/labels/severity
                value: warning
              - op: replace
                path: /spec/groups/1/rules/6/labels/severity
                value: warning
          # These three critical rules ship with no `for` at all, so a single
          # failed scrape pages Opsgenie at P2. A kured reboot does exactly that:
          # on 2026-09-09 beelink01 (07:11) and beelink02 (08:16) each produced
          # drbdReactorOffline and linstorSatelliteNotOnline, 30-75s apiece.
          #
          # 10m is >3x the worst transient measured over the preceding 30 days —
          # every firing of all three in that window was a reboot or a pod
          # restart, and the longest ran 180s (master02, 2026-09-07 09:05).
          #
          # This costs no coverage on a node that stays down. Both satellite
          # rules key on `up{job="platform-storage/linstor-satellite"}`, and a
          # node that is gone takes its target out of service discovery — the
          # series goes absent rather than reporting 0, so neither alert can fire
          # for a full outage today either. KubeNodeNotReady/KubeNodeUnreachable
          # is what covers that, and it is untouched. What still pages is the
          # case these rules are actually for: a satellite or drbd-reactor that
          # is scrapable and broken, holding the condition continuously.
          - target:
              group: monitoring.coreos.com
              version: v1
              kind: PrometheusRule
              name: piraeus-datastore
            patch: |-
              - op: add
                path: /spec/groups/0/rules/0/for
                value: 10m
              - op: add
                path: /spec/groups/0/rules/3/for
                value: 10m
              - op: add
                path: /spec/groups/1/rules/0/for
                value: 10m
          # allowedTopologies has to be patched in: the chart's storageclass.yaml
          # renders name, annotations, labels, provisioner, reclaimPolicy,
          # volumeBindingMode, allowVolumeExpansion and parameters, and nothing
          # else. Setting it in values.yaml reads as configuration and is
          # silently inert.
          #
          # What it buys, with WaitForFirstConsumer: the scheduler will not place
          # a Pod holding an unbound claim of these classes on a node outside the
          # list, so a new volume is steered to a node that can serve it instead
          # of the claim sitting Pending forever because the selected node has no
          # linstor entry in its CSINode.
          #
          # What it does not buy: anything for an already-bound volume.
          # piraeus-r2-roaming PVs carry no node affinity by design, so their
          # consumers still need their own `linbit.com/hostname` affinity for
          # every reschedule after the first.
          #
          # Hostnames rather than a label test, because a
          # TopologySelectorLabelRequirement takes a key and a list of values --
          # there is no Exists. Keep this in step with the nodes carrying
          # linbit.com/hostname; one missing here is never provisioned onto,
          # which is degraded rather than broken. The field is mutable, so a
          # change here is an ordinary upgrade and not the delete-and-recreate
          # dance the immutable StorageClass fields need.
          - target:
              group: storage.k8s.io
              version: v1
              kind: StorageClass
              name: piraeus-r2.*
            patch: |-
              - op: add
                path: /allowedTopologies
                value:
                  - matchLabelExpressions:
                      - key: linbit.com/hostname
                        values:
                          - beelink01
                          - beelink02
                          - master02
  valuesFrom:
    - kind: ConfigMap
      name: values-linstor-cluster
