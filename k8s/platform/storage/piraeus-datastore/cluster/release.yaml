apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linstor-cluster
spec:
  dependsOn:
    - name: piraeus-operator
  chart:
    spec:
      chart: linstor-cluster
      version: "1.2.0"
      sourceRef:
        kind: HelmRepository
        name: piraeus-charts
        namespace: platform-storage
      interval: 5m
  interval: 5m
  timeout: 20m
  install:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
  postRenderers:
    - kustomize:
        patches:
          # The upstream chart uses "warn", while this cluster's Alertmanager
          # routes and inhibition rules use the conventional "warning" value.
          - target:
              group: monitoring.coreos.com
              version: v1
              kind: PrometheusRule
              name: piraeus-datastore
            patch: |-
              - op: replace
                path: /spec/groups/0/rules/5/labels/severity
                value: warning
              - op: replace
                path: /spec/groups/1/rules/1/labels/severity
                value: warning
              - op: replace
                path: /spec/groups/1/rules/2/labels/severity
                value: warning
              - op: replace
                path: /spec/groups/1/rules/3/labels/severity
                value: warning
              - op: replace
                path: /spec/groups/1/rules/4/labels/severity
                value: warning
              - op: replace
                path: /spec/groups/1/rules/5/labels/severity
                value: warning
              - op: replace
                path: /spec/groups/1/rules/6/labels/severity
                value: warning
  valuesFrom:
    - kind: ConfigMap
      name: values-linstor-cluster
