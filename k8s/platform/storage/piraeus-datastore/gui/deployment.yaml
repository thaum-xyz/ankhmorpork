apiVersion: apps/v1
kind: Deployment
metadata:
  name: linstor-gui
  labels:
    app.kubernetes.io/name: linstor-gui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: linstor-gui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linstor-gui
    spec:
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-gui
          image: docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command:
            - /bin/sh
            - -ec
          args:
            - |-
              wget -O /tmp/linstor-gui.tar.gz https://github.com/LINBIT/linstor-gui/releases/download/v1.8.2/linstor-gui-v1.8.2.tar.gz
              echo "f2c3e53ca1761f5d68f2deaedcdfb6451a6951382c5c2c005cb56a801e3e4856  /tmp/linstor-gui.tar.gz" | sha256sum -c -
              tar -xzf /tmp/linstor-gui.tar.gz -C /usr/share/nginx/html --strip-components=1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: tmp
              mountPath: /tmp
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.29.1-alpine@sha256:27985295bdb22a1ef8f712863210bd5877c0f3006494a593e86b3fe0fa55467e
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: html
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: linstor-gui-nginx
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
