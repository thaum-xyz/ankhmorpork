apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linstor-gui
  # piraeus-server bundles the linstor-gui package; the controller serves it at /ui/.
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
spec:
  ingressClassName: private
  rules:
    - host: piraeus.ankhmorpork.thaum.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linstor-controller
                port:
                  name: api
  tls:
    - hosts:
        - piraeus.ankhmorpork.thaum.xyz
      secretName: piraeus-ui-tls
