apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piraeus-operator
  annotations:
    # Never prune this object. Pruning a HelmRelease uninstalls the release
    # behind it, and this operator is what reconciles the LINSTOR cluster that
    # serves every roaming PV.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # The storage pool this operator manages IS a topolvm thin pool, so the CSI
  # driver has to be up first. This was a Kustomization-level dependsOn while
  # each component had its own; inside one platform-storage Kustomization the
  # ordering has to be between the releases, which helm-controller allows
  # because both are in this namespace.
  dependsOn:
    - name: topolvm
  chart:
    spec:
      chart: piraeus
      version: "2.11.0"
      sourceRef:
        kind: HelmRepository
        name: piraeus-operator
        namespace: platform-storage
      interval: 5m
  interval: 5m
  timeout: 10m
  install:
    timeout: 10m
    disableWait: false
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    disableWait: false
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: values-piraeus-operator
