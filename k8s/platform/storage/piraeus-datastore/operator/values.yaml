# Config reference: https://github.com/piraeusdatastore/piraeus-operator/blob/v2/charts/piraeus/values.yaml

installCRDs: true

operator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi

priorityClassName: system-cluster-critical

nodeSelector:
  linstor: "true"

# Same exclusion as linstorCluster.nodeAffinity in ../cluster/values.yaml: the
# operator itself needs no DRBD, but nothing of Piraeus should land on a node
# whose kernel rejects unsigned modules. The by-name guard is kept alongside the
# discovered one until the label has been seen on every node.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: feature.node.kubernetes.io/module-signing-enforced
              operator: NotIn
              values:
                - "true"
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - master01

# A single operator replica does not benefit from a PDB and minAvailable: 1
# would prevent voluntary eviction during a node drain.
podDisruptionBudget:
  enabled: false
