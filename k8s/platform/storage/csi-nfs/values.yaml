# Config reference: https://github.com/kubernetes-csi/csi-driver-nfs/tree/master/charts

controller:
  runOnControlPlane: true

node:
  livenessProbe:
    healthPort: 29651

# kubelet leaves ownership alone on these volumes. The chart defaults to File,
# under which a pod with an fsGroup has every file of its volume chown'd and
# chmod'd before any container starts, on every start: fourteen minutes for the
# million files behind Loki on 2026-11-10, longer than a Helm timeout (#1709).
# fsGroupChangePolicy: OnRootMismatch does not shorten it, because the root of
# a volume here never matches.
#
# Nothing is lost. The UNAS squashes every client to 977:988 -- root on a node
# reads a 0600 file a uid 1000 pod wrote, measured the same day -- so mode bits
# deny nothing on the server; and it refuses chown, so the group the walk asks
# for never lands. A program that judges access from stat() rather than by
# trying sees itself as "other" with the walk or without it.
#
# None rather than enableFSGroupPolicy: false. That leaves the field to the API
# default, ReadWriteOnceWithFSType, which still walks an RWO volume that names
# an fsType.
feature:
  fsGroupPolicy: None

storageClass:
  create: true
  name: unifi-nas
  parameters:
    server: 192.168.40.10
    share: /var/nfs/shared/k8snfscsi
    subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}-${pv.metadata.name}
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  mountOptions:
    - nfsvers=3
    - nolock
    # One NFS mount is one TCP connection, and LACP hashes a flow onto a single
    # physical link -- so beelink01/beelink02's 2Gbps bond0 delivered exactly the
    # same 106 MiB/s as master02's single 1GbE. Measured 2026-09-03: sequential
    # read 106 MiB/s on beelink01 and 104 MiB/s on master02, both ~89% of one
    # 1GbE link, while the bond members carried a 7:1 traffic split.
    #
    # nconnect opens 4 TCP connections per mount so the hash can spread them
    # across both bond members. Jumbo frames were the other option and are ruled
    # out by Tailscale's MTU.
    - nconnect=4
    # Cuts atime write-back on a share that holds backups and versitygw object
    # data -- nothing here reads atime.
    - noatime
