apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-storage
resources:
  - repository.yaml
  - release.yaml
  - prometheusrules.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: values-topolvm
    files:
      - values.yaml=values.yaml
