# Config reference: https://github.com/topolvm/topolvm/blob/main/charts/topolvm/values.yaml

scheduler:
  enabled: false

lvmd:
  # lvmd.managed -- If true, set up lvmd service with DaemonSet.
  managed: true
  deviceClasses: []
  nodeSelector:
    devices.topolvm.io/vg: main-vg
  additionalConfigs:
    - tolerations: []
      nodeSelector:
        devices.topolvm.io/vg: secondary-vg
      deviceClasses:
      - name: thin
        volume-group: secondary-vg
        spare-gb: 1
        type: thin
        thin-pool:
          name: thin-pool0
          overprovision-ratio: 20.0
    - tolerations: []
      nodeSelector:
        devices.topolvm.io/vg: ubuntu-vg
      deviceClasses:
      - name: thin
        volume-group: ubuntu-vg
        spare-gb: 1
        type: thin
        thin-pool:
          name: thin-pool0
          overprovision-ratio: 20.0

node:
  lvmdEmbedded: false
  metrics:
    enabled: true
  prometheus:
    podMonitor:
      enabled: true
      #relabelings:
      #- action: replace
      #  sourceLabels:
      #  - __meta_kubernetes_pod_node_name
      #  targetLabel: node
  priorityClassName: system-node-critical

controller:
  storageCapacityTracking:
    enabled: true
  prometheus:
    podMonitor:
      enabled: true
  priorityClassName: system-cluster-critical
  affinity: |
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists

storageClasses:
  #- name: lvm-main
  #  storageClass:
  #    fsType: xfs
  #    reclaimPolicy: Delete
  #    annotations: {}
  #    isDefaultClass: false
  #    volumeBindingMode: WaitForFirstConsumer
  #    allowVolumeExpansion: true
  #    additionalParameters:
  #      "topolvm.io/device-class": "main"
  - name: lvm-thin
    storageClass:
      fsType: xfs
      reclaimPolicy: Delete
      annotations: {}
      isDefaultClass: false
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
      additionalParameters:
        "topolvm.io/device-class": "thin"
      mountOptions:
        - discard
        - noatime
        - nodiratime

webhook:
  podMutatingWebhook:
    enabled: false

cert-manager:
  enabled: false

priorityClass:
  enabled: false

resources:
  topolvm_node:
    requests:
      cpu: 10m
      memory: 80Mi
  csi_registrar:
    requests:
      cpu: 10m
      memory: 32Mi
  liveness_probe:
    requests:
      cpu: 10m
      memory: 32Mi
  topolvm_controller:
    requests:
      cpu: 10m
      memory: 48Mi
  csi_provisioner:
    requests:
      cpu: 10m
      memory: 96Mi
  csi_resizer:
    requests:
      cpu: 10m
      memory: 96Mi
  csi_snapshotter:
    requests:
      cpu: 10m
      memory: 80Mi
  # The chart applies one resource block to every lvmd DaemonSet. Size all
  # variants for the busier main-vg nodes.
  lvmd:
    requests:
      cpu: 30m
      memory: 80Mi
