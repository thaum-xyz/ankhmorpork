---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: topolvm
  namespace: platform-storage
  annotations:
    # Never prune this object. Pruning a HelmRelease uninstalls the release
    # behind it, and this one is the CSI driver backing every lvm-thin PV on
    # the cluster. The chart's own CRDs carry helm.sh/resource-policy: keep,
    # so the LogicalVolumes would survive an uninstall with nothing able to
    # act on them.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  chart:
    spec:
      chart: topolvm
      version: "17.2.0"
      sourceRef:
        kind: HelmRepository
        name: topolvm
        namespace: platform-storage
      interval: 5m
  interval: 5m
  timeout: 20m
  install:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    disableWait: false
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: values-topolvm
