apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smartctl-exporter
spec:
  chart:
    spec:
      chart: prometheus-smartctl-exporter
      version: "0.17.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 5m
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: values-smartctl-exporter
