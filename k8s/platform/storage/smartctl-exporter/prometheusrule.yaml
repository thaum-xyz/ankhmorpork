apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: smartctl-exporter
  name: smartctl-exporter
spec:
  groups:
    - name: smartctl.rules
      rules:
        - alert: SmartDeviceFailing
          annotations:
            description: smartctl reports device {{ $labels.device }} on {{ $labels.node }} as failed. Replace the disk.
            summary: Disk has failed its SMART self-assessment
          expr: smartctl_device_smart_status{job="smartctl-exporter"} == 0
          for: 15m
          labels:
            severity: critical

        # On a count rather than a nonzero value: a disk carrying a handful of
        # errors from years ago is not news, one accumulating them now is.
        - alert: SmartDeviceMediaErrors
          annotations:
            description: Device {{ $labels.device }} on {{ $labels.node }} logged {{ $value | printf "%.0f" }} new media errors in the last hour.
            summary: Disk is accumulating media errors
          expr: increase(smartctl_device_media_errors{job="smartctl-exporter"}[1h]) > 0
          for: 5m
          labels:
            severity: critical

        - alert: SmartDeviceCriticalWarning
          annotations:
            description: NVMe device {{ $labels.device }} on {{ $labels.node }} is raising controller critical warnings.
            summary: NVMe controller reports a critical warning
          expr: smartctl_device_critical_warning{job="smartctl-exporter"} > 0
          for: 15m
          labels:
            severity: critical

        - alert: SmartDeviceSpareLow
          annotations:
            description: Device {{ $labels.device }} on {{ $labels.node }} has dropped below its own spare-block threshold. It is running out of blocks to remap onto.
            summary: Disk is below its available spare threshold
          expr: smartctl_device_available_spare{job="smartctl-exporter"} < smartctl_device_available_spare_threshold{job="smartctl-exporter"}
          for: 1h
          labels:
            severity: warning

        - alert: SmartDeviceWearHigh
          annotations:
            description: Device {{ $labels.device }} on {{ $labels.node }} has consumed {{ $value | printf "%.0f" }}% of its rated write endurance. Plan a replacement.
            summary: Disk write endurance is nearly used up
          expr: smartctl_device_percentage_used{job="smartctl-exporter"} >= 90
          for: 1h
          labels:
            severity: warning

        - alert: SmartDeviceTemperatureHigh
          annotations:
            description: Device {{ $labels.device }} on {{ $labels.node }} has been at {{ $value | printf "%.0f" }}°C for 30m.
            summary: Disk is running hot
          expr: smartctl_device_temperature{job="smartctl-exporter", temperature_type="current"} > 65
          for: 30m
          labels:
            severity: warning

        # smartctl's exit code is a bitmask. Bits 0-2 mean it could not talk to
        # the device at all (parse error, open failed, SMART command failed);
        # bits 3-7 are real SMART conditions the alerts above already cover, and
        # include benign history like "an attribute was once below threshold".
        # Masking to the low three bits alerts only on the blind spot, which is
        # the failure mode that hid smartmon.sh being broken on three of four
        # nodes for years.
        - alert: SmartDeviceUnreadable
          annotations:
            description: smartctl cannot read SMART data from device {{ $labels.device }} on {{ $labels.node }}, so that disk is unmonitored.
            summary: Disk SMART data is unreadable
          expr: smartctl_device_smartctl_exit_status{job="smartctl-exporter"} % 8 > 0
          for: 1h
          labels:
            severity: warning
