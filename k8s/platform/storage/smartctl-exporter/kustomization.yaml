apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The namespace itself lives in k8s/namespaces/ rather than with any one
# component: platform-storage is shared, so no single occupant owns it.
namespace: platform-storage
resources:
  - repository.yaml
  - release.yaml
configMapGenerator:
  - name: values-smartctl-exporter
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
