apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: external-probe-success
spec:
  # Endpoints this cluster watches but does not run: registry.avsystem.com
  # (cluster=avs, somebody else's entirely) and zmc.krupa.net.pl
  # (cluster=lancre, yours but at another site). Neither is something an
  # operator here can commit to, which is the whole reason they are not in the
  # objective next door.
  #
  # Selecting on cluster rather than naming the two hosts, so a new external
  # probe joins this SLO by default rather than silently inflating the one for
  # services we actually serve.
  #
  # cluster!="" is load-bearing, not belt-and-braces. A negative matcher
  # alone fails open: it matches series that carry no cluster label at all,
  # and every probe series written before #1326 added that label is one of
  # those. They stop being written but stay inside the 7d lookback, so this SLO
  # was computing over 20 series -- the 2 real ones and 18 stale internal ones,
  # dragging keep's achieved figure to 97.5% under an objective that should
  # never have seen it. Requiring the label present keeps the "joins by default"
  # property and excludes anything unlabelled.
  #
  # The label was called environment until it was renamed to cluster, the name
  # Prometheus' own externalLabels use. Series written under the old name carry
  # no cluster label, so the same matcher drops them and the 7d window started
  # again from the rename.
  #
  # target from the 7d window 2026-09-03..09-10 (#1379): 99.96030% achieved
  # across both endpoints, 14 failed samples, worst burst 3m00s, 4.0% of a 99%
  # budget. registry read 99.98512% and zmc 99.93053% taken separately.
  #
  # Not set looser than the objective next door in the end -- the data does
  # not support pretending these endpoints are unreliable. The fact that
  # nothing here can fix them belongs in the routing instead: every tier is
  # warning, where the other objectives page on the fast two. A third party's
  # outage files an issue and wakes nobody.
  description: >-
    Fraction of successful blackbox probes against endpoints outside this
    cluster.
  alerting:
    name: ExternalProbeBudgetBurn
    absentName: ExternalProbeMetricAbsent
    severities:
      fastBurn: warning
      mediumBurn: warning
      slowBurn: warning
      longTermBurn: warning
      absent: warning
  indicator:
    bool_gauge:
      # cluster is grouped on because the matchers below need it, not to
      # split anything: each instance has exactly one. Pyrra copies the
      # metric's matchers onto the burn-rate selectors of the alert, while the
      # burn-rate records keep only the labels named here -- so with instance
      # alone the alert asked for cluster!="" of series that had no such
      # label and could never fire (#1457). The per-app probe SLOs match on
      # instance, which the records do keep, and so never had this.
      grouping:
        - cluster
        - instance
      metric: probe_success{cluster!="ankhmorpork", cluster!=""}
  target: "99"
  window: 7d
