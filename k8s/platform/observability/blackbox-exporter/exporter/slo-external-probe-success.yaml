apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: external-probe-success
spec:
  # Endpoints this cluster watches but does not run: registry.avsystem.com
  # (environment=avs, somebody else's entirely) and zmc.krupa.net.pl
  # (environment=lancre, yours but at another site). Neither is something an
  # operator here can commit to, which is the whole reason they are not in the
  # objective next door.
  #
  # Selecting on environment rather than naming the two hosts, so a new external
  # probe joins this SLO by default rather than silently inflating the one for
  # services we actually serve.
  #
  # environment!="" is load-bearing, not belt-and-braces. A negative matcher
  # alone fails open: it matches series that carry no environment label at all,
  # and every probe series written before #1326 added that label is one of
  # those. They stop being written but stay inside the 7d lookback, so this SLO
  # was computing over 20 series -- the 2 real ones and 18 stale internal ones,
  # dragging keep's achieved figure to 97.5% under an objective that should
  # never have seen it. Requiring the label present keeps the "joins by default"
  # property and excludes anything unlabelled.
  #
  # target from the 7d window 2026-09-03..09-10 (#1379): 99.96030% achieved
  # across both endpoints, 14 failed samples, worst burst 3m00s, 4.0% of a 99%
  # budget. registry read 99.98512% and zmc 99.93053% taken separately.
  #
  # Not set looser than the objective next door in the end -- the data does
  # not support pretending these endpoints are unreliable. The fact that
  # nothing here can fix them belongs in the routing instead: when the burn
  # severities come off info/none, this objective should not be the one that
  # wakes somebody for a third party's outage.
  description: >-
    Fraction of successful blackbox probes against endpoints outside this
    cluster.
  alerting:
    name: ExternalProbeBudgetBurn
    absentName: ExternalProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      grouping:
        - instance
      metric: probe_success{environment!="ankhmorpork", environment!=""}
  target: "99"
  window: 7d
