apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: blackbox-probe-success
spec:
  alerting:
    name: ProbeBudgetBurn
    absentName: ProbeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    bool_gauge:
      grouping:
        - instance
      metric: probe_success
  target: "95.0"
  window: 7d
