apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-observability
resources:
  - repository.yaml
  - release.yaml
  - syslog-service.yaml
# Qualified because every component in this namespace would otherwise generate a
# ConfigMap called "values" and silently overwrite the others.
configMapGenerator:
  - name: values-alloy
    files:
      - values.yaml=values.yaml
