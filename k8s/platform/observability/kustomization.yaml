apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Every component the platform-observability Kustomization reconciles:
# collectors and exporters only. The stores they feed are apps, in their own
# namespaces.
#
# The prometheus-operator CRDs are not here. They are a layer below the whole
# platform, in k8s/crds/, so that everything under k8s/platform/<domain>/
# belongs to that domain without exception. This domain cannot declare that it
# waits for them -- only platform-cluster shares a namespace with that layer --
# so on a cold start an object whose kind is not established yet fails and
# retries; see docs/explanation/flux-layering.md.
#
# No `namespace:` at this level. Each component declares its own.
resources:
  - alloy/
  - blackbox-exporter/
  - kube-prometheus-stack/
  - uptimerobot/
# Hashes every generated values ConfigMap and rewrites the HelmRelease
# valuesFrom entry that names it, so a values edit changes the release spec and
# helm-controller upgrades on the event instead of noticing on its next
# interval. See k8s/kustomize/helmrelease-values/nameref.yaml.
components:
  - ../../kustomize/helmrelease-values
