apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
spec:
  chart:
    spec:
      chart: prometheus-operator-crds
      version: "31.0.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 5m
  interval: 5m
  timeout: 10m
  install:
    timeout: 10m
    # CreateReplace, not Create: Create would leave the older schemas in place.
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    crds: CreateReplace
    remediation:
      retries: 3
