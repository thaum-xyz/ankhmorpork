apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-observability
resources:
  - release.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: values-smartctl-exporter
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
