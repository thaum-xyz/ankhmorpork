# Holds no data in git: the token controller fills in `token` and `ca.crt` for
# the ServiceAccount the annotation names. The token does not expire, which is
# the price of a credential a ServiceMonitor can reference -- so the ClusterRole
# it is bound to grants metrics reads and nothing more. To rotate it, delete the
# Secret; Flux recreates it and the operator rewrites the scrape config.
apiVersion: v1
kind: Secret
metadata:
  name: control-plane-scraper-token
  annotations:
    kubernetes.io/service-account.name: control-plane-scraper
type: kubernetes.io/service-account-token
