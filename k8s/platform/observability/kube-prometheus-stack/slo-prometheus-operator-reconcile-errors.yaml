apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: prometheus-operator-reconcile-errors
spec:
  description: ""
  alerting:
    name: PrometheusOperatorReconcileBudgetBurn
    absentName: PrometheusOperatorReconcileMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    ratio:
      errors:
        metric: prometheus_operator_reconcile_errors_total{job="kube-prometheus-stack-operator"}
      grouping:
        - controller
      total:
        metric: prometheus_operator_reconcile_operations_total{job="kube-prometheus-stack-operator"}
  target: "95"
  window: 7d