apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: apiserver-write-response-errors
spec:
  # target from the 7d window 2026-09-03..09-10 (#1379): 99.99997% achieved
  # over 20.7M requests, 0.03% of a 99.9% budget.
  description: ""
  alerting:
    name: KubeAPIServerWriteErrorBudgetBurn
    absentName: KubeAPIServerWriteErrorMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    ratio:
      errors:
        metric: apiserver_request_total{component="apiserver",verb=~"POST|PUT|PATCH|DELETE",code=~"5.."}
      total:
        metric: apiserver_request_total{component="apiserver",verb=~"POST|PUT|PATCH|DELETE"}
  target: "99.9"
  window: 7d