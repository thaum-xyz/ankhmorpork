apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-observability
resources:
  - repository.yaml
  - release.yaml
  - prometheusrule-nodes.yaml
  - prometheusrule-workloads.yaml
  - slo-apiserver-read-cluster-latency.yaml
  - slo-apiserver-read-namespace-latency.yaml
  - slo-apiserver-read-resource-latency.yaml
  - slo-apiserver-read-response-errors.yaml
  - slo-apiserver-write-response-errors.yaml
  - slo-coredns-response-errors.yaml
  - slo-kubelet-request-errors.yaml
  - slo-kubelet-runtime-errors.yaml
  - slo-prometheus-operator-http-errors.yaml
  - slo-prometheus-operator-reconcile-errors.yaml
configMapGenerator:
  - name: values-kube-prometheus-stack
    files:
      - values.yaml=values.yaml
# Stable name so valuesFrom can reference it directly; no nameReference rewrite
# needed. Qualified because every component in this namespace would otherwise
# generate a ConfigMap called "values" and silently overwrite the others.
generatorOptions:
  disableNameSuffixHash: true
