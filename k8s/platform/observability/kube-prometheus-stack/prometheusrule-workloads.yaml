apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: kube-state-metrics
  name: kube-state-metrics-custom
spec:
  groups:
    - name: workload-custom.rules
      rules:
        # HighlyAvailableWorkloadIncorrectlySpread lived here until 2026-09-05.
        # It never once evaluated: kube_pod_spec_volumes_persistentvolumeclaims_info
        # emits one series per volume, so any Pod with two PVCs made the join
        # ambiguous and Prometheus errored with "many-to-many matching not
        # allowed" every evaluation. Deduping the right-hand side fixed the
        # query and showed why it should not come back -- it matched all eleven
        # CNPG clusters, which are spread across nodes on purpose. The OpenShift
        # original targets workloads sharing one RWO volume; nothing here is
        # shaped like that.
        - alert: MultipleContainersOOMKilled
          annotations:
            description: Multiple containers were out of memory killed within the past 15 minutes. There are many potential causes of OOM errors, however issues on a specific node or containers breaching their limits is common.
            summary: Containers are being killed due to OOM
          expr: |
            sum(
              max by(namespace, container, pod) (
                increase(kube_pod_container_status_restarts_total[12m])
              )
              and
              max by(namespace, container, pod) (
                kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}
              ) == 1
            ) > 2
          for: 15m
          labels:
            severity: info
    - name: kube-node-custom.rules
      rules:
        # A node cordoned for 45m is not one kured is mid-cycle on: a healthy
        # cordon -> drain -> reboot -> uncordon measured 25 min at the current
        # drainTimeout. So this means a manual cordon, or a drain that gave up,
        # and either way the cluster is already a node short.
        #
        # Not covered upstream -- the kubernetes-mixin ships KubeNodeNotReady,
        # KubeNodeUnreachable and KubeNodeReadinessFlapping, all of which key on
        # node *readiness*; a cordoned node stays Ready, so none of them fires.
        #
        # `severity: info` routes to the null receiver and opens no issue. That
        # is deliberate: this alert's consumer is kured, which refuses to cordon
        # while it is firing -- see `alertFilterRegexp` in
        # k8s/platform/cluster/system-kured/values.yaml. Renaming it there and
        # here has to happen together.
        - alert: NodeUnschedulable
          annotations:
            description: Node {{ $labels.node }} has been unschedulable for over 45m, so the cluster is effectively a node short. kured will not begin draining any other node until this clears.
            summary: Node has been cordoned for longer than a reboot cycle.
          expr: |
            kube_node_spec_unschedulable == 1
          for: 45m
          labels:
            severity: info
        # A node that is being drained and rebooted, or was until ten minutes
        # ago. It tells nobody anything: Alertmanager uses it to hold back the
        # workload alerts a drain causes, through the inhibit rule that names
        # it in k8s/apps/datalake-alerts/alertmanager/configmap-template.yaml.
        # `info` routes to the null receiver. kured does not read it.
        #
        # A Pod on node-local storage has nowhere else to run, so it is not
        # ready for exactly as long as its node is cordoned, and with it its
        # StatefulSet, its scrape target and whatever Flux is waiting on. On
        # 2026-11-11 those stood pending for 9 to 11.5 minutes of a ten-minute
        # `for` and three fifteen-minute ones, across cordons of 6 and 11
        # minutes. A healthy cycle has measured 25.
        #
        # The first half keeps this up for ten minutes after the uncordon,
        # because the Pods come back after the node does. The second half ends
        # it once the node has been cordoned for 55 minutes without a break:
        # by then NodeUnschedulable has been firing for ten, the cordon is not
        # a reboot, and what it broke should be heard. min, not max: a
        # kube-state-metrics that restarted during the drain has only ever
        # seen the node cordoned, and the series from before it has not.
        - alert: NodeMaintenance
          annotations:
            description: Node {{ $labels.node }} is cordoned or was within the last ten minutes. Alerts about workloads that cannot run while it is away are held back until this clears.
            summary: Node is being drained or rebooted.
          expr: |
            max by (node) (max_over_time(kube_node_spec_unschedulable[10m])) == 1
            and
            min by (node) (min_over_time(kube_node_spec_unschedulable[55m])) == 0
          labels:
            severity: info
