apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: control-plane-scraper
rules:
  # The kubelet authorizes /metrics, /metrics/cadvisor and /metrics/probes as
  # this one subresource.
  - apiGroups:
      - ""
    resources:
      - nodes/metrics
    verbs:
      - get
  # The apiserver's own /metrics.
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
