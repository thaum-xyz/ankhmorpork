apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: kubelet-request-errors
spec:
  # target from the 7d window 2026-09-03..09-10 (#1379): 99.99505% achieved
  # over 6.8M requests, 5.0% of a 99.9% budget.
  description: ""
  alerting:
    name: KubeletClientBudgetBurn
    absentName: KubeletClientMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    ratio:
      errors:
        metric: rest_client_requests_total{job="kubelet",code=~"5.."}
      total:
        metric: rest_client_requests_total{job="kubelet"}
  target: "99.9"
  window: 7d