apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: kubelet-runtime-errors
spec:
  # target from the 7d window 2026-09-03..09-10 (#1379): 99.99918% achieved
  # over 11.0M operations, 0.8% of a 99.9% budget.
  description: ""
  alerting:
    name: KubeletRuntimeBudgetBurn
    absentName: KubeletRuntimeMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      # kubelet only creates the errors counter on the first CRI failure, so it
      # is absent on a healthy cluster until one happens (~5/day here). A real
      # kubelet outage is caught by KubeletInstanceUnreachable and KubeletDown.
      absent: none
  indicator:
    ratio:
      errors:
        metric: kubelet_runtime_operations_errors_total{job="kubelet"}
      total:
        metric: kubelet_runtime_operations_total{job="kubelet"}
  target: "99.9"
  window: 7d