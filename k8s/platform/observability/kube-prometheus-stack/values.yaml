# Schemas come from the prometheus-operator-crds HelmRelease in k8s/crds/, which
# the `crds` layer applies before this one.
crds:
  enabled: false

global:
  rbac:
    # Ships two ClusterRoles labelled for aggregation into the built-in
    # view/edit/admin, covering monitoring.coreos.com. Without it a namespace
    # grant cannot touch the app's own ServiceMonitor or PrometheusRule -- which
    # is most of what an app in this repo is made of, 19 PrometheusRules and 12
    # ServiceMonitors across k8s/.
    #
    # The edit role covers the whole API group, so it also lets a tenant author
    # a Prometheus or an Alertmanager in their own namespace. Accepted: that is
    # upstream's own definition of user-facing, and the blast radius is one
    # namespace's resource budget. AlertmanagerConfig writes are inert today
    # because datalake-alerts/main sets no alertmanagerConfigSelector -- if one
    # is ever added, tenant-authored routing becomes live, so revisit this then.
    createAggregateClusterRoles: true

# The Prometheus and Alertmanager CRs are hand-written so their specs stay under
# our control: k8s/apps/datalake-metrics and k8s/apps/datalake-alerts.
prometheus:
  enabled: false
alertmanager:
  enabled: false

# Grafana runs in its own namespace; only the dashboards are wanted from here.
grafana:
  enabled: false
  forceDeployDashboards: true
  sidecar:
    dashboards:
      annotations:
        grafana_folder: kube-prometheus

defaultRules:
  create: true
  # Two reasons an alert lands here: its metric cannot exist on this cluster, so
  # the rule can only ever report as a pint finding; or a Pyrra SLO measures the
  # same thing and owns the budget instead. The second kind names its SLO.
  disabled:
    # Needs grpc_server_handling_seconds_bucket, which k3s's embedded etcd does
    # not export at all: the endpoint serves grpc_server_handled_total,
    # _started_total and _msg_* but zero histogram lines. Unlike
    # etcdHighNumberOfFailedGRPCRequests above, no relabeling change brings this
    # one back.
    etcdGRPCRequestsSlow: true

    # k3s manages kubelet certificates itself, so client-go's certificate
    # manager never runs and kubelet_certificate_manager_* is never registered.
    # 134 other kubelet_* families are present on job="kubelet", so this is a
    # property of k3s rather than a scrape gap, and nothing we configure
    # changes it.
    KubeletClientCertificateExpiration: true
    KubeletClientCertificateRenewalErrors: true
    KubeletServerCertificateExpiration: true
    KubeletServerCertificateRenewalErrors: true

    # aggregator_unavailable_apiservice_total was renamed upstream; only the
    # aggregator_unavailable_apiservice gauge exists on this Kubernetes.
    KubeAggregatedAPIErrors: true

    # node_md_* comes from node-exporter's mdadm collector, which emits nothing
    # without /proc/mdstat. No node here has mdraid. NodeRAIDDiskFailure is the
    # sibling on the same collector and was missed when NodeRAIDDegraded went.
    NodeRAIDDegraded: true
    NodeRAIDDiskFailure: true

    # node_systemd_* needs --collector.systemd, off by default and expensive
    # enough that it is not worth turning on to serve two alerts. If it is ever
    # enabled, delete these two lines rather than leaving the rules dark.
    NodeSystemdServiceFailed: true
    NodeSystemdServiceCrashlooping: true

    # kube_state_metrics_list_total has never existed across the full retention
    # on kube-state-metrics v2.20.0, while its watch_total counterpart is
    # populated -- so this is not the telemetry-port gap that selfMonitor above
    # fixed. Kubernetes 1.32+ enables WatchListClient by default, so reflectors
    # open a streaming WATCH with sendInitialEvents and never issue a LIST at
    # all. KubeStateMetricsWatchErrors still covers the failure this was for.
    KubeStateMetricsListErrors: true

    # Superseded by the prometheus-operator-reconcile-errors Pyrra SLO, which
    # divides the same two counters over a window instead of thresholding a 5m
    # rate. One budget engine: where a mixin alert and an SLO measure the same
    # thing, the SLO wins. Its siblings stay -- PrometheusOperatorListErrors and
    # PrometheusOperatorWatchErrors read *_operations_failed_total, which the
    # prometheus-operator-http-errors SLO does not cover.
    PrometheusOperatorReconcileErrors: true
  rules:
    # Both select on job names this release does not create.
    alertmanager: false
    prometheus: false
    # k3s runs the controller-manager and scheduler in-process, and kube-proxy is
    # disabled in favour of cilium.
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false
    # The group holds one recording rule,
    # node_namespace_pod_container:container_memory_swap. Swap is off on every
    # node, so cAdvisor reports the metric as a constant 0 and the record would
    # only copy zeros.
    #
    # Until chart 90 the kubelet ServiceMonitor dropped container_memory_swap
    # at scrape, which is why it looked absent. It no longer does: 684 series
    # across the four nodes, all 0 on 2026-11-10, are ingested now -- 0.15% of
    # the 457k in the head. Dropping them again means restating the whole of
    # kubelet.serviceMonitor.cAdvisorMetricRelabelings, eight entries that
    # would then stop following the chart.
    k8sContainerMemorySwap: false

    # KubeAPIErrorBudgetBurn and the burnrate records that feed it. The five
    # apiserver-* Pyrra SLOs measure the same requests, and both sides recorded
    # apiserver_request:burnrate30m and :burnrate1h -- the mixin labelled
    # verb=read|write, Pyrra labelled slo=. KubeAPIErrorBudgetBurn then reads
    # `sum by (cluster) (...)`, and no series here carries a cluster label, so
    # the sum collapsed every producer into one number and compared four
    # unrelated burn rates against one threshold. Nothing but the slos group
    # ever read the burnrate records, so both groups go together.
    #
    # kubeApiserverAvailability and kubeApiserverHistogram stay: they are
    # recording rules only, and the chart's own kube-apiserver dashboard reads
    # apiserver_request:availability30d and
    # cluster_quantile:apiserver_request_sli_duration_seconds:histogram_quantile.
    kubeApiserverSlos: false
    kubeApiserverBurnrate: false

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# Chart 90 took bearerTokenFile and tlsConfig.caFile out of the control-plane
# ServiceMonitors. The token now comes from a Secret named in `authorization`
# and the CA from the kube-root-ca.crt ConfigMap. The default Secret is the one
# the chart creates beside its own Prometheus, which is disabled here, so a
# component left on the default fails the render -- which held this release on
# 89.2.4 from 2026-09-17 (#1535).
#
# A ServiceMonitor can only name a Secret in its own namespace, and the
# Prometheus that scrapes these runs in datalake-metrics, so its own token
# cannot be the credential. control-plane-scraper is a ServiceAccount in this
# namespace that may read kubelet and apiserver metrics and nothing else; its
# four manifests sit beside this file.
#
# Each component gets what its endpoint demands, measured without credentials
# on 2026-11-10:
#
#   kubelet    :10250  401   needs the token
#   apiserver  :6443   401   needs the token
#   etcd       :2381   200   plain HTTP, authenticates nobody
#   coredns    :9153   200   plain HTTP, authenticates nobody
#
# The old default sent Prometheus's own token to all four, so etcd and coredns
# were handed a bearer token in clear text for nothing. Helm deep-merges maps,
# so only an explicit null removes the chart's default from those two.
kubeApiServer:
  serviceMonitor:
    authorization:
      type: Bearer
      credentials:
        name: control-plane-scraper-token
        key: token

coreDns:
  serviceMonitor:
    authorization: null

# k3s serves etcd metrics on 2381 (etcd-expose-metrics in metal/group_vars/k3s.yml).
kubeEtcd:
  enabled: true
  endpoints:
    - 192.168.50.31
    - 192.168.50.32
    - 192.168.50.35
  serviceMonitor:
    authorization: null
    # k3s runs apiserver, scheduler, controller-manager and kubelet in one
    # process behind a single merged registry, so scraping the etcd port also
    # returns everyone else's metrics: 3812 of the 5746 series on this job were
    # not etcd_* at all. Keep only what this job actually owns. `up` and the
    # scrape_* series are added after metric relabeling, so the 11 etcd alerts
    # that key off up{job="kube-etcd"} are unaffected.
    #
    # grpc_server_handled_total is here because "what this job owns" is not the
    # same set as "names starting with etcd_", and the first regex assumed it
    # was. The metric is etcd's own gRPC server -- the services carrying traffic
    # are etcdserverpb.KV (4.6M Range, 2.3M Txn), etcdserverpb.Lease and
    # etcdserverpb.Watch -- and dropping it killed
    # etcdHighNumberOfFailedGRPCRequests, which had been working until #1267.
    #
    # It is the only etcd alert that sees failures from the client's side. The
    # other eleven cover availability, raft, latency and capacity, but none of
    # them fires when the backend quota trips and etcd starts returning
    # ResourceExhausted to every write: proposals are rejected before they can
    # fail, so etcdHighNumberOfFailedProposals stays quiet while the cluster is
    # effectively read-only.
    #
    # Cost, measured on 192.168.50.31:2381: 748 series per endpoint, 2244 across
    # the three. 738 of the 748 are permanently zero -- only OK and Canceled
    # ever move -- so they cost head-index memory rather than disk. That takes
    # job="kube-etcd" from 1950 series to roughly 4200, or 0.5% of the 453970 in
    # the head.
    metricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: etcd_.*|grpc_server_handled_total

kubelet:
  serviceMonitor:
    authorization:
      type: Bearer
      credentials:
        name: control-plane-scraper-token
        key: token
    metricRelabelings:
      # Chart default, repeated because setting this key replaces it wholesale.
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      # The same merged registry means the kubelet port re-exports the entire
      # apiserver metric set -- 165441 series, exactly the count on
      # job="apiserver". Worse than redundant: the apiserver ServiceMonitor
      # drops histogram buckets for cardinality and this one does not, so any
      # query spanning both jobs takes its numerator and denominator from
      # different populations. That is what made the apiserver latency SLOs
      # read 51% against a 99% target (#1247).
      #
      # Checked before dropping: of the 180 rule selectors that do not pin a
      # job, the only bucket ones need le 0.1 and 1.0, and both survive on
      # job="apiserver" with identical series counts.
      - action: drop
        sourceLabels: [__name__]
        regex: apiserver_.*

nodeExporter:
  operatingSystems:
    aix:
      enabled: false
    darwin:
      enabled: false

prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 5m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  # Without this kube_persistentvolumeclaim_labels has no series at all, and the
  # mixin's KubePersistentVolumeFillingUp rule ends with
  # `unless ... kube_persistentvolumeclaim_labels{label_excluded_from_alerts="true"}`
  # -- an exclusion that can never match. Allowlisting the one label turns that
  # clause back on without the cardinality cost of `*`.
  metricLabelsAllowlist:
    - persistentvolumeclaims=[excluded_from_alerts]
  # kube-state-metrics serves its own telemetry on a second port, and the chart
  # leaves that port off the Service by default. Four mixin alerts key off it --
  # KubeStateMetricsListErrors, KubeStateMetricsWatchErrors,
  # KubeStateMetricsShardingMismatch, KubeStateMetricsShardsMissing -- and all
  # four were dead, with pint reporting no series for kube_state_metrics_*
  # in the last 1w. The exporter cannot report that it has stopped seeing the
  # API server unless it is scraped about itself.
  selfMonitor:
    enabled: true
  # Flux stopped exporting gotk_reconcile_condition, which took the
  # reconciliation alert with it -- the only one that fires when a Kustomization
  # or HelmRelease stops reconciling. flux2 still exports
  # gotk_reconcile_duration_seconds, so the controllers look scraped and healthy
  # while nothing watches whether they are succeeding.
  #
  # kube-state-metrics reads the Ready condition straight off the CRs instead,
  # which does not depend on the controllers exporting anything. This is the
  # gotk_resource_info shape the Flux project publishes, matching what
  # platform/helm-charts already runs, so the two clusters stay queryable the
  # same way. Info emits one series per object carrying ready, suspended and
  # revision as labels.
  #
  # Verified against this cluster with kube-state-metrics v2.20.0 before
  # merging: one series per object, all 100 Kustomizations and HelmReleases
  # carrying ready="True".
  #
  # Two things the alert depends on, both confirmed by that run rather than
  # assumed:
  #   - When spec.suspend is unset -- which is every object here -- the
  #     suspended label is omitted entirely rather than rendered "false". The
  #     alert must therefore say suspended!="true"; suspended="false" would
  #     match nothing and the alert could never fire.
  #   - revision is the git SHA on a Kustomization, so it changes on every
  #     commit. The alert aggregates it away, or a stuck object's series
  #     identity would change under it and reset the `for` clock whenever
  #     anyone pushes.
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: kustomize.toolkit.fluxcd.io
              version: v1
              kind: Kustomization
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Kustomization resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, lastAppliedRevision ]
                  source_name: [ spec, sourceRef, name ]
          - groupVersionKind:
              group: helm.toolkit.fluxcd.io
              version: v2
              kind: HelmRelease
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux HelmRelease resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, history, "0", chartVersion ]
                  chart_name: [ status, history, "0", chartName ]
                  chart_app_version: [ status, history, "0", appVersion ]
                  chart_ref_name: [ spec, chartRef, name ]
                  chart_source_name: [ spec, chart, spec, sourceRef, name ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: GitRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux GitRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  url: [ spec, url ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux HelmRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  url: [ spec, url ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: OCIRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux OCIRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  url: [ spec, url ]
  rbac:
    # customResourceState reads the CRs directly, so the ServiceAccount needs
    # list/watch on each group above. Without these the exporter starts, logs a
    # permission error per kind and serves no gotk_ series at all.
    extraRules:
      - apiGroups:
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
          - source.toolkit.fluxcd.io
        resources: ["*"]
        verbs: ["list", "watch"]
  # The limit was 180Mi, and that sat 8Mi under the exporter's own peak. It
  # runs at 107-116Mi, but a start or a relist loads every object at once, and
  # at the limit the kernel's OOM killer took it: 14 times on master01 between
  # 2026-10-17 and 2026-11-10, "Memory cgroup out of memory" in the kernel log
  # with usage at the 184320kB limit, OOMKilled and exit 137 in the pod's own
  # status. Those kills were every NodeProblemOOMKilling that node raised
  # (#1540).
  #
  # container_oom_events_total says nothing either way: it reads 0 for every
  # container on this cluster, the ones the kernel killed included. What names
  # a victim is node-problem-detector's log, which quotes the kernel line, and
  # kube_pod_container_status_last_terminated_reason until the pod is replaced.
  #
  # 360Mi went in as twice the old limit, before a peak could be measured: every
  # sample until then was clipped at 180Mi. The first start under it reached
  # 188Mi (container_memory_max_usage_bytes), so it is 1.9x the measured peak.
  # The request follows the steady state.
  resources:
    requests:
      cpu: 2m
      memory: 120Mi
    limits:
      memory: 360Mi

prometheus-node-exporter:
  # Replaces the chart default wholesale: k3s keeps containerd under /run/k3s.
  # The textfile directory has no producer today -- smartctl-exporter took over
  # SMART and the apt and lvm collectors are gone -- but the mount stays for
  # lvm-diskprep, which writes there once topolvm-system/diskprep is enabled.
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/k3s/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.netclass.ignored-devices=^(veth.*|[a-f0-9]{15})$
    - --collector.netdev.device-exclude=^(veth.*|[a-f0-9]{15})$
    - --no-collector.wifi
    - --no-collector.hwmon
    - --no-collector.btrfs
    - --collector.textfile.directory=/host/textfile
  extraHostVolumeMounts:
    - name: textfile
      hostPath: /var/lib/node_exporter
      mountPath: /host/textfile
      readOnly: true
      mountPropagation: HostToContainer
  resources:
    requests:
      cpu: 2m
      memory: 20Mi
    limits:
      memory: 180Mi
