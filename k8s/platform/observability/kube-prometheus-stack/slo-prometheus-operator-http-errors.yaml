apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: prometheus-operator-http-errors
spec:
  # target from the 7d window 2026-09-03..09-10 (#1379): no 5xx at all over 61k
  # requests. 99.9 rather than tighter because the denominator is small
  # enough that a handful of errors moves it a long way.
  description: ""
  alerting:
    name: PrometheusOperatorHTTPBudgetBurn
    absentName: PrometheusOperatorHTTPMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    ratio:
      errors:
        metric: prometheus_operator_kubernetes_client_http_requests_total{job="kube-prometheus-stack-operator",status_code=~"5.."}
      total:
        metric: prometheus_operator_kubernetes_client_http_requests_total{job="kube-prometheus-stack-operator"}
  target: "99.9"
  window: 7d