apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  labels:
    prometheus: k8s
    role: alert-rules
  name: apiserver-read-response-errors
spec:
  # target from the 7d window 2026-09-03..09-10 (#1379): 99.99854% achieved
  # over 13.7M requests, 1.5% of a 99.9% budget.
  description: ""
  alerting:
    name: KubeAPIServerReadErrorBudgetBurn
    absentName: KubeAPIServerReadErrorMetricAbsent
    severities:
      fastBurn: info
      mediumBurn: info
      slowBurn: none
      longTermBurn: none
      absent: warning
  indicator:
    ratio:
      errors:
        metric: apiserver_request_total{component="apiserver",verb=~"LIST|GET",code=~"5.."}
      total:
        metric: apiserver_request_total{component="apiserver",verb=~"LIST|GET"}
  target: "99.9"
  window: 7d