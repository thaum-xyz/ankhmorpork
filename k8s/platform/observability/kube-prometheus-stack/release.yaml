apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.6.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 5m
  interval: 5m
  timeout: 15m
  install:
    timeout: 15m
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    crds: Skip
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: values-kube-prometheus-stack
