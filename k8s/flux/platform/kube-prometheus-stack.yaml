apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 15m0s
  path: ./k8s/platform/observability/kube-prometheus-stack
  # Tombstone: platform-observability reconciles this path now. Suspended and
  # non-pruning so that deleting the live object leaves its inventory --
  # pruning is inventory-based, and this one still holds every object.
  prune: false
  suspend: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
