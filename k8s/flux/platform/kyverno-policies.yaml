apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  dependsOn:
    - name: kyverno
  interval: 15m0s
  path: ./k8s/platform/security/kyverno/policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
