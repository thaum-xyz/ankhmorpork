apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-versity-gw
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      The S3 gateway the fleet's postgres backups are written to.

      Its own Kustomization rather than a directory under the cnpg component,
      because it outlived the cnpg-system namespace: it was stood up empty in
      platform-storage beside the old gateway, the data was copied across on the
      NAS, and the old one was removed once the clusters were repointed.
spec:
  interval: 15m0s
  path: ./k8s/platform/storage/cnpg-versity-gw
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    # The claim is unifi-nas, so it needs the provisioner. csi-nfs also ships
    # mutate-nfs-pvc-alert-exclusion, which is failurePolicy: Fail on PVC CREATE
    # for this storage class -- but csi-nfs already declares its own dependency
    # on kyverno, so naming kyverno here too would restate a fact that has a home
    # somewhere else.
    - name: csi-nfs
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
