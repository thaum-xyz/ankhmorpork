apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smartctl-exporter
  namespace: flux-system
spec:
  interval: 15m0s
  path: ./k8s/platform/observability/smartctl-exporter
  prune: true
  # Borrows the prometheus-community HelmRepository and the namespace from the
  # metrics stack rather than declaring a second copy of either.
  dependsOn:
    - name: kube-prometheus-stack
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
