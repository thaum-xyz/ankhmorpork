apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piraeus-datastore
  namespace: flux-system
spec:
  interval: 30m0s
  path: ./k8s/platform/storage/piraeus-datastore
  # Tombstone: platform-storage reconciles this path now. Suspended and
  # non-pruning so that deleting the live object leaves its inventory --
  # pruning is inventory-based, and this one still holds every object.
  prune: false
  suspend: true
  dependsOn:
    - name: topolvm
    # The roaming size policy ships with this component, so the Kyverno CRDs
    # have to exist before it applies. Same reason csi-nfs depends on kyverno.
    - name: kyverno
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
