apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-nfs
  namespace: flux-system
spec:
  # The MutatingPolicy needs kyverno's CRDs, as kyverno-policies does.
  dependsOn:
    - name: kyverno
  interval: 15m0s
  path: ./k8s/platform/storage/csi-nfs
  # Tombstone: platform-storage reconciles this path now. Suspended and
  # non-pruning so that deleting the live object leaves its inventory --
  # pruning is inventory-based, and this one still holds every object.
  prune: false
  suspend: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
