apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-problem-detector
  namespace: flux-system
spec:
  suspend: true # FIXME(paulfantom): Temporary measure to prevent re-sync of all apps
  interval: 30m0s
  path: ./k8s/platform/cluster/node-problem-detector
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
