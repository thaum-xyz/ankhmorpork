apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mealie
  namespace: mealie
  annotations:
    kubernetes.io/description: >-
      The first app Kustomization to live in its own namespace rather than in
      flux-system, which is the whole point of it: kustomize-controller resolves
      --default-service-account in the OBJECT's namespace, so this reconciles as
      mealie's own flux-reconciler instead of flux-system's cluster-admin one.

      What that buys is a ceiling. That ServiceAccount is bound with a
      RoleBinding, so this Kustomization can apply anything namespaced in mealie
      and nothing anywhere else -- no ClusterRoles, no Namespaces, no reading
      another namespace's Secrets. Repointing spec.path at another component
      would not widen it; the apply would simply be denied.

      sourceRef names the GitRepository in this namespace, not flux-system's:
      --no-cross-namespace-refs=true forbids the latter. That source is created
      beside the Namespace in k8s/namespaces/mealie/, because a Kustomization can
      create neither the source it reads nor the identity it applies as.
spec:
  interval: 15m0s
  path: ./k8s/apps/mealie
  prune: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
