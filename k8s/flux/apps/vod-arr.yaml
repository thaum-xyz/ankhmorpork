apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vod-arr
  namespace: flux-system
  annotations:
    kubernetes.io/description: >-
      Suspended and non-pruning until the next commit, which recreates this
      Kustomization in its app's own namespace.

      Moving it is a delete-and-create, and the `apps` umbrella is prune: false,
      so removing this file would leave the object here running and fighting its
      replacement over every object. `prune: false` is the other half: this
      object's inventory IS the app's objects, including the PersistentVolumes
      being hoisted alongside, so deleting it while pruning was enabled would
      collect them.
spec:
  interval: 60m0s
  path: ./k8s/apps/vod-arr
  prune: false
  suspend: true
  sourceRef:
    kind: GitRepository
    name: ankhmorpork
